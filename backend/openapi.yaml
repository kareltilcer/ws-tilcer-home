  # ---------------- Labels ----------------
  /api/boards/{id}/labels:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [labels]
      summary: List a board's labels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [labels]
      summary: Create a label on a board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/labels/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [labels]
      summary: Update a label
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelCreate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [labels]
      summary: Delete a label (detaches from all cards)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
