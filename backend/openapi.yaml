        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ---------------- Finance (v6) ----------------
  /api/finance/months:
    get:
      tags: [finance]
      summary: List months with their computed split (newest first)
      description: >-
        Every saved month, newest first, each carrying its INPUTS (two incomes + the
        four rates) and its DERIVED split. The split is computed on read and never
        stored (PRD D82) — storing only the inputs is what keeps the locked formula
        the single source of truth. Reads are open to any authenticated member,
        `reader` included (PRD D84).
      parameters:
        - $ref: "#/components/parameters/Limit"
        # NOT the shared Cursor parameter, which is a UUIDv7: finance keysets on
        # `month`, because the user-visible order is by month and month is unique
        # (ordering by id would put a back-filled month in the wrong place). The
        # cursor is therefore the previous page's last `month` key, and an id
        # passed here would be compared lexically against `month` and silently
        # return a wrong or empty page.
        - name: cursor
          in: query
          description: >-
            Keyset cursor from the previous page's `next_cursor` — a YYYY-MM month
            key, NOT a UUIDv7. Returns the months strictly older than it.
          schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMonthPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [finance]
      summary: Record a month
      description: >-
        Persists the inputs only; the split comes back computed. `month` is UNIQUE.
        The four rates must sum to exactly 100 — enforced in the service AND by a
        table CHECK.
        Requires `editor`/`admin`; audited as `finance.month.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceMonthCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMonth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/finance/months/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [finance]
      summary: Get one month (inputs + computed split)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMonth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [finance]
      summary: Correct a month (incomes, rates, or the month itself)
      description: >-
        Partial update. `rates`, IF PRESENT, must be the complete four-value block
        summing to 100 — a single rate is meaningless on its own, so a partial rates
        object is rejected 422. Changing `month` must not collide with another row (409). The split is recomputed and returned. Requires `editor`/`admin`;
        audited as `finance.month.update` WITH a field-level diff, so a rate
        correction is traceable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceMonthUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMonth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [finance]
      summary: Delete a month (PERMANENT)
      description: >-
        Removes the row outright — carried over from `fin` (PRD D87). There is no
        soft delete, no `hard` flag and no admin tier: an ordinary `editor`/`admin`
        write. The month becomes re-enterable immediately. Because nothing is
        recoverable from the table afterwards, the `month.delete` audit event carries
        a FULL-ROW DIFF (month, both incomes, all four rates) — that event is the only
        surviving record of the deleted values. The UI must confirm and state that the
        deletion cannot be undone.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- garden (v7)
  # Zahrada — crop knowledge base, bed plan, plan checks, work calendar.
  # Reads are open to `reader`; writes require `editor`/`admin` + CSRF. Exactly one
  # admin-only route (season reopen). The module sends NO push and owns NO audience:
  # frost reaches a device through Administrace's v5 machinery (PRD D113).
  /api/garden/plants:
    get:
      tags: [garden]
      summary: List crops (knowledge base, species level)
      description: >-
        Free-text search runs over name, Latin name, notes and pest/disease names
        (FTS5). Filters compose. Ordered by Czech collation on `name_cs`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: q, in: query, schema: { type: string } }
        - { name: family, in: query, schema: { $ref: "#/components/schemas/GardenFamily" } }
        - { name: plant_type, in: query, schema: { $ref: "#/components/schemas/GardenPlantType" } }
        - { name: unverified, in: query, description: Only LLM-sourced crops nobody has confirmed., schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPlantPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [garden]
      summary: Create a crop
      description: >-
        `family` and `hardiness` are REQUIRED (PRD D104, D111): the rotation engine
        joins on the first and the frost logic reads the second, so a crop without
        them is one the module cannot reason about. `rotation_break_years` defaults
        from the family; `plants_per_m2` derives from the two spacings when omitted.
        Requires `editor`/`admin`; audited as `garden.plant.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenPlantCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPlant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/plants/prompt-template:
    get:
      tags: [garden]
      summary: Generate the LLM prompt for filling a crop record
      description: >-
        Returns a ready Czech prompt embedding the JSON schema GENERATED FROM THE
        IMPORTER'S OWN VALIDATOR (PRD D114) plus the household's context (climate,
        the garden's frost dates, altitude). Because one registry produces the
        validator, this schema and /api/garden/enums, a prompt cannot ask a model
        for a field the importer would reject.

        The template is always the CROP shape. There is no `target` switch and no `name`
        parameter as built — the importer only accepts crops (see /api/garden/plants/import),
        so a variety or rule prompt would ask for something nothing could take back in.
      parameters:
        - { name: plant_id, in: query, description: "When updating an existing crop, its current values are included so the model fills gaps instead of overwriting. An unknown id is a 404.", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPromptTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/garden/plants/import:
    post:
      tags: [garden]
      summary: Import crops from LLM-produced JSON
      description: >-
        CROPS ONLY as built. The body is a single crop object or an ARRAY of them, so
        twenty crops arrive in one paste; an element without `name_cs` is rejected.
        There is no variety and no rule import — /api/garden/export emits both, but
        nothing here reads them back, so the PRD D126 round trip is NOT shipped.

        Each element validates independently and the response reports per-element
        status, so three bad rows out of twenty do not cost the other seventeen. Enum
        matching is lenient (Czech words map to enum members) but an unmappable enum
        rejects that element naming field and value — NEVER a silent default. A body
        that is not JSON at all, is empty, or carries more than 200 elements fails the
        whole request instead.

        With `dry_run=true` (the default) nothing is persisted and the response is a
        preview: the resulting record, a field-level diff when it updates an existing
        row, and the input fields that could not be mapped. Applying records
        `source=llm` + model + timestamp and badges the row "neověřeno" until a
        member verifies it. Requires `editor`/`admin`; audited as
        `garden.plant.create` / `garden.plant.update` per applied element.
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean, default: true } }
        - { name: model, in: query, description: "Which model produced the JSON, recorded verbatim on every applied row as `source_model` provenance and echoed back on the result. Free text, because the name is evidence rather than an enum.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenImportRequest" }
      responses:
        "200":
          description: Preview (dry_run=true) or applied result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: Payload above the configured import cap }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/export:
    get:
      tags: [garden]
      summary: Export the knowledge base (plants, varieties, rules)
      description: >-
        A readable backup and a way to move the knowledge base between installs. Pairs
        in `rules` export by LABEL rather than by id, since an id from this database
        means nothing in the next.

        ⚠ AS BUILT, NOT AS DESIGNED. This is a SUPERSET of what can be imported, so the
        PRD D126 round trip is NOT shipped: `plants` re-imports through
        /api/garden/plants/import, but `varieties` and `rules` are EXPORT-ONLY — the
        importer accepts a crop object or an array of crop objects and nothing else, and
        feeding it this document back rejects every element. Treat the file as a record
        of the knowledge base, not as a restore.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/garden/plants/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: Get one crop
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPlant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [garden]
      summary: Update a crop
      description: >-
        Partial update; omitted fields are left alone. Setting `verified_by` clears
        the "neověřeno" badge. Audited as `garden.plant.update` WITH a field-level
        diff — a changed sowing window is exactly the kind of edit the Log exists to
        explain.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenPlantUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPlant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [garden]
      summary: Delete a crop (soft)
      description: >-
        Soft delete, per the house rule. Refused with 409 while any live planting
        references the crop — history would otherwise lose the thing it is history of.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/plants/{id}/varieties:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: List a crop's varieties
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenVarietyPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [garden]
      summary: Create a variety
      description: >-
        Every timing/spacing/maturity/yield/storage field is NULLABLE and means
        "inherit from the species" (PRD D103). Send only what actually differs.
        Audited as `garden.variety.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenVarietyCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenVariety" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/varieties/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: Get one variety (with resolved effective values)
      description: >-
        Returns both the variety's own (sparse) values and the RESOLVED effective
        record — variety value if non-null, else species value — computed by the one
        shared resolution function (PRD D103).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenVariety" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [garden]
      summary: Update a variety
      description: >-
        Setting a field to null RESTORES inheritance from the species; omitting it
        leaves the override alone. Renaming onto a name another live variety of the same
        species already holds is a 409. Audited as `garden.variety.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenVarietyUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenVariety" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [garden]
      summary: Delete a variety (soft)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/beds:
    get:
      tags: [garden]
      summary: List beds (by zone, then lexorank order)
      description: >-
        The returned order is not cosmetic: consecutive beds within one `zone` are
        NEIGHBOURS (PRD D117), which is the whole adjacency model behind check C11.

        UNPAGED as built: every bed comes back in one response, ordered
        `zone, position, id`. There is no `limit`, no `cursor` and no `zone` filter —
        the planner needs the whole adjacency chain to render at all, and a garden has
        tens of beds rather than thousands.
      parameters:
        - { name: include_inactive, in: query, description: "Also return retired beds; by default only active ones come back.", schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenBedPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [garden]
      summary: Create a bed
      description: >-
        `area_m2` derives from `length_cm × width_cm` when omitted and may be set
        explicitly for irregular shapes — but one of the two must be there: a body
        carrying neither `area_m2` nor BOTH dimensions is a 422, because a bed with no
        area cannot be sized, over-booked or checked. Audited as `garden.bed.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenBedCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenBed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/beds/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: Get one bed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenBed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [garden]
      summary: Update a bed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenBedUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenBed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [garden]
      summary: Delete a bed (soft)
      description: >-
        Refused with 409 while the bed holds plantings in an open season — delete the
        plantings or close the season first.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/beds/{id}/move:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [garden]
      summary: Reorder a bed (lexorank) — and thereby change adjacency
      description: >-
        Moves the bed between two siblings, optionally into another zone. Because
        order IS adjacency (PRD D117), this is the only place the garden's physical
        layout is expressed — the response therefore includes the neighbours the bed
        now has, so the UI can re-run the check without guessing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenBedMove" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenBed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/beds/{id}/history:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: What grew in this bed, by closed season
      description: >-
        The read model behind the planner's rotation column and behind checks C3/C8.
        Reads CLOSED seasons only (PRD D120) — an unfinished plan is not history — so
        on a fresh install this is empty and the UI says "chybí historie" rather than
        implying the bed is safe.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenBedHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/garden/seasons:
    get:
      tags: [garden]
      summary: List seasons (newest year first)
      description: >-
        UNPAGED as built: every season comes back in one response. There is no `limit`
        and no `cursor` — a household accumulates one row a year, so a page boundary
        would only ever hide the beginning of the garden's own history.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenSeasonPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [garden]
      summary: Create a season, optionally copying and shifting a previous one
      description: >-
        With `copy_from`, every non-permanent planting of that year is copied; with
        `shift`, EVERY planting slides that many beds from its OWN bed over the ordered
        active beds, wrapping at the end — so a family spread across A1 and A3 lands on
        A2 and A4 and keeps its shape. (`shift.by_family` is accepted but has no effect;
        see the schema.) An offset larger than the number of beds is a 422. Planned
        dates re-anchor against the NEW season's frost dates — frost-anchored windows
        move, week-anchored ones stay (PRD D102).

        A `copy_from` onto a year that ALREADY EXISTS fills that season's plan instead of
        inserting a row, and is audited as `garden.season.update`; a target that already
        holds plantings is a 409, since a second copy would duplicate every one of them.
        A bare create on a taken year is a 409 too.

        With `dry_run=true` nothing is persisted and the response carries the
        prospective plan PLUS its check (PRD D129), so the UI can show what the shift
        fixed and what it broke before the season exists. A copy that silently
        reproduces last year's rotation error is worse than typing the year in by hand.
        Audited as `garden.season.create`.
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenSeasonCreate" }
      responses:
        "200":
          description: Preview (dry_run=true) — nothing was persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenSeasonPreview" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenSeason" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/seasons/{year}:
    parameters:
      - $ref: "#/components/parameters/GardenYear"
    get:
      tags: [garden]
      summary: Get one season
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenSeason" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [garden]
      summary: Update a season (frost dates, status, notes)
      description: >-
        Changing `last_frost_on` / `first_frost_on` RE-ANCHORS every frost-anchored
        planned date in the season that the user has not manually overridden; the
        response reports how many dates moved. Refused with 409 on a closed season.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenSeasonUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenSeason" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/seasons/{year}/close:
    parameters:
      - $ref: "#/components/parameters/GardenYear"
    post:
      tags: [garden]
      summary: Uzavřít sezónu — lock the year and write it into rotation history
      description: >-
        Records the observed frost dates and each planting's final outcome, then sets
        `status=closed`. THIS IS THE ONLY THING THAT CREATES ROTATION HISTORY (PRD
        D120): until a season is closed, checks C3 and C8 return `no_history`.
        A closed season is read-only to `editor`. Audited as `garden.season.close`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenSeasonClose" }
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenSeason" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/seasons/{year}/reopen:
    parameters:
      - $ref: "#/components/parameters/GardenYear"
    post:
      tags: [garden]
      summary: Re-open a closed season (ADMIN ONLY)
      description: >-
        The module's only admin-gated route (PRD D120). Re-opening rewrites the
        rotation history that checks C3 and C8 read, so it is deliberately not an
        ordinary editor action. Audited as `garden.season.reopen`.
      responses:
        "200":
          description: Re-opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenSeason" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/seasons/{year}/check:
    parameters:
      - $ref: "#/components/parameters/GardenYear"
    get:
      tags: [garden]
      summary: Kontrola plánu — run every check over the season
      description: >-
        Eleven checks computed ON READ and never stored (PRD D108): C1 companions
        over OVERLAPPING OCCUPANCY, C2 same family in a bed, C3 rotation, C4 bed
        over-booked, C5 workload spike, C6 family concentration, C7 empty active bed,
        C8 feeder succession, C9 frost-risky transplant, C10 date outside the crop's
        window, C11 adjacent-bed companions and seed-saving cross-pollination.

        C3 and C8 read CLOSED seasons only; with none they return status
        `no_history` rather than a pass — a check that cannot run must not look like
        one that ran and found nothing. Dismissed warnings are ALWAYS returned, carrying
        `dismissed=true` and their note: a warning that vanished could not be restored
        from a screen that never shows it. A warning NEVER blocks a save (PRD D109);
        this endpoint is advisory, always.

        The whole season is checked every time. As built there is no `bed_id` filter and
        no `include_dismissed` switch — the panel filters client-side.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenCheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/garden/seasons/{year}/check/dismissals:
    parameters:
      - $ref: "#/components/parameters/GardenYear"
    post:
      tags: [garden]
      summary: Silence one warning for this season
      description: >-
        The `key` is the warning's stable key, derived from (check, rule, bed, sorted
        plantings, season, per-check discriminator). Change the plan enough that the key
        changes and the warning correctly comes back. Audited as `garden.season.update`.

        THE RESPONSE IS THE RECOMPUTED CHECK, not the dismissal — 200 rather than 201,
        because the caller's next question is always "what does the panel say now" and a
        second GET to answer it would render a panel one edit out of date. Dismissing the
        same key twice is an upsert (it refreshes the note and the stamp), so there is no
        conflict to report.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenWarningDismissal" }
      responses:
        "200":
          description: Dismissed — the season's recomputed check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenCheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/seasons/{year}/check/dismissals/{key}:
    parameters:
      - $ref: "#/components/parameters/GardenYear"
      - { name: key, in: path, required: true, schema: { type: string } }
    delete:
      tags: [garden]
      summary: Restore a dismissed warning
      responses:
        "204": { description: Restored }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/garden/plantings:
    get:
      tags: [garden]
      summary: List plantings
      description: >-
        `permanent=true` returns the trvalky/dřeviny view — plantings with no season
        (PRD D106). Omitting both `year` and `permanent` returns everything.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: year, in: query, description: "The season's YEAR, matching how seasons are addressed (PRD D128). A non-numeric value is a 422.", schema: { type: integer } }
        - { name: bed_id, in: query, schema: { type: string } }
        - { name: plant_id, in: query, schema: { type: string } }
        - { name: permanent, in: query, schema: { type: boolean } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/GardenPlantingStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPlantingPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [garden]
      summary: Plant something into a bed
      description: >-
        Exactly one of `area_m2` / `plant_count` is required. Planned dates default
        from the resolved (species+variety) windows against the season's frost dates;
        any date sent explicitly is flagged manual and survives every later re-anchor.
        A planting belongs to the season of its HARVEST (PRD D105), so a sow date
        legitimately falls in the previous calendar year. Creation triggers task
        generation. Audited as `garden.planting.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenPlantingCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPlanting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/plantings/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: Get one planting (with occupancy, drift and yield)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPlanting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [garden]
      summary: Update a planting (planned or actual dates, quantity, status)
      description: >-
        Recording an ACTUAL date changes NO planned window (PRD D119) — the response's
        `drift` block states the difference instead, and POST …/shift-tasks is the
        explicit way to move the work. Changing a PLANNED date, the bed, the variety or
        the quantity re-runs generation under the D110 rules.

        THE CROP CANNOT BE CHANGED HERE. `plant_id` is not in the update schema and a
        body carrying one is ignored rather than honoured — a planting that became a
        different crop would take its harvests, its rotation history and its generated
        work with it. Delete the planting and create the right one.

        Refused with 409 in a closed season. Audited as `garden.planting.update` with a
        field-level diff.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenPlantingUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPlanting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [garden]
      summary: Delete a planting (soft) and its generated open tasks
      description: >-
        Generated tasks that are still open go with it; completed ones are kept,
        because they record work that actually happened.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/plantings/{id}/shift-tasks:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [garden]
      summary: Shift this planting's remaining work by N days
      description: >-
        The explicit counterpart to D119: since actual dates never re-drive the plan,
        this is how a late sowing moves the work that follows it. Shifts the
        planting's OPEN tasks (optionally only those of certain kinds) and marks each
        one `is_edited`, which by D110 means regeneration will never touch them again.
        Audited as `garden.task.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenShiftTasks" }
      responses:
        "200":
          description: Shifted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenTaskPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/tasks:
    get:
      tags: [garden]
      summary: The work calendar
      description: >-
        Tasks whose window OVERLAPS [from, to] — not tasks that start inside it, which
        would hide every job already under way. Ordered by `window_from`, then lexorank
        `position`, then id; there is NO overdue-first term in the query as built — the
        `garden.prace` widget groups overdue work itself, off the `overdue` flag every
        row carries. This is otherwise the same selection that widget renders.

        THIS COLLECTION'S `cursor` IS NOT THE HOUSE UUIDv7 ONE. Because the sort does not
        lead with the id, the cursor is an OPAQUE COMPOSITE of
        `(window_from, position, id)`; anything else is a 422. Pass back exactly what the
        previous page returned.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OpaqueCursor"
        - { name: from, in: query, description: "Overlap bound, with `to`: matches work whose window touches the range.", schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: to_end, in: query, description: "The OVERDUE bound — matches only work whose WHOLE window has passed (`window_to <= to_end`). It is the opposite of the `from`/`to` overlap, which excludes exactly the rows this returns, so missed work needs its own query. This is what `garden.tasks_overdue` selects on.", schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/GardenTaskStatus" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/GardenTaskKind" } }
        - { name: bed_id, in: query, schema: { type: string } }
        - { name: planting_id, in: query, schema: { type: string } }
        - { name: year, in: query, description: "The season's YEAR, matching how seasons are addressed (PRD D128). A non-numeric value is a 422.", schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenTaskPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [garden]
      summary: Create a manual task
      description: >-
        Manual tasks (`is_generated=false`) are never touched by regeneration. This is
        also the only way to create `water` / `weed` work, which is deliberately not
        generated (PRD D118). Audited as `garden.task.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenTaskCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: Get one task
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [garden]
      summary: Edit a task (window, title, notes, skip)
      description: >-
        Editing a GENERATED task sets `is_edited=true`, after which regeneration
        leaves it alone permanently (PRD D110). `status=skipped` is set here;
        completion has its own idempotent endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenTaskUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [garden]
      summary: Delete a task
      description: >-
        Deleting a GENERATED task writes a tombstone (`suppressed`), so the next
        regeneration does not resurrect it (PRD D110).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/tasks/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [garden]
      summary: Tick a task off (IDEMPOTENT)
      description: >-
        Completing an already-completed task is a 200, not a 409 (PRD D131) — the
        dashboard's 2000 ms hold gesture can fire twice on a bad connection, and the
        second send must not look like an error. Called from the widget with
        `meta.via="dashboard"`. An ordinary `editor` write: there is no `reader`
        exception anywhere in this module (PRD D124). Audited as `garden.task.update`.

        The 409 below is the CLOSED-SEASON guard only — it never means "already
        complete", which is the whole of D131.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenTaskComplete" }
      responses:
        "200":
          description: Completed (or already complete)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/tasks/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [garden]
      summary: Un-tick a task (IDEMPOTENT)
      description: >-
        Completion's inverse and equally idempotent: re-opening an already-open task is a
        200 carrying the same task. The 409 below is the CLOSED-SEASON guard only — it
        never means "already open". Audited as `garden.task.update`.
      responses:
        "200":
          description: Re-opened (or already open)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/harvests:
    get:
      tags: [garden]
      summary: List harvest entries
      description: >-
        Filtered by season year and by planting only. There is no date-range filter as
        built — a season IS the date range anyone asks for here, and it is the same
        clause `garden.harvest_season` sums, so a page and the dashboard cannot disagree.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: year, in: query, description: "The season's YEAR, matching how seasons are addressed (PRD D128). A non-numeric value is a 422.", schema: { type: integer } }
        - { name: planting_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenHarvestPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [garden]
      summary: Record a harvest
      description: >-
        `unit` defaults to the crop's `harvest_unit`, so the form never asks. Note
        that `garden.harvest_season` sums KG ONLY — rows in ks/l/svazek are excluded
        from the metric, and the UI says so rather than adding apples to bunches.
        A date before the crop reached its bed is a 422, and a harvest reaches its
        season through its planting, so all three write routes here are refused with 409
        once that season is closed — these rows ARE the history C3 and C8 read.
        Audited as `garden.harvest.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenHarvestCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenHarvest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/harvests/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: Get one harvest entry
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenHarvest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [garden]
      summary: Correct a harvest entry
      description: Refused with 409 once the planting's season is closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenHarvestUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenHarvest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [garden]
      summary: Delete a harvest entry (soft)
      description: Refused with 409 once the planting's season is closed.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/storage:
    get:
      tags: [garden]
      summary: What is in the sklad
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/GardenStorageStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenStorageItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [garden]
      summary: Put produce into storage
      description: >-
        Garden produce only (PRD D121) — a jar of bought olives has no business here.
        Audited as `garden.storage.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenStorageItemCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenStorageItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/storage/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: Get one storage item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenStorageItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [garden]
      summary: Take some out, or mark it spoiled
      description: >-
        Consumption is recorded by editing `quantity_remaining` IN PLACE (PRD D121);
        there is no movements table, because the audit spine's field diffs already
        answer "when did we eat the last jar". Reaching zero sets `status=consumed`
        automatically. Audited as `garden.storage.update` with a field-level diff —
        which IS the consumption history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenStorageItemUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenStorageItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [garden]
      summary: Delete a storage item (soft)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/garden/rules:
    get:
      tags: [garden]
      summary: List compatibility and succession rules
      description: >-
        Built-ins are marked `is_builtin=true` and carry their `source`, so agronomy
        and folklore can be told apart by looking.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: scope, in: query, schema: { $ref: "#/components/schemas/GardenRuleScope" } }
        - { name: include_disabled, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenRulePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [garden]
      summary: Add a rule
      description: >-
        Pairs are stored in canonical (sorted) order and matched both ways, so
        symmetry is structural rather than a discipline you have to remember. An
        explicit `plant_pair` beats a `family_pair` at evaluation time — that
        precedence is the reason both scopes exist. Audited as `garden.rule.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenRuleCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [garden]
      summary: Get one rule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [garden]
      summary: Edit a rule, or disable a built-in one
      description: >-
        For a BUILT-IN rule only `is_disabled` and `severity` may be changed; any
        other field is 422. Disabling is how you disagree with a built-in — see
        DELETE. Audited as `garden.rule.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenRuleUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [garden]
      summary: Delete a user rule (built-ins are 409)
      description: >-
        A BUILT-IN rule cannot be deleted — 409 (PRD D130). Disable it instead, so you
        can always see what you did not type. User-created rules delete normally.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/garden/settings:
    get:
      tags: [garden]
      summary: Garden settings (frost dates, location, thresholds, check config)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [garden]
      summary: Update garden settings
      description: >-
        Coordinates live HERE and not in Coolify (PRD D112): they are user data, not
        secrets, and a typo should not need a redeploy. There are no audience settings
        — delivery belongs to Administrace (PRD D113). Audited as
        `garden.settings.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GardenSettingsUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/garden/weather:
    get:
      tags: [garden]
      summary: Cached forecast days
      description: >-
        Read-only. Written by the scheduler's twice-daily poll (PRD D112); ~90 days of
        retention. Returns an empty list when the poll is disabled or has never
        succeeded — a missing forecast is not an error the user can act on, so it is
        never surfaced as one.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenWeatherPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/garden/enums:
    get:
      tags: [garden]
      summary: Every garden enum with its Czech label
      description: >-
        Families, plant types, hardiness, feeder classes, root depths, sun, water needs,
        sow methods, timing anchors, task kinds and statuses, planting statuses, season
        statuses, storage methods and statuses, harvest units, harvest destinations, rule
        scopes, verdicts and severities. Served by the SAME registry that generates the
        importer's validator and the LLM prompt schema (PRD D114), so the frontend, the
        model and the validator cannot disagree about what a legal value is.

        The C1–C11 CHECK KEYS ARE NOT HERE. They are not registry members — they live in
        the check engine and reach the client as `GardenWarning.check` and as the keys of
        `GardenSettings.checks`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenEnums" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------- Elektřina (electricity, v8) ----------------
  # UNITS ON THE WIRE (PRD D148): energy is INTEGER TENTHS of kWh (`*_dkwh`) and money is
  # INTEGER HALÉŘE (`*_haler`). Both carry the unit in the field name on purpose — this
  # module's prices are not whole koruny (4 858,65 Kč/MWh), so `finance`'s whole-CZK
  # integers would lose money, and a float would lose determinism. The UI divides.
  /api/electricity/readings:
    get:
      tags: [electricity]
      summary: List meter readings (newest first)
      description: >-
        Every odečet, newest first. A reading is the state of the meter at 00:00 of
        `read_on` (PRD D134) — consumption of day d is reading(d+1) minus reading(d),
        which is what makes every interval, ceník and period boundary unambiguous.
        Reads are open to any authenticated member, `reader` included.
      parameters:
        - $ref: "#/components/parameters/ElectricityLimit"
        - $ref: "#/components/parameters/DateCursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityReadingPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [electricity]
      summary: Record a meter reading
      description: >-
        `read_on` is UNIQUE among live rows — one reading per day. Both registers must
        be NON-DECREASING in date order, validated against the neighbouring readings on
        BOTH sides so a back-filled reading cannot break the chain either; a violation
        is 422 naming the offending neighbour. With výměna elektroměru out of scope
        (PRD D150) a falling counter is always a typo, so refusing it is the correct
        behaviour rather than a limitation. Requires `editor`/`admin`; audited as
        `electricity.reading.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityReadingCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityReading" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/electricity/readings/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [electricity]
      summary: Get one reading
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityReading" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [electricity]
      summary: Correct a reading
      description: >-
        Partial update. Re-validates monotonicity against both neighbours after the
        change, not before it. Moving `read_on` onto a day that already has a live
        reading is 409. Audited as `electricity.reading.update` WITH a field-level
        diff, because a corrected register silently changes every downstream figure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityReadingUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityReading" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [electricity]
      summary: Delete a reading (soft)
      description: >-
        Soft delete, the house default — unlike `finance` (PRD D87), nothing here is
        hard-deleted. Deleting the reading a period starts on, or one that resolves a
        ceník-change gap, does not fail: it re-opens the corresponding `blocking`
        entry on the summary, which is the honest outcome.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/electricity/tariffs:
    get:
      tags: [electricity]
      summary: List ceník versions (newest effective_from first)
      description: >-
        Each version is three numbers — cena VT, cena NT (Kč/MWh) and měsíční poplatky
        (Kč/měsíc) — all INCLUDING DPH and distribuce, used exactly as typed (PRD
        D135). A version governs every day from its `effective_from` until the next
        version starts; the end is DERIVED and never stored (PRD D136), because a
        stored end is a second source of truth that eventually disagrees with the next
        row's start.
      parameters:
        - $ref: "#/components/parameters/ElectricityLimit"
        - $ref: "#/components/parameters/DateCursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityTariffPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [electricity]
      summary: Add a ceník version
      description: >-
        `effective_from` is UNIQUE. A FUTURE date is the normal case, not an edge case
        — the forecast prices each future day with the version effective on that day
        (PRD D142), so entering next January's prices in August immediately shows their
        effect. Adding a version whose date falls strictly inside an existing reading
        interval is ACCEPTED and makes that interval unpriceable until a reading dated
        on the change day is entered (PRD D137); the summary reports it under
        `blocking` rather than the write failing. Audited as `electricity.tariff.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityTariffCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityTariff" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/electricity/tariffs/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [electricity]
      summary: Get one ceník version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityTariff" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [electricity]
      summary: Correct a ceník version
      description: >-
        Editing a version's prices changes the numbers ONLY for the days that version
        governs; nothing before it moves (PRD D136). Audited as
        `electricity.tariff.update` with a field-level diff.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityTariffUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityTariff" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [electricity]
      summary: Delete a ceník version (soft)
      description: >-
        Refused with 409 ONLY when the deletion would leave a day inside a settlement
        period with no effective version — in practice, the earliest version covering a
        period's start (PRD D160). Deleting a middle version is allowed: the preceding
        version simply extends over its days, which is a legitimate repricing and is
        recorded by the audit event.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/electricity/advances:
    get:
      tags: [electricity]
      summary: List záloha schedule versions (newest effective_from first)
      description: >-
        The předpis záloh — a monthly amount and a due day, versioned by
        `effective_from` exactly like the ceník (PRD D144).
      parameters:
        - $ref: "#/components/parameters/ElectricityLimit"
        - $ref: "#/components/parameters/DateCursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityAdvancePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [electricity]
      summary: Add a záloha schedule version
      description: >-
        `effective_from` is UNIQUE. `due_day` is 1–31 and is clamped to the month's
        last day AT READ TIME, never stored clamped (PRD D155) — the v5 day-of-month
        precedent (PRD D74). Audited as `electricity.advance.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityAdvanceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityAdvance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/electricity/advances/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [electricity]
      summary: Get one schedule version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityAdvance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [electricity]
      summary: Correct a schedule version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityAdvanceUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityAdvance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [electricity]
      summary: Delete a schedule version (soft)
      description: >-
        Allowed. A month with no schedule version effective on its first day and no
        recorded payment contributes 0 to the period's expected zálohy and is flagged
        on the summary, rather than the delete being refused.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/electricity/payments:
    get:
      tags: [electricity]
      summary: List recorded záloha payments (newest month first)
      description: >-
        Optional records of what was really paid, one row per calendar month. A
        recorded payment WINS over the schedule for its month (PRD D144), so the
        common case is zero typing and the month that differed is one row.
      parameters:
        - $ref: "#/components/parameters/ElectricityLimit"
        - name: cursor
          in: query
          description: >-
            Keyset cursor from the previous page's `next_cursor` — a YYYY-MM month
            key, NOT a UUIDv7. Returns the months strictly older than it. Same
            reasoning as `finance` (PRD D92) and as this module's date cursors
            (PRD D149).
          schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityPaymentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [electricity]
      summary: Record what was actually paid for a month
      description: >-
        `month` is UNIQUE among live rows. `paid_on` is optional metadata and is NOT
        what attributes the payment — the `month` key is, so a March záloha paid on 2.
        dubna still belongs to March. Audited as `electricity.payment.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityPaymentCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityPayment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/electricity/payments/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [electricity]
      summary: Get one payment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityPayment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [electricity]
      summary: Correct a payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityPaymentUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityPayment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [electricity]
      summary: Delete a payment (soft)
      description: >-
        The month falls back to its scheduled amount.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/electricity/periods:
    get:
      tags: [electricity]
      summary: List settlement periods (newest first)
      description: >-
        Zúčtovací období, set by the user, inclusive `[starts_on, ends_on]`,
        non-overlapping, and NEVER LOCKED (PRD D139). `ends_on` is an EXPECTED date
        until `ends_on_confirmed` is true (PRD D153) — suppliers often do not state it
        in advance, and the prediction has to project somewhere.
      parameters:
        - $ref: "#/components/parameters/ElectricityLimit"
        - $ref: "#/components/parameters/DateCursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityPeriodPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [electricity]
      summary: Create a settlement period
      description: >-
        Overlapping an existing period is 422. When `ends_on` is omitted the server
        defaults it to `starts_on` plus one year minus one day and leaves
        `ends_on_confirmed` false. A period REQUIRES a reading dated on `starts_on`
        (PRD D140) — creating one without it succeeds, but the summary then reports no
        money at all and names the missing odečet, which is the direct consequence of
        the hard block (PRD D137). Audited as `electricity.period.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityPeriodCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityPeriod" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/electricity/periods/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [electricity]
      summary: Get one period
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityPeriod" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [electricity]
      summary: Correct a period, or record its vyúčtování
      description: >-
        Two quite different uses share one route. Correcting `ends_on` (and setting
        `ends_on_confirmed`) re-projects the whole forecast and changes nothing about
        the actual figures. Recording the vyúčtování fills `invoiced_total_haler`,
        `invoiced_balance_haler` and the supplier's final `invoiced_vt_dkwh` /
        `invoiced_nt_dkwh` (PRD D154), which is what lets a discrepancy be attributed
        to kWh rather than only to Kč. Nothing locks (PRD D139). Audited as
        `electricity.period.update` with a field-level diff.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElectricityPeriodUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityPeriod" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [electricity]
      summary: Delete a period (soft)
      description: >-
        Readings, ceníky, zálohy and payments are independent of periods and survive.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/electricity/summary:
    get:
      tags: [electricity]
      summary: The whole computed picture for one period
      description: >-
        Everything Přehled shows, computed ON READ by the module's one pure function
        (PRD D152) — actual to the last reading, forecast from it, the balance against
        the zálohy, the doporučená záloha, the counted months, the headroom, and any
        `blocking` gaps. Nothing here is stored or cached.

        The actual/forecast boundary is the LAST READING, not today (PRD D141) — days
        since the last reading are forecast like any other future day, which is what
        keeps "actual" meaning measured.
      parameters:
        - name: period_id
          in: query
          description: Defaults to the period containing today; 404 when there is none.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricitySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/electricity/intervals:
    get:
      tags: [electricity]
      summary: Reading-to-reading intervals with their energy cost
      description: >-
        The "show your work" view behind Odečty — one entry per consecutive pair of
        readings, with days, kWh and the ceník that priced it. `energy_haler` is
        ENERGY ONLY. Poplatky are chunked by (calendar month × ceník version) per PRD
        D143 and belong to no interval; allocating them here would invent a second
        rounding rule whose only job is keeping two views agreeing. A blocked interval
        (a ceník change strictly inside it, PRD D137) carries `blocked: true` and null
        costs.
      parameters:
        - name: period_id
          in: query
          description: Defaults to the period containing today.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityIntervalList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/electricity/history:
    get:
      tags: [electricity]
      summary: Per-month consumption and cost series
      description: >-
        The Historie charts. kWh per month is APPROXIMATE — an interval's consumption
        is spread evenly across its days so month columns can be drawn (PRD D138) — and
        every entry carries `is_approximate` so the UI can say so. Kč per month is NOT
        a repricing of that approximation: it is an allocation of the already-exact
        interval costs by day count (PRD D159), so no price ever touches an invented
        meter value.
      parameters:
        - name: from
          in: query
          description: >-
            First month, YYYY-MM. Defaults to the EARLIER of the first period's start
            month and the earliest reading's month — a reading entered before the period
            that contains it is ordinary, and starting at the period would hide months
            the charts can genuinely fill.
          schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        - name: to
          in: query
          description: >-
            Last month, YYYY-MM. Defaults to the LATER of the current month and the last
            period's `ends_on` month, so a period running past today is charted to its
            end rather than cut off at the present.

            A range wider than 1200 months (a century) is a 422, not a clamp — and the
            cap is applied to the EFFECTIVE range, whatever `from` and `to` resolve to
            after the defaults above, not only to a fully explicit one. A single
            hand-written `?from=0001-01` reaches the same size as
            `?from=0001-01&to=9999-12` and would otherwise materialise a month point per
            month for every period.
          schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ElectricityHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            No settlement period exists yet — the same honest first-run answer
            `/summary` and `/intervals` give, since there is nothing to chart before the
            first období is created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ---------------- Publish: private → shared (v9, PRD D182) ----------------
  # One-way and owner-only. There is deliberately NO unpublish route: a document the
  # household has relied on for months must not be able to vanish into one member's
  # private tree. A member who wants it back re-uploads it privately and deletes the
  # shared copy, which leaves both facts in the audit log.
  /api/notes/{id}/publish:
    post:
      tags: [notes]
      summary: Publish a private note into the shared tree (v9)
      description: >-
        Moves a PRIVATE note into the household tree in one transaction: sets
        `visibility` to `shared`, clears `owner_id`, reparents to `folder_id` (null = the
        shared root), and RE-DERIVES the slug if it now collides in its new scope. A
        personal pin SURVIVES the publish (PRD D183).

        Owner-only — and a non-owner gets **404, NOT 403**, an admin included (D206). It is
        true that publishing what you cannot read is not a power that should exist (D182);
        it simply must not be OBSERVABLE that way, or the refusal becomes an existence
        oracle. See the 404 response below.

        Audited as `notes.note.publish` with the `visibility` field diff: "this became
        visible to the household" is the most consequential thing that can happen to a
        private item.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "200":
          description: Published; the note now lives in the shared tree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Unknown id — OR the caller is not the owner, which is BYTE-IDENTICAL on purpose
            (PRD D206). An `admin` lands here too: this is the one place in v9 where an
            admin has LESS power than the role usually implies (D182).

            ⚠ NOT 403. This route is open to every `editor`, so a 403-for-private /
            404-for-unknown pair would answer "does this id exist, and is it private?" for
            any id a caller cares to try — the /d/{id} existence oracle D180 closes,
            reopened with a different verb. Anything that "improves" this to a 403 has
            reintroduced the hole.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: >-
            The note is already shared, or `folder_id` names a folder outside the shared
            tree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/notes/folders/{id}/publish:
    post:
      tags: [notes]
      summary: Publish a private folder and EVERY descendant into the shared tree (v9)
      description: >-
        As `/api/notes/{id}/publish`, applied to a folder and its whole subtree in ONE
        transaction — a partial publish is the one outcome this endpoint must never
        produce, because half a published folder is a folder whose contents nobody can
        explain. Audited as `notes.folder.publish`, and every descendant is audited
        separately (`notes.note.publish` / `notes.folder.publish` with `meta.via:
        cascade`), so a rule subscribed to the action fires for each row that became
        household-visible.

        ⚠ ONLY THE SUBTREE'S ROOT GETS A NEW SLUG, and only if its own re-derived one
        collides among its new siblings. DESCENDANTS KEEP THEIRS: their parent has not
        changed, so their siblings have not changed either, and nothing they could
        collide with has moved. A client must therefore expect exactly one segment of a
        descendant's slug path to change across a publish — the root's — rather than
        re-resolving every level.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "200":
          description: Published, with every descendant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Unknown id, or not the caller's — identical responses on purpose, an `admin`
            included (PRD D206). NOT 403; see /api/notes/{id}/publish for why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/documents/{id}/publish:
    post:
      tags: [documents]
      summary: Publish a private document into the shared tree (v9)
      description: >-
        As the notes equivalent. ⚠ The PERMANENT content URL is UNCHANGED by a publish —
        `/api/documents/{id}/raw` and the SPA's `/d/{id}` are id-based and independent of
        folder, slug and scope (PRD D42), so a document keeps the URL it was shared with.
        Only the slug path moves. Audited as `documents.document.publish`.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "200":
          description: Published; the document now lives in the shared tree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Unknown id, or not the caller's — identical responses on purpose, an `admin`
            included (PRD D206). NOT 403; see /api/notes/{id}/publish for why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/documents/folders/{id}/publish:
    post:
      tags: [documents]
      summary: Publish a private document folder and EVERY descendant into the shared tree (v9)
      description: >-
        One transaction for the whole subtree, as with notes folders. No R2 object is
        touched: keys are id-based and independent of folder, slug and scope.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "200":
          description: Published, with every descendant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocFolderDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Unknown id, or not the caller's — identical responses on purpose, an `admin`
            included (PRD D206). NOT 403; see /api/notes/{id}/publish for why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ---------------- Úložiště — storage statistics (v9, admin only) ----------------
  /api/admin/storage:
    get:
      tags: [admin-storage]
      summary: Storage snapshot — database per module, object storage per module and member
      description: >-
        A PROJECTION, not a resource: it owns no state, is never written, and is
        recomputed on read behind a short in-process cache (PRD D195). No sample table, no
        scheduler job, no history — `?refresh=true` bypasses the cache.

        The database total is EXACT (`page_count × page_size` plus the WAL file on disk) —
        the only figure on this page checkable against `ls`. Per-table bytes come from
        `dbstat`; whether the driver exposes it is PROBED ON FIRST USE — a positive answer
        is cached for the process lifetime, a negative one is re-probed on the next
        uncached snapshot, so `bytes_available: false` can recover without a restart —
        and where it is absent
        the tables carry row counts with `bytes: null` and `bytes_available: false`. It
        NEVER estimates: a guessed byte figure on a page whose whole job is reporting byte
        figures is worse than an honest gap (D193).

        Object-storage figures come from listing the bucket and joining back to SQLite for
        attribution, NOT from summing `documents.byte_size` — listing counts the DERIVED
        objects (`preview.pdf`, `thumb.webp`) whose sizes are in no table, and it makes
        objects that resolve to no live row visible as `unattributed` instead of silently
        missing. That number is the orphan backlog the mirror job already reconciles,
        surfaced for the first time (D194).

        Per-member usage is bytes and object counts ONLY — never a title, a filename or a
        content type. An admin may see that space is used and by whom, never what it is
        (D197).
      parameters:
        - name: refresh
          in: query
          description: Bypass the in-process cache and recompute now.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: >-
            The snapshot. ⚠ A 200 does NOT mean everything was measurable: check
            `database.bytes_available` and `blobs.available` before rendering a figure, and
            render `null` as "nezměřeno", never as 0.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/admin/storage/private-items:
    get:
      tags: [admin-storage]
      summary: Private items across all members — id, owner, kind, size (v9)
      description: >-
        The purge screen's listing, and the ONLY place in the app where another member's
        private item is addressable at all. It carries `id`, `module`, `kind`,
        `owner_user_id`, `owner_label`, `byte_size` and the two timestamps — and NOTHING
        else. No title, no filename, no description, no content type, no preview, no
        download, no free-text search (PRD D198).

        It exists because "an admin may hard-delete a foreign private item" (D181) is
        useless if nothing in the app can name the thing to delete. It is deliberately
        uncomfortable to look at, and that discomfort is the design constraint rather than
        an objection to it.

        DELETION IS NOT HERE. The screen calls the owning module's existing hard-delete
        route — `DELETE /api/documents/{id}?hard=true`, `DELETE /api/notes/{id}?hard=true`
        — so the audit action stays the module's and `admin` gains no delete path of its
        own. The listing is assembled through the storage catalog, so `admin` still imports
        no module (D191).

        ⚠ OPENING THIS LISTING IS AUDITED — `admin.private_items.view`, the only READ in
        Home that writes an audit event. It is the answer to "who looked".
      parameters:
        - name: owner_user_id
          in: query
          description: Restrict to one member.
          schema: { type: string }
        - name: module
          in: query
          schema: { type: string, enum: [notes, documents] }
        - name: sort
          in: query
          description: >-
            `recent` is newest-first by id and is the only ordering the UUIDv7 `cursor`
            below can resume — a keyset cursor is an id, and an id does not locate a
            position in a size ordering.

            ⚠ `size` (largest-first, which is how a space problem is actually read) is
            therefore SINGLE-PAGE: it honours `limit`, ignores `cursor`, and returns
            `next_cursor: null` even when more rows match. `total_bytes` still covers ALL
            matching items, so the figure the screen acts on is complete even when the list
            is truncated. Paging a size ordering would need a composite cursor
            (`bytes|id`); this collection is not big enough to earn one.
          schema: { type: string, enum: [recent, size], default: recent }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK — always an array, never null, even when nothing is private (D174).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/chat/conversations:
    get:
      tags: [chat]
      summary: The caller's conversations (v10)
      description: >-
        Lists ONLY conversations the caller is a member of. There is no parameter that
        widens this, no admin override and no debug flag: a conversation a member is not in
        does not appear here and does not exist for them anywhere else either (PRD D217).

        Each row carries the caller's own `unread_count`, their `muted` flag and their
        `effective_from` — the instant from which the conversation is theirs to read
        (D218). `bytes` is the conversation's live attachment total, and
        `over_conversation_limit` compares it against the `chat.conversation` threshold, so
        the warning is computed for the caller rather than inferred by them.
      parameters:
        - $ref: "#/components/parameters/ConversationState"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ConversationCursor"
      responses:
        "200":
          description: OK — always an array, never null (D174).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [chat]
      summary: Create a conversation
      description: >-
        Any authenticated member may create one — **`reader` included** (PRD D222). Chat is
        the first module in Home where a `reader` writes, and the role model is deliberately
        absent from everything inside it except the clean-up page (D241).

        The creator is added as the first member with `effective_from = now`; any
        `member_ids` supplied are added with the same instant, so nobody joins a new
        conversation with history behind them. Ids must be known to the member directory —
        which is a LOGIN HISTORY projected from `sessions`, so a person who has never
        logged in cannot be added (D230).

        ⚠ There is no slug. A conversation is addressed by its UUIDv7 id, because the house
        `freeSlug` pattern appends `-2` on a sibling collision and being handed
        `dovolena-2` discloses a conversation the caller may not see (D220).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/chat/conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [chat]
      summary: One conversation
      description: >-
        ⚠ **404 for a non-member — an admin included — and byte-identical to the response
        for an id that does not exist** (PRD D217). Never 403. This is v9's D180 with
        ownership swapped for membership: a 403 confirms the conversation exists, which
        turns a guessed id into an oracle over who in the household talks to whom.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [chat]
      summary: Rename a conversation
      description: >-
        Any MEMBER may rename, regardless of role (PRD D222). **Všichni is renameable** —
        it is only delete and leave that it refuses (D219). Audited as
        `chat.conversation.renamed`. Requires the CSRF header.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationUpdate" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [chat]
      summary: Move a conversation to the koš, or purge it
      description: >-
        WITHOUT `hard`: a SOFT delete into the koš (PRD D253). `deleted_at` is set, the
        conversation vanishes from every read in the module — list, thread, search, unread,
        clean-up — and appears only under `?state=trash` for its members, with
        `HOME_CHAT_TRASH_DAYS` (default 7) to be restored. Its attachment keys are queued
        with a `purge_after`; the drain does not touch them until then.

        ⚠ **A conversation in the koš STILL COUNTS toward both storage thresholds** (D254).
        The bytes are still in R2, and reporting them as freed would make the Úložiště page
        lie for a week — the page's whole premise is that its figures sum.

        WITH `hard=true` — *Smazat natrvalo*: the queued keys are rewritten to `now` and the
        drain removes them on its next pass, so the figures fall. It exists precisely so
        that somebody deleting a heavy conversation TO FIX AN OVERRUN is never told to come
        back in seven days. Deletion is recoverable by default and irreversible on request.

        Any MEMBER may do either (D222) — the koš is what makes that survivable.

        ⚠ **An `admin` who is not a member may PURGE, and may not trash** (D255), and the
        asymmetry is per verb. The admin door is justified by STORAGE — a room that is
        costing the household money — so it opens for the verb that frees bytes and not for
        the one that frees nothing: `?hard=true` from a non-member admin is 204, and the
        same request without it is **404**, byte-identical to an id that does not exist.
        Letting the soft delete through would let an admin make a conversation vanish for
        all its members while `GET` of that same room still, correctly, 404'd for them —
        which is not v9's asymmetry but that asymmetry leaking into a third verb.

        ⚠ v9's asymmetry itself, repeated exactly: an admin may reclaim the space and may
        never read what was in it, so `GET` of this same id still returns 404 to them.

        ⚠ A `moved` attachment's document in Dokumenty **survives both paths**. The cascade
        takes `chat/` objects; `documents/` objects belong to another module now.

        `kind=default` (Všichni) refuses both with 422 (D219).
      parameters:
        - name: hard
          in: query
          description: Purge immediately instead of moving to the koš. Requires a typed confirmation in the UI.
          schema: { type: boolean, default: false }
      responses:
        "204": { description: "Trashed, or purged." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/chat/conversations/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [chat]
      summary: Restore a conversation from the koš
      description: >-
        Clears `deleted_at` and removes the queued object keys in one transaction (PRD
        D253). Membership, messages and attachments were never touched, so this is the state
        before the delete — **not a reconstruction**. Available to its members and to an
        `admin` who is not one (D255). Audited as `chat.conversation.restored`.

        ⚠ **Restoring a conversation that is not in the koš does nothing, silently, and
        answers 200.** It is idempotent rather than 422: the UPDATE already lands on a live
        row without changing it, so the only thing a refusal would add is an error over a
        double tap on *Obnovit* that has plainly got what it asked for. No
        `chat.conversation.restored` event is written for a restore that restored nothing.
      responses:
        "200":
          description: Restored — the conversation, as a MEMBER may see it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "204":
          description: >-
            Restored by an **`admin` who is not a member** (D255) — no body, deliberately.
            The restore is a storage verb they have; the conversation is a read they do not,
            and `GET` of this same id still answers them 404. Handing it back in the
            response body would be exactly the read the next request correctly refuses.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/chat/conversations/{id}/members:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [chat]
      summary: Who is in this conversation
      description: >-
        Members only (404 otherwise). Each row carries `effective_from`, so the panel can
        say plainly that a member added yesterday cannot read last week — the fact the floor
        makes true and that nothing else in the UI would explain (PRD D218).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [chat]
      summary: Add a member
      description: >-
        Any MEMBER may add anyone the directory knows, regardless of role (PRD D222). The
        new row's `effective_from` is **now**, so the added member reads nothing written
        before this moment (D218) — which is the whole reason the floor exists: being added
        to a group is one person's decision about another person's access to a third
        person's history.

        Audited as `chat.member.added`. ⚠ Nothing is written into the thread — there are no
        system messages, and the members panel is the truth (D221).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMemberAdd" }
      responses:
        "200":
          description: >-
            Added — and the response is the WHOLE members list, not the row that was
            written, because the panel that made this call renders the list.

            ⚠ **200 rather than 201, and no 409.** Adding somebody already in the room is
            idempotent and SILENT: the write is `ON CONFLICT DO NOTHING`, because re-running
            it would move an existing member's `effective_from` forward and cut them off
            from history they can already read — so no audit event and no `/ws` frame go out
            either. A double tap has plainly got what it asked for, which is
            `RestoreConversation`'s precedent one verb over.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >-
            An unknown user id, or any membership change on `kind=default` — Všichni's
            membership is every member the app has seen and is not editable (D219).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/chat/conversations/{id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [chat]
      summary: Remove a member
      description: >-
        Any MEMBER may remove any other, including the one who created the conversation
        (PRD D222). The membership row is DELETED, not marked — so re-adding writes a new
        `effective_from` and leaves a **permanent gap** in the middle of a conversation the
        member can otherwise read in full (D218). The UI says so before confirming.

        Their messages stay; authorship does not depend on membership. Audited as
        `chat.member.removed`. Removing the last member of a group is a 422 — delete the
        conversation instead.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/chat/conversations/{id}/members/me:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [chat]
      summary: The caller's own per-conversation settings (mute)
      description: >-
        Mute is **per conversation, per member**, default unmuted, stored on the membership
        row (PRD D248). A muted conversation still accrues unread counts and still updates
        live over `/ws`; only the Web Push is suppressed. The global `cat_chat` preference
        (on `PushPreferences`) switches chat push off entirely.

        `me` is a literal: there is no path anywhere in this contract that expresses another
        member's settings or another member's view.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationMemberSelfUpdate" }
      responses:
        "200":
          description: >-
            OK — the CONVERSATION, not the membership row. `muted` is one of the three
            fields on `Conversation` that are the caller's own rather than the room's, so
            the room as this member now sees it is the whole of what changed, and the list
            row and the thread header both read their state from that shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/chat/conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [chat]
      summary: The thread
      description: >-
        Messages the caller may read, newest-first by default, paged on the house UUIDv7
        `Cursor` with a `direction` — a thread is read backwards from the end and then
        forwards as new messages arrive.

        ⚠ **The caller's `effective_from` is a predicate INSIDE the query, not a filter over
        the page** (PRD D218). `next_cursor`, `has_more` and any count therefore agree with
        the rows returned; a post-filter would leak what it removed through exactly those
        three fields, which is why the acceptance criteria assert them rather than only the
        visible rows.

        A deleted message is returned as a TOMBSTONE — `deleted: true`, an empty body, the
        author and the time — because removing the row would leave a reply pointing at
        nothing and silently reflow a thread somebody else is reading (D223).
      parameters:
        - $ref: "#/components/parameters/MessageDirection"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK — always an array, never null (D174).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      tags: [chat]
      summary: Send a message, with or without attachments
      description: >-
        JSON for a plain message; `multipart/form-data` when it carries files — **one
        request either way** (PRD D224). An upload-then-reference pair was rejected: it
        leaves an orphaned object every time the second step never happens, and chat has no
        reconciliation pass to find one.

        Up to **10 files**. Each is sniffed SERVER-SIDE for its MIME type — the client's
        claim is never trusted (D48's rule) — and classified `image`, `video` or `file`
        (D227). Images get a `thumb.webp` and their intrinsic dimensions recorded, so the
        thread does not reflow as they load. Video is stored as uploaded: **no transcoding
        and no poster frame**.

        ⚠ The per-file cap is **`HOME_DOCS_MAX_UPLOAD_MB`, shared with Dokumenty on
        purpose** (D228). The reason is not thrift: a file above Dokumenty's cap could never
        be MOVED into Dokumenty, so the clean-up page's headline action would fail on
        exactly the files heavy enough to have caused the overrun.

        After the transaction commits, the message is published over `/ws` to the member set
        resolved INSIDE that transaction (D233) — the first `/ws` payload in Home that
        carries content, and safe only because the hub now knows who is connected (D232) —
        and pushed to every member except the author (D248).

        ⚠ **No audit event is written** (D231). Chat is the first module in Home whose
        primary mutation writes none, deliberately, and `TestChatMessagesAreNotAudited`
        asserts it. Attachments ARE audited (`chat.attachment.uploaded`): the bytes are what
        the thresholds and the clean-up page exist for.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageCreate" }
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ChatMessageUpload" }
            encoding:
              files: { contentType: application/octet-stream }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: A file exceeds HOME_DOCS_MAX_UPLOAD_MB. The message names the limit in MB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            Neither body nor attachment; a body over 8 000 characters; more than ten files;
            or a `reply_to_id` in another conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Object storage unreachable — nothing committed, no partial message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/chat/conversations/{id}/read:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [chat]
      summary: Advance the caller's read marker
      description: >-
        Sets `last_read_id` — and `last_read_at` beside it, as the human-facing value —
        from the named message. **Idempotent, and never backwards** — a client that replays
        an older marker cannot un-read a conversation (PRD D250).

        Unread is `id > effective_from_id AND id > last_read_id` AND not the caller's own
        AND not a tombstone, so a member added yesterday never opens a conversation to a
        four-figure badge.

        ⚠ **Both bounds are message ids, never timestamps.** `created_at` has millisecond
        resolution, so a message committing in the same millisecond as the marker is
        excluded by `created_at > last_read_at` — and because the marker only ever moves
        forward, no later read can bring it back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReadUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReadState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/chat/messages/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [chat]
      summary: Edit your own message
      description: >-
        Your own only, with **no time limit**. Sets `edited_at`; the bubble renders
        *upraveno*.

        ⚠ **No edit history is kept anywhere** (PRD D225). The only store in Home that holds
        before-and-after values is the audit spine, and D231 keeps message text out of it by
        writing no message events at all. Building a second such store for chat alone would
        be a private, unsearchable, un-redactable copy of every message ever revised.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageUpdate" }
      responses:
        "200":
          description: Edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Not a member of the conversation, below the caller's floor, or not the caller's
            own message. All three are the same response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [chat]
      summary: Delete your own message
      description: >-
        A SOFT delete leaving a tombstone — *"Zpráva byla smazána"* with the author and the
        time (PRD D223).

        ⚠ **It blanks the body in place.** `deleted_at IS NOT NULL` is not sufficient:
        `chat_messages_fts` is external-content, so a body left in the table is a body still
        returned by search. The delete sets `body = ''` in the same statement and removes
        the FTS row, and does the same to `original_filename` on any attachments it takes
        with it. Their objects are queued for the drain.

        ⚠ No audit event (D231): a deleted message leaves no trace beyond its tombstone.
        That cost is stated in the PRD rather than softened.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/chat/messages/{id}/reactions:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [chat]
      summary: Add or remove your reaction to a message
      description: >-
        Seven emoji, a chip per emoji under the bubble (PRD D265). Answers with the whole
        re-rendered message, the way the edit does and for the same reason: the `/ws` frame
        replaces the cached message outright, so anything the response omits disappears from
        every other member's bubble until something refetches.

        ⚠ **It takes the DESIRED STATE, not a toggle, and the double tap is why.** A gesture
        fires twice far more easily than a button does — a bounced finger, a retried request,
        a slow uplink — and a toggle applied twice lands on the opposite of what the member
        meant, with a chip that quietly vanished as the only evidence. `PUT` with `reacted`
        makes a replay a no-op. The same shape `PATCH …/members/me` uses for mute.

        ⚠ **Authorship is deliberately NOT checked.** Edit and delete answer 404 to anybody
        but the author; a reaction is every member's, the author's own included, and a
        `reader` may leave one (D222).

        ⚠ **No audit event and no push.** D231 keeps message mutations out of the Log, and a
        reaction is strictly less than a message; auditing one would rebuild the
        traffic-analysis record D231 declined to keep. It is not a notification either.

        ⚠ **The `/ws` audience is the members whose floor sits BELOW this message**, not the
        whole membership — the frame carries the whole message, body included, so the wider
        audience would push an old message's text to exactly the people the floor keeps it
        from. The same correction `PATCH /api/chat/messages/{id}` took in PR 2.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReactionUpdate" }
      responses:
        "200":
          description: The message, with its reactions as they now stand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Not a member of the conversation, below the caller's floor, the conversation is
            in the koš, or no such message. All four are one response, byte-identical to the
            one an unknown id gets (D217).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            An emoji outside the palette, a body that omits `reacted`, or a reaction to a
            tombstone. ⚠ A 422 rather than a 404 because none of them is a fact about
            anybody's conversation: what is wrong is the caller's own request, and the
            membership question was already answered above it. ⚠ **An absent `reacted` is
            refused rather than read as `false`** — the field is the whole of what this route
            decides, so defaulting it would delete a chip for a client that meant to add one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/chat/attachments/{id}/raw:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [chat]
      summary: Stream an attachment's bytes
      description: >-
        Members of the attachment's conversation, above their `effective_from`. Supports
        HTTP Range, so video plays inline without downloading whole. `?download=true` sets
        an attachment Content-Disposition; there is no separate `/download` path, because
        only one of three kinds ever needs one.

        ⚠ **The membership load runs BEFORE the `If-None-Match` branch.** Otherwise a stale
        ETag earns a non-member a **304** — *"yes, and it hasn't changed"* — for something
        they may not read. v9 found this exact bug in `documents` (§V9-12); it is the same
        shape in a new module, and it has its own acceptance criterion.

        ⚠ **`Cache-Control` is `private, no-cache, must-revalidate` — ALWAYS, and never
        `immutable`** (PRD D229). v9's shared branch is safe because shared bytes stay
        shared; **chat membership can be REVOKED**, and a year-long cache entry is a copy
        that outlives the revocation on a device nobody can reach. The ETag is kept on both
        the 200 and the 304, so a repeat view is still a cheap revalidation rather than a
        re-download.
      parameters:
        - name: download
          in: query
          schema: { type: boolean, default: false }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The file
          headers:
            ETag: { schema: { type: string }, description: The attachment's SHA-256 checksum. }
            Cache-Control: { schema: { type: string }, description: "Always `private, no-cache, must-revalidate` — never `immutable` (D229)." }
            Accept-Ranges: { schema: { type: string }, description: "bytes" }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "206": { description: Partial content (Range request) }
        "304": { description: "Not modified — reachable ONLY by a member above their floor." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            Not a member, below the floor, in the koš, or the attachment has been removed or
            moved. On GET and on HEAD alike — a HEAD-only oracle is still an oracle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/chat/attachments/{id}/thumbnail:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [chat]
      summary: An image attachment's thumbnail
      description: >-
        `image` attachments only; `404` for `video` and `file`, which have none — v10
        generates no video poster frame and runs no preview pipeline (PRD D227). Same
        membership rule, same floor, same 304 ordering and the same visibility-independent
        `no-cache` header as `/raw`.
      responses:
        "200":
          description: The thumbnail (image/webp)
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/webp:
              schema: { type: string, format: binary }
        "304": { description: Not modified }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/chat/attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    delete:
      tags: [chat]
      summary: Odstranit — remove an attachment's bytes from the clean-up page
      description: >-
        Sets `state='removed'`, records who and when, and **keeps `original_filename` and
        `byte_size` for display** (PRD D243), so the bubble can render an epitaph the thread
        still makes sense around:

        `📄 smlouva-2026.pdf · 2,4 MB — Soubor odstraněn při úklidu úložiště · Karel, 25. 8. 2026`

        ⚠ **This path deletes the object INLINE** rather than queueing it (D247), and it is
        the only one that does. The clean-up workflow is *clean until the number goes down*,
        and a figure lagging fifteen minutes behind the button makes the page unusable. On a
        failure it falls back to the queue. Conversation purge and message delete enqueue
        instead, because four hundred objects is not a thing to do inside a request.

        Gated **member ∧ (`editor` | `admin`)** (D241). Audited as
        `chat.attachment.removed`.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: A member without `editor`/`admin`. The reason is named in Czech.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The attachment is already `removed` or `moved`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/chat/attachments/{id}/move:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [chat]
      summary: Přesunout do Dokumentů — hand custody of the bytes to `documents`
      description: >-
        ⚠ **A MOVE IS A PUBLISH.** The file becomes readable by **every household member,
        including people who are not in this conversation** (PRD D245). That is inherent in
        the requirement that a moved file stay visible in the thread: its members must be
        able to read it, and the only place in Home where that is true without inventing a
        third `visibility` is the shared tree. The UI states it in words before confirming.
        Three alternatives were considered and declined — Všichni-only moves, no move at
        all, and conversation-scoped documents.

        ⚠ **A PRIVATE v9 folder is refused with 422**, not offered and greyed out. A private
        target would make the file unreadable to the conversation's other members, which is
        the opposite of what the move is for.

        `chat` may not import `documents`, so this is a CUSTODY TRANSFER brokered through
        `platform/storage`'s `BlobSink` (D238) — the first verb in a catalog that has so far
        carried only projections. The ordering is fixed and not negotiable:

        1. validate the target is shared and writable · 2. `blobstore.Copy` (server-side in
        R2; nothing streams through the app) · 3. insert the `documents` row with its own
        audit event and `meta.via: "chat"` · 4. mark the attachment `moved` ·
        **5. delete the chat object LAST.**

        No transaction covers all five and none can — two SQLite writes and two object-store
        calls. The order is chosen so every crash point leaves bytes **over-counted rather
        than lost**, and every intermediate state is re-runnable. Never delete before the
        copy is confirmed; never mark `moved` before the document row exists.

        Afterwards the attachment still renders in the thread from `document_path`, no
        longer counts toward either threshold (the bytes left the `chat/` prefix — by
        construction, not by bookkeeping) and is gone from the clean-up listing (D246).

        Gated **member ∧ (`editor` | `admin`)** (D241). Audited as `chat.attachment.moved`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatAttachmentMove" }
      responses:
        "200":
          description: Moved — the attachment now points at a document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAttachment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >-
            A private or unknown target folder, or an attachment that is already `moved` or
            `removed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: >-
            ⚠ No `BlobSink` is configured, so `documents` cannot accept custody. The move is
            UNAVAILABLE and the UI renders no button — it does **not** fall back to delete
            (D239). A capability that silently becomes a different, destructive capability is
            worse than one that is plainly absent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Object storage unreachable — nothing marked, nothing deleted, safe to retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/chat/search:
    get:
      tags: [chat]
      summary: Full-text search across the caller's conversations
      description: >-
        One FTS5 `MATCH` over `chat_messages_fts`, **joined to `chat_members` on the caller,
        with `id > effective_from_id` per row, tombstones excluded and the koš excluded —
        all INSIDE the query, before rank and snippet** (PRD D251).

        ⚠ The floor is a bound on the message **id**, not on `created_at`, and it is a
        COLUMN rather than an argument because every hit may sit in a different
        conversation with a different floor.

        ⚠ That placement is the requirement, not an optimisation. FTS5 ranks over what it
        matched, so a membership filter applied to the result set leaves an ordering
        computed from other people's messages — and a snippet **is** a message body by
        another name.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: conversation_id
          in: query
          description: Restrict to one conversation the caller is a member of.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: >-
            OK — always an array, never null (D174). ⚠ **A SINGLE PAGE**: `next_cursor` is
            always null here, and there is deliberately no `cursor` parameter above.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSearchPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: >-
            An empty `q` — or a `cursor`, which is **REFUSED RATHER THAN IGNORED**. The
            ordering is `rank` and a keyset cursor is an id, which does not locate a
            position in a relevance ordering; silently dropping it would return page one
            forever and read as the end of the results (the v9 `private-items` precedent).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/chat/storage:
    get:
      tags: [chat]
      summary: The caller's chat storage picture and the two thresholds
      description: >-
        What the in-module warning renders. The module TOTAL is the whole household's live
        chat attachment bytes — everyone sees the same figure, because the `chat.total`
        threshold is about the household's bucket — while the per-conversation rows cover
        **only conversations the caller belongs to** (PRD D237, D241).

        Both thresholds are **WARN ONLY**. No upload is ever refused, there is no quota and
        there is no new 413 anywhere in the app because of them — §V9's D196 rule, restated
        for a second register.

        ⚠ Conversations in the koš are included in `total_bytes` (D254). Their bytes are
        still in R2, and the figures on this page have to sum.

        This is a SUM over an index, not a bucket listing: it is on a member-facing path and
        is computed per request without a cache. The admin snapshot keeps v9's 60-second
        cache and its `List`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatStorage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/chat/cleanup:
    get:
      tags: [chat]
      summary: Úklid úložiště chatu — the clean-up listing
      description: >-
        Live attachments from **the caller's own conversations, above their floor, koš
        excluded, `state='live'` only** (PRD D241). There is no blind-triage mode and no
        admin override: a member can only clean what they can already see.

        ⚠ Gated **member ∧ (`editor` | `admin`)** — Karel's "any editor or admin user"
        intersected with his later scoping. The consequence is recorded rather than
        resolved: **a `reader` can fill storage they can never clean**, and an `editor` in
        the same conversation has to do it for them.

        A member of no conversation at all gets an **empty page, not a 403** — the gate
        passed; there is simply nothing for them to clean.

        A moved or removed row is **gone from this listing on the next load** (D246), not
        struck through and not greyed: the listing is *what still counts*.

        ⚠ *Ponechat* is not an action here and never will be. It is what happens when
        nothing is clicked, which is what "not every document has to be dealt with at that
        moment" actually asks for (D242).
      parameters:
        - name: conversation_id
          in: query
          schema: { type: string }
        - name: sort
          in: query
          description: >-
            `recent` is newest-first by id and is the only ordering the UUIDv7 `cursor` can
            resume. ⚠ `size` (largest-first, which is how a space problem is actually read)
            is therefore SINGLE-PAGE — the §V9 `private-items` precedent, and refused rather
            than silently ignored if a cursor accompanies it.
          schema: { type: string, enum: [recent, size], default: size }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK — always an array, never null (D174).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCleanupPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/chat/directory:
    get:
      tags: [chat]
      summary: The household directory, for the add-member picker
      description: >-
        ⚠ **The first surface in Home that shows the member directory to a NON-ADMIN.**
        `push.Member` carries `email` and `roles`; **neither is serialised here** (PRD
        D230). User id and display name, and nothing else.

        ⚠ The directory is a LOGIN HISTORY. Home has no `users` table — it is projected from
        `sessions` — so **a person who has never logged in cannot be added to a
        conversation**, and the picker's empty state says so rather than looking broken.

        ⚠ **It is the FRESHEST identity per user, not the newest session's** (D270). Each
        member is shown from the session auth confirmed most recently, and a display name
        changed in auth arrives within one role-refresh window — about fifteen minutes on a
        session in use — rather than at that member's next login. A name ERASED in auth is
        the one case that still waits for the next login: a mint that carries no name is
        read as "this token did not say", never as "the member cleared it".
      responses:
        "200":
          description: OK — always an array, never null (D174).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatDirectory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/admin/storage/thresholds:
    put:
      tags: [admin-storage]
      summary: Set the chat storage thresholds (v10)
      description: >-
        Writes `chat.total` and `chat.conversation` into the platform-owned
        `storage_thresholds` table (PRD D236). Admin only. Audited as
        `chat.threshold.update` — ⚠ **AS BUILT (D263), not the 0.12.0 spec's
        `chat.settings.updated`**; the design bundle is later than the PRD and wins on this
        point. The current values ride `GET /api/admin/storage`, so there is deliberately
        no GET here.

        ⚠ **A save that changes nothing writes no event.** The two fields autosave on blur,
        so a Log row per focus loss would bury the changes that mattered under a dozen that
        changed nothing.

        The table is **platform-owned** because `admin` writes these and `chat` reads them,
        and neither module may import the other. It is keyed rather than columned, so a
        later threshold is an INSERT and not a migration.

        ⚠ **v9's `HOME_STORAGE_WARN_TOTAL_MB` remains an environment variable.** Home now
        has two threshold mechanisms — one in Coolify for the whole application, two in the
        database for chat. The inconsistency is RECORDED rather than hidden: migrating a
        live operator setting into a table is a change with its own failure mode, and it is
        v11's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageThresholdsUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageThresholds" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: A value below 1 MB, or an unknown key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >-
        Home's own session (Mode B), set by POST /api/auth/login. HttpOnly, Secure,
        SameSite=Lax, host-only on home.tilcer.cz. The browser carries NO bearer
        token. Home authorizes each request from this session and gates roles
        server-side (writes require `editor`/`admin`; /api/logs/** require `admin`).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Double-submit CSRF token matching the `csrf` cookie. Required on all
        cookie-authenticated STATE-CHANGING routes (mutations + logout), together with
        an Origin/Referer allowlist check. Not required on safe (GET) requests or on
        login (which has no session yet).

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: UUIDv7 keyset cursor from the previous page.
      schema: { type: string }
    OpaqueCursor:
      name: cursor
      in: query
      description: >-
        Opaque keyset cursor from the previous page's `next_cursor` — **echo it back
        verbatim**. Not the bare UUIDv7 the house `Cursor` describes.

        These collections do NOT sort by id, so a cursor has to name the last row by
        the WHOLE sort tuple — `(ts, id)` for the log, `(updated_at, id)` for
        documents, `(window_from, position, id)` for garden tasks. The tuple is packed
        into one unpadded base64url token; its layout is the ORDER BY's business and
        is deliberately not specified here, because a cursor a client can parse is a
        cursor a client will eventually build by hand.

        A token this endpoint did not mint is not a page. What that means is per
        collection and is stated on each: `/api/logs*` and `/api/garden/tasks` answer
        422, `/api/documents` restarts at page one, on the reasoning that a stale
        bookmark should show the first page rather than an error.
      schema: { type: string }
    ConversationCursor:
      name: cursor
      in: query
      description: >-
        Opaque keyset cursor from the previous page's `next_cursor` — **echo it back
        verbatim** (v10). Same encoding as `OpaqueCursor`; it keeps a parameter of its
        own for the refusal rule below.

        ⚠ It is NOT the bare UUIDv7 the house `Cursor` describes. The ORDER BY is
        `(updated_at, id)` descending and `updated_at` alone is not unique — a send
        bumps it, and two rooms bumped in the same millisecond would page over each
        other or skip one — so the cursor carries BOTH columns. A client that passes
        the last row's id on its own gets 422 *Neplatný kurzor.*, since that is the
        one shape the endpoint cannot decode.
      schema: { type: string }
    Scope:
      name: scope
      in: query
      description: >-
        Which ROOT SCOPE to read (PRD D184, new in v9). `shared` is the household tree;
        `private` is THE CALLER'S OWN private tree. There is no value that names another
        member's private root, and there is no parameter that would express one — a member's
        private tree is reachable only from their own session.

        DEFAULT `shared`, on every endpoint that takes it. That default is the reason a
        pre-v9 client keeps working unchanged: it asks for nothing and gets exactly the tree
        it always got.

        The visibility predicate is applied INSIDE the query — for `?q=` it is part of the
        FTS join, not a filter over the result set — because a post-filter leaks through
        result counts and paging even when it removes the rows themselves.
      schema: { type: string, enum: [shared, private], default: shared }
    GardenYear:
      name: year
      in: path
      required: true
      description: >-
        A season is addressed by its YEAR, not by a surrogate id (PRD D128) — the year
        is unique, immutable and user-visible, and it makes /zahrada/plan/2027 map 1:1
        onto the API. A knowing, single-entity deviation from addressing by id.

        A year outside 1900–2200, or one that is not a number at all, is a 422 and NOT a
        404: the caller sent something that could never name a season, which is a
        malformed request rather than a missing row.
      schema: { type: integer, minimum: 1900, maximum: 2200 }
    DateCursor:
      name: cursor
      in: query
      description: >-
        Keyset cursor for the `electricity` collections — a YYYY-MM-DD DATE, NOT the
        UUIDv7 `Cursor`. These collections are ordered chronologically by a natural
        key (`read_on`, `effective_from`, `starts_on`), and ordering by id would
        misplace a back-filled row, so an id passed here would be compared lexically
        against a date and silently return a wrong page (PRD D149 — the `finance`
        month-key precedent, PRD D92). A malformed value is 422, never a silent
        re-serve of page one.

        The pattern below is as tight as a regex usefully gets; the SERVER PARSES the
        value, so an impossible date the pattern cannot express — `2026-02-30`,
        `2027-04-31` — is a 422 all the same. Treat the pattern as a first filter, not
        as the contract.
      schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$" }
    ElectricityLimit:
      name: limit
      in: query
      description: >-
        ⚠ AS BUILT, NOT AS DESIGNED. The five `electricity` collections do NOT use the
        house `Limit` (default 50, maximum 200, clamping): they default to 100, accept
        up to 500, and an out-of-range value — 0, negative, non-numeric or above 500 —
        FALLS BACK TO 100 rather than clamping to the ceiling, so `?limit=600` returns
        100 items and not 500.

        This is a KNOWN INCONSISTENCY to be aligned with the house parameter in a later
        version, not a deliberate contract. It is documented here only so the spec
        describes what shipped; every other module (`admin`, `garden`, `logging`,
        `finance`) uses 50/200 with a clamp, and nothing should be built on the
        difference.
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    ConversationState:
      name: state
      in: query
      description: >-
        Which conversations to list (v10). `active` is the default; `trash` lists the
        caller's own conversations in the KOŠ — soft-deleted, still recoverable, and still
        counted against both storage thresholds until they are actually purged (PRD D253,
        D254).

        The koš is a STATE, not a second collection: one path, one predicate, one shape. A
        trashed conversation is invisible to every other read in the module — thread, search,
        unread count, clean-up listing — so this parameter is the only way to see one at all.
      schema: { type: string, enum: [active, trash], default: active }
    MessageDirection:
      name: direction
      in: query
      description: >-
        Which way to page from `cursor` (v10). A thread is read BACKWARDS from the newest
        message and then forwards as new ones arrive, which is why this exists — and why the
        `electricity` `DateCursor` does not apply here: chat messages are ordered by UUIDv7
        id, which IS their creation order, so the house `Cursor` locates a position exactly.

        `backward` (the default) walks toward the start of the conversation and stops at the
        caller's `effective_from_id`, no matter how far a client keeps paging (PRD D218);
        `forward` walks toward the newest message. Both directions return the page
        newest-first, so `items[0]` is the newest row whichever way it was walked, and
        `next_cursor` is the far end in the direction of travel.
      schema: { type: string, enum: [backward, forward], default: backward }

  responses:
    Unauthorized:
      description: Missing/invalid JWT
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but lacks the required role (e.g. non-admin on logs)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict (duplicate, or non-empty delete)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }

    # ----- To-do -----
    Board:
      type: object
      required: [id, name, position, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        position: { type: string, description: Fractional-index / lexorank order key }
        archived: { type: boolean, default: false }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    BoardCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    BoardUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
        archived: { type: boolean }

    Column:
      type: object
      required: [id, board_id, name, priority, position, kind]
      properties:
        id: { type: string }
        board_id: { type: string }
        name: { type: string }
        priority: { type: integer, default: 0 }
        position: { type: string }
        kind:
          type: string
          enum: [normal, now, done]
          default: normal
          description: Free-form UI hint; not unique per board.
        created_at: { type: string, format: date-time }
    ColumnCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        priority: { type: integer, default: 0 }
        kind: { type: string, enum: [normal, now, done], default: normal }
    ColumnUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        priority: { type: integer }
        kind: { type: string, enum: [normal, now, done] }

    Card:
      type: object
      required: [id, column_id, title, position, created_at]
      properties:
        id: { type: string }
        column_id: { type: string }
        title: { type: string }
        notes: { type: [string, "null"], description: Markdown }
        position: { type: string }
        archived: { type: boolean, default: false }
        done_at: { type: [string, "null"], format: date-time }
        label_ids:
          type: array
          items: { type: string }
        checklist_progress:
          $ref: "#/components/schemas/ChecklistProgress"
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CardDetail:
      allOf:
        - $ref: "#/components/schemas/Card"
        - type: object
          properties:
            links:
              type: array
              items: { $ref: "#/components/schemas/CardLink" }
            checklist:
              type: array
              items: { $ref: "#/components/schemas/ChecklistItem" }
            labels:
              type: array
              items: { $ref: "#/components/schemas/Label" }
    CardCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        notes: { type: string }
    CardUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        notes: { type: [string, "null"] }
        archived: { type: boolean }
    CardMoveRequest:
      type: object
      required: [column_id]
      properties:
        column_id: { type: string, description: Target column. }
        position: { type: string, description: Target order key within the column. }
    ChecklistProgress:
      type: object
      required: [done, total]
      properties:
        done: { type: integer }
        total: { type: integer }

    CardLink:
      type: object
      required: [id, card_id, url, position]
      properties:
        id: { type: string }
        card_id: { type: string }
        url: { type: string, format: uri }
        title: { type: [string, "null"] }
        position: { type: string }
    CardLinkCreate:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: http/https only }
        title: { type: string }

    ChecklistItem:
      type: object
      required: [id, card_id, text, done, position]
      properties:
        id: { type: string }
        card_id: { type: string }
        text: { type: string }
        done: { type: boolean, default: false }
        position: { type: string }
    ChecklistItemCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
    ChecklistItemUpdate:
      type: object
      properties:
        text: { type: string, minLength: 1 }
        done: { type: boolean }
        position: { type: string }

    Label:
      type: object
      required: [id, board_id, name, color]
      properties:
        id: { type: string }
        board_id: { type: string }
        name: { type: string }
        color: { type: string, description: Hex or named token }
    LabelCreate:
      type: object
      required: [name, color]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }

    MoveRequest:
      type: object
      required: [position]
      properties:
        position: { type: string, description: New order key. }

    BoardTree:
      type: object
      required: [board, columns]
      properties:
        board: { $ref: "#/components/schemas/Board" }
        columns:
          type: array
          items:
            type: object
            required: [column, cards]
            properties:
              column: { $ref: "#/components/schemas/Column" }
              cards:
                type: array
                items: { $ref: "#/components/schemas/Card" }

    # ----- Events (Okno do budoucnosti) -----
    Event:
      type: object
      required: [id, title, starts_on, reminder_enabled, timezone, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: [string, "null"], description: Markdown }
        starts_on:
          type: string
          format: date
          description: All-day anchor date; no time of day (PRD D18).
        rrule:
          type: [string, "null"]
          description: >-
            RFC 5545 RRULE subset. NULL = one-off. v1 supports
            FREQ=WEEKLY|MONTHLY|YEARLY with INTERVAL=1 and optional UNTIL.
          examples: ["FREQ=MONTHLY;INTERVAL=1", "FREQ=YEARLY;INTERVAL=1;UNTIL=20300101"]
        timezone:
          type: string
          default: Europe/Prague
          description: IANA zone used for expansion and date boundaries.
        reminder_enabled: { type: boolean, default: false }
        reminder_lead:
          type: [string, "null"]
          enum: ["1d", "2d", "1w", "2w", "1m", null]
          description: Required when reminder_enabled is true.
        archived: { type: boolean, default: false }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventCreate:
      type: object
      required: [title, starts_on]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        starts_on: { type: string, format: date }
        rrule: { type: string }
        reminder_enabled: { type: boolean, default: false }
        reminder_lead: { type: string, enum: ["1d", "2d", "1w", "2w", "1m"] }
    EventUpdate:
      type: object
      description: Applies to the whole series — no per-occurrence exceptions (PRD D14).
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
        starts_on: { type: string, format: date }
        rrule: { type: [string, "null"] }
        reminder_enabled: { type: boolean }
        reminder_lead: { type: [string, "null"], enum: ["1d", "2d", "1w", "2w", "1m", null] }
        archived: { type: boolean }
    EventWithLinks:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          properties:
            links:
              type: array
              items: { $ref: "#/components/schemas/EventLink" }
    EventLink:
      type: object
      required: [id, event_id, url, position]
      properties:
        id: { type: string }
        event_id: { type: string }
        url: { type: string, format: uri }
        title: { type: [string, "null"] }
        position: { type: string }
    EventSeriesPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        next_cursor: { type: [string, "null"] }
    Occurrence:
      type: object
      required: [event_id, occurrence_on, title, recurring, reminder_enabled]
      description: A computed occurrence. Never persisted.
      properties:
        event_id: { type: string }
        occurrence_on: { type: string, format: date }
        title: { type: string }
        description: { type: [string, "null"] }
        recurring: { type: boolean, description: True when the parent event has an rrule. }
        reminder_enabled: { type: boolean }
        reminder_lead: { type: [string, "null"], enum: ["1d", "2d", "1w", "2w", "1m", null] }
        reminder_completed:
          type: boolean
          description: Whether this specific occurrence's reminder has been completed.
    OccurrenceMonths:
      type: object
      required: [months]
      properties:
        months:
          type: array
          description: Ascending by month.
          items:
            type: object
            required: [month, occurrences]
            properties:
              month: { type: string, description: "yyyy-MM", examples: ["2026-07"] }
              occurrences:
                type: array
                items: { $ref: "#/components/schemas/Occurrence" }
    ReminderCompletion:
      type: object
      required: [event_id, occurrence_on, completed_at]
      properties:
        event_id: { type: string }
        occurrence_on: { type: string, format: date }
        completed_by: { type: [string, "null"] }
        completed_at: { type: string, format: date-time }

    # ----- Notes (Poznámky) -----
    Folder:
      type: object
      required: [id, name, slug, position, created_at, visibility]
      properties:
        id: { type: string }
        parent_id: { type: [string, "null"], description: "NULL = root — of the scope named by `visibility`/`owner_id` (v9)." }
        visibility:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root scope this item lives in (v9, PRD D177). REQUIRED, not optional: an
            item whose visibility a client has to infer is an item some client will get wrong.
        owner_id:
          type: [string, "null"]
          description: >-
            The auth user id of the owner when `visibility` is `private`; NULL when `shared`.
            The pairing is an invariant — shared ⇒ null, private ⇒ non-null — checked in the
            write transaction rather than by a table CHECK (PRD D179). NEVER accepted from a
            request body: it is taken from the session at creation.
        name: { type: string }
        slug: { type: string, description: "URL segment; unique among sibling folders+notes." }
        position: { type: string, description: Lexorank order key among siblings. }
        archived: { type: boolean, default: false }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FolderCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parent_id: { type: [string, "null"], description: Omit/null for a root folder. }
        scope:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root to create in (v9). Honoured ONLY when `parent_id` is null; otherwise
            the parent's scope governs and a disagreement is a 422.
    FolderUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        archived: { type: boolean }
    FolderMoveRequest:
      type: object
      required: [position]
      properties:
        parent_id: { type: [string, "null"], description: New parent (null = root). Must not be the folder itself or a descendant. }
        position: { type: string, description: New order key among the target siblings. }
    PathSegment:
      type: object
      required: [name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
    FolderDetail:
      allOf:
        - $ref: "#/components/schemas/Folder"
        - type: object
          properties:
            path:
              type: array
              description: Breadcrumb from root to this folder (inclusive).
              items: { $ref: "#/components/schemas/PathSegment" }
            slug_path: { type: string, description: "Full slug path, e.g. recepty/dezerty." }
            subfolders:
              type: array
              items: { $ref: "#/components/schemas/Folder" }
            notes:
              type: array
              items: { $ref: "#/components/schemas/NoteSummary" }

    Note:
      type: object
      required: [id, title, slug, position, created_at, visibility]
      properties:
        id: { type: string }
        folder_id: { type: [string, "null"], description: "NULL = root (unfiled) — of the scope named by `visibility`/`owner_id` (v9)." }
        visibility:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root scope this item lives in (v9, PRD D177). REQUIRED, not optional: an
            item whose visibility a client has to infer is an item some client will get wrong.
        owner_id:
          type: [string, "null"]
          description: >-
            The auth user id of the owner when `visibility` is `private`; NULL when `shared`.
            The pairing is an invariant — shared ⇒ null, private ⇒ non-null — checked in the
            write transaction rather than by a table CHECK (PRD D179). NEVER accepted from a
            request body: it is taken from the session at creation.
        title: { type: string }
        slug: { type: string, description: "URL segment; unique among sibling folders+notes." }
        body_md: { type: [string, "null"], description: The single canonical Markdown body (PRD D30). }
        position: { type: string }
        archived: { type: boolean, default: false }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NoteSummary:
      type: object
      required: [id, title, slug, position, visibility]
      description: Lightweight note node for the tree/list (no body).
      properties:
        id: { type: string }
        folder_id: { type: [string, "null"] }
        visibility:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root scope this item lives in (v9, PRD D177). REQUIRED, not optional: an
            item whose visibility a client has to infer is an item some client will get wrong.
        owner_id:
          type: [string, "null"]
          description: >-
            The auth user id of the owner when `visibility` is `private`; NULL when `shared`.
            The pairing is an invariant — shared ⇒ null, private ⇒ non-null — checked in the
            write transaction rather than by a table CHECK (PRD D179). NEVER accepted from a
            request body: it is taken from the session at creation.
        title: { type: string }
        slug: { type: string }
        position: { type: string }
        archived: { type: boolean, default: false }
        updated_at: { type: string, format: date-time }
        pinned: { $ref: "#/components/schemas/PinState" }
    NoteDetail:
      allOf:
        - $ref: "#/components/schemas/Note"
        - type: object
          properties:
            path:
              type: array
              description: Breadcrumb of the containing folders (empty for a root note).
              items: { $ref: "#/components/schemas/PathSegment" }
            slug_path: { type: string, description: "Full slug path, e.g. recepty/gulas." }
            pinned: { $ref: "#/components/schemas/PinState" }
    NoteCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        folder_id: { type: [string, "null"], description: Omit/null for a root note. }
        scope:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root to create in (v9). Honoured ONLY when `folder_id` is null; otherwise
            the parent folder's scope governs and a disagreement is a 422. `owner_id` is
            never accepted here — it is taken from the session.
        body_md: { type: string, description: Markdown. }
    NoteUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        body_md: { type: [string, "null"] }
        archived: { type: boolean }
    NoteMoveRequest:
      type: object
      required: [position]
      properties:
        folder_id: { type: [string, "null"], description: Target folder (null = root). }
        position: { type: string, description: New order key within the target. }
    NotePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NoteSummary" }
        next_cursor: { type: [string, "null"] }
    NotesTree:
      type: object
      required: [roots]
      description: The folder tree plus root-level (unfiled) notes.
      properties:
        roots:
          type: array
          description: Top-level folders (parent_id null), each recursive.
          items: { $ref: "#/components/schemas/FolderNode" }
        root_notes:
          type: array
          description: Notes with no folder (folder_id null).
          items: { $ref: "#/components/schemas/NoteSummary" }
    FolderNode:
      type: object
      required: [folder, subfolders, notes]
      properties:
        folder: { $ref: "#/components/schemas/Folder" }
        subfolders:
          type: array
          items: { $ref: "#/components/schemas/FolderNode" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/NoteSummary" }
    ResolveResult:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [folder, note] }
        id: { type: string }
        slug_path: { type: string }
    PinState:
      type: object
      description: The caller's view of a note's pin state.
      required: [household, personal]
      properties:
        household: { type: boolean, description: "Pinned pro všechny (household)." }
        personal: { type: boolean, description: "Pinned jen pro mě by the caller." }
    PinRequest:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [household, personal] }
    NotePin:
      type: object
      required: [note_id, scope, position]
      properties:
        note_id: { type: string }
        scope: { type: string, enum: [household, personal] }
        user_id: { type: [string, "null"], description: NULL for household; the caller for personal. }
        position: { type: string }
        created_at: { type: string, format: date-time }

    # ----- Documents (Dokumenty) -----
    DocFolder:
      type: object
      required: [id, name, slug, position, created_at, visibility]
      description: A folder in the documents tree (own tree, isolated from Poznámky — PRD D40).
      properties:
        id: { type: string }
        parent_id: { type: [string, "null"], description: "NULL = root — of the scope named by `visibility`/`owner_id` (v9)." }
        visibility:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root scope this item lives in (v9, PRD D177). REQUIRED, not optional: an
            item whose visibility a client has to infer is an item some client will get wrong.
        owner_id:
          type: [string, "null"]
          description: >-
            The auth user id of the owner when `visibility` is `private`; NULL when `shared`.
            The pairing is an invariant — shared ⇒ null, private ⇒ non-null — checked in the
            write transaction rather than by a table CHECK (PRD D179). NEVER accepted from a
            request body: it is taken from the session at creation.
        name: { type: string }
        slug: { type: string, description: "URL segment; unique among sibling document-folders+documents." }
        position: { type: string, description: Lexorank order key among siblings. }
        archived: { type: boolean, default: false }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DocFolderCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        scope:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root to create in (v9). Honoured ONLY when `parent_id` is null; otherwise
            the parent's scope governs and a disagreement is a 422. Without this field the
            private DOCUMENTS root could hold no folder at all, which is why it is here and
            not left to `FolderCreate`'s twin (PRD §V9-6).
        parent_id: { type: [string, "null"], description: Omit/null for a root folder. }
    DocFolderUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        archived: { type: boolean }
    DocFolderMoveRequest:
      type: object
      required: [position]
      properties:
        parent_id: { type: [string, "null"], description: New parent (null = root). Must not be the folder itself or a descendant. }
        position: { type: string, description: New order key among the target siblings. }
    DocFolderDetail:
      allOf:
        - $ref: "#/components/schemas/DocFolder"
        - type: object
          properties:
            path:
              type: array
              description: Breadcrumb from root to this folder (inclusive).
              items: { $ref: "#/components/schemas/PathSegment" }
            slug_path: { type: string, description: "Full slug path, e.g. smlouvy/najem." }
            subfolders:
              type: array
              items: { $ref: "#/components/schemas/DocFolder" }
            documents:
              type: array
              items: { $ref: "#/components/schemas/DocumentSummary" }

    DocumentUrls:
      type: object
      description: >-
        Permanent, household-only, id-based content URLs (PRD D42). Stable for the
        document's life; unaffected by rename/move. All require the session cookie.
      required: [permalink, raw, download, preview, thumbnail]
      properties:
        permalink: { type: string, description: "SPA short route, e.g. /d/{id}." }
        raw: { type: string, description: "/api/documents/{id}/raw" }
        download: { type: string, description: "/api/documents/{id}/download" }
        preview: { type: string, description: "/api/documents/{id}/preview" }
        thumbnail: { type: string, description: "/api/documents/{id}/thumbnail" }
    Document:
      type: object
      required: [id, title, slug, original_filename, content_type, byte_size, checksum, preview_kind, preview_status, position, created_at, urls, visibility]
      properties:
        id: { type: string }
        folder_id: { type: [string, "null"], description: "NULL = root (unfiled) — of the scope named by `visibility`/`owner_id` (v9)." }
        visibility:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root scope this item lives in (v9, PRD D177). REQUIRED, not optional: an
            item whose visibility a client has to infer is an item some client will get wrong.
        owner_id:
          type: [string, "null"]
          description: >-
            The auth user id of the owner when `visibility` is `private`; NULL when `shared`.
            The pairing is an invariant — shared ⇒ null, private ⇒ non-null — checked in the
            write transaction rather than by a table CHECK (PRD D179). NEVER accepted from a
            request body: it is taken from the session at creation.
        title: { type: string, description: Display title (editable); defaults to the filename sans extension. }
        slug: { type: string, description: "URL segment; unique among sibling document-folders+documents." }
        description: { type: [string, "null"], description: "Optional free text, indexed for search." }
        original_filename: { type: string }
        content_type: { type: string, description: Server-sniffed MIME (not the client's Content-Type — PRD D48). }
        byte_size: { type: integer }
        checksum: { type: string, description: SHA-256 hex of the immutable bytes; also the /raw ETag. }
        preview_kind:
          type: string
          enum: [native, pdf, none]
          description: >-
            native = the original previews directly (PDF/image/text); pdf = a derived
            preview PDF exists (Office→PDF); none = download-only.
        preview_status:
          type: string
          enum: [pending, ready, failed, none]
          description: Async preview state (PRD D44). `none` for types that need no derived preview once native.
        position: { type: string }
        archived: { type: boolean, default: false }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        urls: { $ref: "#/components/schemas/DocumentUrls" }
    DocumentSummary:
      type: object
      required: [id, title, slug, content_type, byte_size, preview_kind, preview_status, position, visibility]
      description: Lightweight document node for the tree/list/grid (no description).
      properties:
        id: { type: string }
        folder_id: { type: [string, "null"] }
        visibility:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root scope this item lives in (v9, PRD D177). REQUIRED, not optional: an
            item whose visibility a client has to infer is an item some client will get wrong.
        owner_id:
          type: [string, "null"]
          description: >-
            The auth user id of the owner when `visibility` is `private`; NULL when `shared`.
            The pairing is an invariant — shared ⇒ null, private ⇒ non-null — checked in the
            write transaction rather than by a table CHECK (PRD D179). NEVER accepted from a
            request body: it is taken from the session at creation.
        title: { type: string }
        slug: { type: string }
        content_type: { type: string }
        byte_size: { type: integer }
        preview_kind: { type: string, enum: [native, pdf, none] }
        preview_status: { type: string, enum: [pending, ready, failed, none] }
        position: { type: string }
        archived: { type: boolean, default: false }
        updated_at: { type: string, format: date-time }
        thumbnail_url: { type: [string, "null"], description: "/api/documents/{id}/thumbnail when available." }
        pinned: { $ref: "#/components/schemas/PinState" }
    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          properties:
            path:
              type: array
              description: Breadcrumb of the containing folders (empty for a root document).
              items: { $ref: "#/components/schemas/PathSegment" }
            slug_path: { type: string, description: "Full slug path, e.g. smlouvy/najem-2026." }
            pinned: { $ref: "#/components/schemas/PinState" }
    DocumentUpload:
      type: object
      required: [file]
      description: multipart/form-data upload (PRD FR-DOC1).
      properties:
        file: { type: string, format: binary }
        folder_id: { type: string, description: Target folder; omit for a root document. }
        scope:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Which root to upload into (v9). Honoured ONLY when `folder_id` is omitted;
            otherwise the folder's scope governs and a disagreement is a 422.
        title: { type: string, description: Defaults to the filename sans extension. }
        description: { type: string }
    DocumentUpdate:
      type: object
      description: Metadata only — never the file bytes (immutable, PRD D41).
      properties:
        title: { type: string, minLength: 1 }
        description: { type: [string, "null"] }
        archived: { type: boolean }
    DocumentMoveRequest:
      type: object
      required: [position]
      properties:
        folder_id: { type: [string, "null"], description: Target folder (null = root). }
        position: { type: string, description: New order key within the target. }
    DocumentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentSummary" }
        next_cursor: { type: [string, "null"] }
    DocumentsTree:
      type: object
      required: [roots]
      description: The document folder tree plus root-level (unfiled) documents.
      properties:
        roots:
          type: array
          description: Top-level folders (parent_id null), each recursive.
          items: { $ref: "#/components/schemas/DocFolderNode" }
        root_documents:
          type: array
          description: Documents with no folder (folder_id null).
          items: { $ref: "#/components/schemas/DocumentSummary" }
    DocFolderNode:
      type: object
      required: [folder, subfolders, documents]
      properties:
        folder: { $ref: "#/components/schemas/DocFolder" }
        subfolders:
          type: array
          items: { $ref: "#/components/schemas/DocFolderNode" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/DocumentSummary" }
    DocResolveResult:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [folder, document] }
        id: { type: string }
        slug_path: { type: string }
    DocumentPin:
      type: object
      required: [document_id, scope, position]
      properties:
        document_id: { type: string }
        scope: { type: string, enum: [household, personal] }
        user_id: { type: [string, "null"], description: NULL for household; the caller for personal. }
        position: { type: string }
        created_at: { type: string, format: date-time }

    # ----- Auth (Mode B) -----
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UserPublic:
      type: object
      required: [id, email, roles]
      properties:
        id: { type: string, description: auth user id }
        email: { type: string, format: email }
        display_name: { type: [string, "null"] }
        roles:
          type: array
          items: { type: string, enum: [admin, editor, reader] }
    SessionUser:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserPublic" }

    # ----- Dashboard host (Nástěnka) -----
    Dashboard:
      type: object
      required: [layout, widgets]
      properties:
        layout:
          type: array
          items: { $ref: "#/components/schemas/LayoutItem" }
        widgets:
          type: array
          description: One entry per VISIBLE widget, in layout order.
          items: { $ref: "#/components/schemas/WidgetInstance" }
    LayoutItem:
      type: object
      required: [widget_key, visible, position, size]
      properties:
        widget_key: { type: string, examples: ["todo.pravedelam"] }
        visible: { type: boolean }
        position: { type: string, description: Lexorank order key. }
        size: { type: string, enum: [narrow, wide] }
    LayoutItemInput:
      type: object
      required: [widget_key, visible, size]
      description: Order is taken from the array order; position keys are derived server-side.
      properties:
        widget_key: { type: string }
        visible: { type: boolean }
        size: { type: string, enum: [narrow, wide] }
    WidgetCatalogEntry:
      type: object
      required: [key, title, module, default_size]
      properties:
        key: { type: string, examples: ["events.pripominky"] }
        title: { type: string, description: Czech display title. }
        module: { type: string, enum: [todo, events, notes, documents, logging, finance, garden], description: "No `electricity` — the v8 module publishes no widget (PRD D147)." }
        description: { type: [string, "null"] }
        default_size: { type: string, enum: [narrow, wide] }
        admin_only: { type: boolean, default: false }
    WidgetInstance:
      type: object
      required: [key, size, data]
      properties:
        key: { type: string }
        size: { type: string, enum: [narrow, wide] }
        data:
          description: >-
            Shape depends on `key`: todo.pravedelam -> PravedelamWidget,
            events.pripominky -> PripominkyWidget, events.tento-mesic -> TentoMesicWidget,
            notes.pripnute -> PripnutePoznamkyWidget, documents.pripnute -> PripnuteDokumentyWidget.
          oneOf:
            - $ref: "#/components/schemas/PravedelamWidget"
            - $ref: "#/components/schemas/PripominkyWidget"
            - $ref: "#/components/schemas/TentoMesicWidget"
            - $ref: "#/components/schemas/PripnutePoznamkyWidget"
            - $ref: "#/components/schemas/PripnuteDokumentyWidget"
    PravedelamWidget:
      type: object
      required: [tasks]
      description: Provided by the todo module (FR-T8).
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/DashboardTask" }
    PripominkyWidget:
      type: object
      required: [reminders]
      description: Provided by the events module (FR-E7).
      properties:
        reminders:
          type: array
          items: { $ref: "#/components/schemas/DashboardReminder" }
    TentoMesicWidget:
      type: object
      required: [occurrences]
      description: Read-only look-ahead provided by the events module (FR-E8).
      properties:
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/Occurrence" }
    PripnutePoznamkyWidget:
      type: object
      required: [notes]
      description: >-
        Provided by the notes module (FR-P8): household pins ∪ the caller's personal
        pins, de-duplicated (household precedence), household block then personal block.
      properties:
        notes:
          type: array
          items: { $ref: "#/components/schemas/PinnedNote" }
    PinnedNote:
      type: object
      required: [note_id, title, slug_path, scope, visibility]
      properties:
        note_id: { type: string }
        title: { type: string }
        slug_path: { type: string, description: "Full slug path for the row link, e.g. recepty/gulas." }
        scope:
          type: string
          enum: [household, personal, both]
          description: How this note is pinned for the caller.
        visibility:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Drives the widget row's lock mark (v9, D183). Only ever `private` for the
            member looking at it: a private note takes personal pins only, and those are
            filtered to the caller.
        excerpt: { type: [string, "null"], description: Short plain-text preview of the body. }
        updated_at: { type: string, format: date-time }
        position: { type: string, description: Pin order key within its block. }
    PripnuteDokumentyWidget:
      type: object
      required: [documents]
      description: >-
        Provided by the documents module (FR-DOC11): household pins ∪ the caller's
        personal pins, de-duplicated (household precedence), household block then personal.
      properties:
        documents:
          type: array
          items: { $ref: "#/components/schemas/PinnedDocument" }
    PinnedDocument:
      type: object
      required: [document_id, title, slug_path, scope, visibility, content_type, preview_kind, preview_status]
      properties:
        document_id: { type: string }
        title: { type: string }
        slug_path: { type: string, description: "Full slug path (navigation); the permanent link is /d/{document_id}." }
        scope:
          type: string
          enum: [household, personal, both]
          description: How this document is pinned for the caller.
        visibility:
          type: string
          enum: [shared, private]
          default: shared
          description: >-
            Drives the widget row's lock mark (v9, D183). Only ever `private` for the
            member looking at it: a private document takes personal pins only, and those
            are filtered to the caller.
        content_type: { type: string }
        byte_size: { type: integer }
        preview_kind: { type: string, enum: [native, pdf, none] }
        preview_status: { type: string, enum: [pending, ready, failed, none] }
        thumbnail_url: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }
        position: { type: string, description: Pin order key within its block. }
    DashboardReminder:
      type: object
      required: [event_id, occurrence_on, title, overdue]
      description: >-
        At most one per event — the earliest uncompleted occurrence within the
        lookback window, shown once today >= occurrence_on - lead.
      properties:
        event_id: { type: string }
        occurrence_on: { type: string, format: date }
        title: { type: string }
        recurring: { type: boolean }
        reminder_lead: { type: string, enum: ["1d", "2d", "1w", "2w", "1m"] }
        overdue:
          type: boolean
          description: True when occurrence_on is in the past and still uncompleted.
        days_until:
          type: integer
          description: Negative when overdue. Computed in HOME_TIMEZONE.
    DashboardTask:
      type: object
      required: [card_id, title, board_id, board_name, column_id, column_name]
      description: A card sitting in a column with kind=now, across all boards.
      properties:
        card_id: { type: string }
        title: { type: string }
        board_id: { type: string }
        board_name: { type: string }
        column_id: { type: string }
        column_name: { type: string }
        label_ids:
          type: array
          items: { type: string }
        checklist_progress: { $ref: "#/components/schemas/ChecklistProgress" }

    # ----- Logs -----
    AuditEvent:
      type: object
      required: [id, ts, actor_type, module, action, summary, level, site, redacted]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actor_user_id: { type: [string, "null"] }
        actor_type: { type: string, enum: [user, system, service] }
        actor_label: { type: [string, "null"] }
        module: { type: string }
        action: { type: string }
        entity_type: { type: [string, "null"] }
        entity_id: { type: [string, "null"] }
        summary: { type: string }
        level: { type: string, enum: [info, warn, error] }
        request_id: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        site: { type: string }
        meta: { type: [object, "null"], additionalProperties: true }
        redacted:
          type: boolean
          default: false
          description: >-
            True when this event concerns a PRIVATE note or document and the CALLER IS NOT
            ITS OWNER (v9, PRD D187). The row is still returned — the spine records
            everything — but `summary` carries the fixed phrase "Soukromá položka —
            podrobnosti skryty", `entity_id` is dropped, and `changes` comes back empty.
            REQUIRED so a client can tell a redacted row from a row about something dull;
            without it the log browser renders the phrase as if it were a summary somebody
            wrote.

            Redaction is applied at READ time by one function, `audit.Redact` — never at
            write time, which would redact the record for the person it belongs to,
            permanently. The log's `?q=` obeys a SECOND rule (D188): for a non-owner, private
            events are excluded from FTS matching altogether, because a redacted hit still
            reveals that the search term occurs in a private title.

            ⚠ THE QUERY LAYER HAS MORE THAN TWO DOORS (D209). The same rules bind
            GET /api/logs/entity/{type}/{id} — which returns full `changes` for any id, and
            the purge screen hands admins ids by design — the `?entity_id=` filter, whose
            exact match confirms an id exists even when every row comes back redacted, and
            /api/logs/stats, whose dimension and bucket totals otherwise count private
            events. And redaction does not stop at this schema: the trigger template's
            `change.<field>` tokens and the push URL are redacted too (D207), or a rule
            whose body is `{{change.original_filename.new}}` delivers a private filename to
            every lock screen with `summary` untouched.
        change_count: { type: integer, description: Number of field changes on this event. }
    AuditChange:
      type: object
      required: [field]
      properties:
        field: { type: string }
        old_value: { type: [string, "null"], description: Full previous value (no truncation). }
        new_value: { type: [string, "null"], description: Full new value (no truncation). }
    AuditEventDetail:
      allOf:
        - $ref: "#/components/schemas/AuditEvent"
        - type: object
          required: [changes]
          properties:
            changes:
              type: array
              description: >-
                ALWAYS an array, never null — an event with no field changes serialises `[]`.
                Go marshals a nil slice as `null`, which crashes a client that indexes into the
                detail view; `orEmptyChanges` closes it on every log read. The same guarantee
                already held for `items`, `buckets` and `totals` in this tag.
              items: { $ref: "#/components/schemas/AuditChange" }
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor: { type: [string, "null"] }
    AuditEventDetailPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEventDetail" }
        next_cursor: { type: [string, "null"] }
    StatsResponse:
      type: object
      required: [dimension, bucket, buckets, totals]
      properties:
        dimension: { type: string, enum: [module, actor, action, level] }
        bucket: { type: string, enum: [day, week] }
        buckets:
          type: array
          description: Per-time-bucket grouped counts.
          items:
            type: object
            required: [ts, counts]
            properties:
              ts: { type: string, format: date-time }
              counts:
                type: object
                additionalProperties: { type: integer }
        totals:
          type: array
          description: Top groups over the whole range.
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string }
              count: { type: integer }

# Default auth for all endpoints: the home session cookie. Health and the login
# endpoint override with `security: []`. State-changing routes additionally require
# the CSRF header (csrfToken) — enforced in handlers; documented per the scheme above.

    VapidKey:
      type: object
      required: [key]
      properties:
        key: { type: string, description: "VAPID public key, base64url" }

    PushSubscriptionRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, description: base64url }
            auth: { type: string, description: base64url }
        user_agent: { type: [string, "null"] }

    PushSubscription:
      type: object
      required: [id, endpoint, created_at, last_seen_at]
      properties:
        id: { type: string }
        endpoint: { type: string, format: uri }
        user_agent: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    PushPreferences:
      type: object
      required: [enabled, categories]
      properties:
        enabled: { type: boolean, description: Master switch }
        categories:
          type: object
          required: [broadcast, triggers, summaries, chat]
          properties:
            broadcast: { type: boolean }
            triggers: { type: boolean }
            summaries: { type: boolean }
            chat: { type: boolean, description: "New in v10 \u2014 the global switch for chat message pushes. Per-conversation mute lives on the membership row (PRD D248)." }
        updated_at: { type: [string, "null"], format: date-time }

    PushTestResult:
      type: object
      description: >-
        What a self-test attempted on the caller's own account. `sent` is what the
        push service actually accepted, which is the only honest basis for telling
        the member their device works.
      required: [subscriptions, sent]
      properties:
        subscriptions: { type: integer, description: The caller's endpoints attempted }
        sent: { type: integer, description: "Of those, how many were accepted" }

    PushPreferencesUpdate:
      type: object
      minProperties: 1
      properties:
        enabled: { type: boolean }
        categories:
          type: object
          properties:
            broadcast: { type: boolean }
            triggers: { type: boolean }
            summaries: { type: boolean }
            chat: { type: boolean }

    Audience:
      type: object
      description: Who receives a notification. `roles`/`users` are used only for the matching scope.
      required: [scope]
      properties:
        scope: { type: string, enum: [all, roles, users] }
        roles:
          type: array
          items: { type: string, enum: [admin, editor, reader] }
        users:
          type: array
          items: { type: string }

    BroadcastRequest:
      type: object
      required: [title, body, audience]
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        url:
          type: [string, "null"]
          # "/" or "/something", never "//host". Written without a lookahead so
          # it holds under RE2 as well as ECMA-262.
          pattern: "^/($|[^/])"
          maxLength: 512
          description: >-
            In-app path a click opens (default "/"). Must be a path, not an
            absolute or protocol-relative URL: the service worker resolves it
            against the app origin, and a value carrying its own scheme would
            win over that base and send a click off-origin. The length cap keeps
            the encrypted push payload inside the ~4 KB Web Push record.
        audience: { $ref: "#/components/schemas/Audience" }

    SendResult:
      type: object
      required: [recipients, subscriptions]
      properties:
        recipients: { type: integer, description: Distinct users targeted after mute filtering }
        subscriptions: { type: integer, description: Device endpoints the payload was queued to }

    ScheduleSpec:
      type: object
      required: [time_local, days]
      properties:
        time_local: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Wall-clock HH:MM in Europe/Prague }
        days:
          type: object
          description: Exactly one recurrence form.
          properties:
            preset: { type: string, enum: [daily, weekdays, weekends] }
            weekdays:
              type: array
              items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
            day_of_month: { type: integer, minimum: 1, maximum: 31, description: "1-31; a value the month lacks (29-31) clamps to that month's last day, matching the events short-month clamp (PRD D19/D74). Not capped at 28." }

    NotificationCondition:
      type: object
      description: >-
        One "count compared to a number" clause. `key` names a metric or list
        from the catalog — a list's value is its length (a shared key names the
        same selection, per the catalog contract).
      required: [key, op, value]
      properties:
        key: { type: string, description: 'Metric or list key, e.g. "events.pripominky_today"' }
        op: { type: string, enum: [gt, gte, lt, lte, eq, neq] }
        value: { type: integer, minimum: 0 }

    NotificationConditions:
      type: object
      description: >-
        A condition block gating a send: with mode "all" every item must hold,
        with "any" at least one. Evaluated at fire time (schedules) or send
        time (trigger rules, after the coalescing window). A block with no
        items means "no conditions" and is stored as null. A condition whose
        value cannot be resolved FAILS OPEN — a transient read error must not
        suppress a notification.
      required: [mode, items]
      properties:
        mode: { type: string, enum: [all, any] }
        items:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/NotificationCondition" }

    NotificationRule:
      type: object
      required: [id, name, enabled, audience, exclude_actor, coalesce_window_seconds,
                 conditions, active_from_local, active_to_local, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        action_key: { type: [string, "null"], description: Exact audit action key (mutually exclusive with action_prefix) }
        action_prefix: { type: [string, "null"], description: "Match all action keys under this dotted prefix, e.g. \"event.\"" }
        filter_module:
          type: [string, "null"]
          enum: [todo, events, notes, documents, dashboard, logging, platform, admin, finance, garden, electricity, null]
          description: >-
            Qualifies action_key, which is a bare verb and therefore not unique
            across modules. The composer sets it from the module the action was
            picked from; null matches the verb in any module.
        filter_entity_type: { type: [string, "null"] }
        filter_level: { type: [string, "null"], enum: [info, warn, error, null] }
        audience: { $ref: "#/components/schemas/Audience" }
        title_template: { type: [string, "null"] }
        body_template:
          type: [string, "null"]
          description: >-
            Omit ⇒ defaults to the audit event's Czech summary. May carry
            {{event.…}}, {{change.…}}, {{now}}/{{date}} and household-scoped
            {{metric.…}}/{{list.…}} tokens — counts and lists are resolved at
            SEND time (after the coalescing window), so they are current.
        coalesce_window_seconds: { type: integer, minimum: 0 }
        exclude_actor: { type: boolean }
        conditions:
          oneOf:
            - $ref: "#/components/schemas/NotificationConditions"
            - type: "null"
          description: >-
            Evaluated at send time; keys must be household-scoped (a trigger
            renders once for its whole audience). Null ⇒ always send.
        active_from_local:
          type: [string, "null"]
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: >-
            Wall-clock window start (Europe/Prague). Set both bounds or
            neither; from > to wraps midnight (22:00–06:00). A send falling
            outside the window is dropped, not queued.
        active_to_local:
          type: [string, "null"]
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationRuleCreate:
      type: object
      required: [name, audience]
      description: Exactly one of action_key / action_prefix must be set.
      properties:
        name: { type: string, minLength: 1 }
        enabled: { type: boolean, default: true }
        action_key: { type: [string, "null"] }
        action_prefix: { type: [string, "null"] }
        filter_module:
          type: [string, "null"]
          description: >-
            Qualifies action_key. A key/module pair no module actually emits is
            refused with 422 rather than stored as a rule that could never fire.
        filter_entity_type: { type: [string, "null"] }
        filter_level: { type: [string, "null"], enum: [info, warn, error, null] }
        audience: { $ref: "#/components/schemas/Audience" }
        title_template: { type: [string, "null"] }
        body_template: { type: [string, "null"] }
        coalesce_window_seconds: { type: [integer, "null"], minimum: 0, description: "Per-rule; omit ⇒ server default 60s; 0 = fire every event" }
        exclude_actor: { type: boolean, default: false, description: "Default false — notify everyone incl. the actor" }
        conditions:
          oneOf:
            - $ref: "#/components/schemas/NotificationConditions"
            - type: "null"
        active_from_local: { type: [string, "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        active_to_local: { type: [string, "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }

    NotificationRuleUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        action_key: { type: [string, "null"] }
        action_prefix: { type: [string, "null"] }
        filter_module: { type: [string, "null"] }
        filter_entity_type: { type: [string, "null"] }
        filter_level: { type: [string, "null"], enum: [info, warn, error, null] }
        audience: { $ref: "#/components/schemas/Audience" }
        title_template: { type: [string, "null"] }
        body_template: { type: [string, "null"] }
        coalesce_window_seconds: { type: [integer, "null"], minimum: 0 }
        exclude_actor: { type: boolean }
        conditions:
          oneOf:
            - $ref: "#/components/schemas/NotificationConditions"
            - type: "null"
          description: Null or a block with no items clears the conditions.
        active_from_local: { type: [string, "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        active_to_local: { type: [string, "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }

    NotificationRulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationRule" }
        next_cursor: { type: [string, "null"] }

    NotificationSchedule:
      type: object
      required: [id, name, enabled, schedule, audience, title_template, body_template, conditions,
                 description, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        schedule: { $ref: "#/components/schemas/ScheduleSpec" }
        audience: { $ref: "#/components/schemas/Audience" }
        title_template: { type: string }
        body_template: { type: string, description: "May contain {{metric.<key>}}, {{list.<key>}}, {{now}}, {{date}} tokens" }
        conditions:
          oneOf:
            - $ref: "#/components/schemas/NotificationConditions"
            - type: "null"
          description: >-
            Evaluated when the slot fires: a summary whose conditions do not
            hold is skipped for the day (the slot is still spent). A
            personal-scoped condition key is evaluated per recipient and skips
            exactly the recipients it fails for. Null ⇒ always send.
        description:
          type: string
          description: >-
            The recurrence as a Czech phrase ("Každý den v 8:00"), rendered SERVER-side
            from the same rules the ticker applies, so the list and the ticker can never
            disagree about what a pattern means.
        last_fired_at: { type: [string, "null"], format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NotificationScheduleCreate:
      type: object
      required: [name, schedule, audience, title_template, body_template]
      properties:
        name: { type: string, minLength: 1 }
        enabled: { type: boolean, default: true }
        schedule: { $ref: "#/components/schemas/ScheduleSpec" }
        audience: { $ref: "#/components/schemas/Audience" }
        title_template: { type: string, minLength: 1 }
        body_template: { type: string, minLength: 1 }
        conditions:
          oneOf:
            - $ref: "#/components/schemas/NotificationConditions"
            - type: "null"

    NotificationScheduleUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        schedule: { $ref: "#/components/schemas/ScheduleSpec" }
        audience: { $ref: "#/components/schemas/Audience" }
        title_template: { type: string, minLength: 1 }
        body_template: { type: string, minLength: 1 }
        conditions:
          oneOf:
            - $ref: "#/components/schemas/NotificationConditions"
            - type: "null"
          description: >-
            Same three states as NotificationRuleUpdate: an omitted field keeps
            the stored block, null (or a block with no items) clears it, a block
            sets it.

    NotificationSchedulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationSchedule" }
        next_cursor: { type: [string, "null"] }

    ActionDescriptor:
      type: object
      required: [key, module]
      properties:
        key: { type: string, description: "e.g. \"card.move\", \"reminder.complete\"" }
        module: { type: string }
        label: { type: [string, "null"], description: Human label / sample Czech summary }

    MetricDescriptor:
      type: object
      required: [key, label]
      properties:
        key: { type: string, description: e.g. "todo.pravedelam_count" }
        label: { type: string, description: Czech label for the composer }
        unit: { type: [string, "null"], description: "e.g. \"úkolů\", \"připomínek\"" }
        scope: { type: string, enum: [household, personal], description: Whether the value personalizes per recipient }

    ListDescriptor:
      type: object
      description: >-
        One module list a summary can name — the "which ones?" beside a metric's
        "how many?". Rendered into the notification as one bulleted line per item,
        capped by the sender.
      required: [key, label]
      properties:
        key: { type: string, description: 'e.g. "events.pripominky_today"' }
        label: { type: string, description: Czech label for the composer }
        empty:
          type: string
          description: What the notification says when the list is empty, e.g. "žádné připomínky"
        scope: { type: string, enum: [household, personal], description: Whether the items personalize per recipient }

    NotificationCatalog:
      type: object
      required: [actions, metrics, lists, tokens, members]
      properties:
        actions:
          type: array
          items: { $ref: "#/components/schemas/ActionDescriptor" }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/MetricDescriptor" }
        lists:
          type: array
          items: { $ref: "#/components/schemas/ListDescriptor" }
        members:
          type: array
          description: >-
            The household directory, served here so the composer needs one round trip.
            Home has no user table — auth owns identity — so this is projected from the
            session store, which caches each identity and its roles at login and REPLACES
            them on every role re-mint (D270): a member's name, address and roles are
            re-read from auth about every fifteen minutes on a session in use. Each member
            is shown from the session whose identity auth confirmed most recently, not from
            the one they logged into most recently — a device signed into once and left in
            a drawer is never re-minted, so its copy must not outrank the one being kept
            current. A rename in auth therefore reaches the household within one refresh
            window rather than at that member's next login. ⚠ An ERASED name is the
            exception and still waits for the next login: a mint that carries no name is
            read as "this token did not say", never as "the member cleared it", so a field
            the token is silent about is kept rather than blanked.
          items: { $ref: "#/components/schemas/HouseholdMember" }
        tokens:
          type: object
          description: Insertable token palette per context.
          properties:
            event:
              type: array
              items: { type: string }
            change:
              type: array
              items: { type: string }
            metric:
              type: array
              items: { type: string }
            list:
              type: array
              items: { type: string }
            time:
              type: array
              items: { type: string }

    HouseholdMember:
      type: object
      description: >-
        A household member as home knows them, with a count of their subscribed
        devices — the audience picker says so, because selecting somebody with no
        device reaches nobody.
      required: [user_id, email, display_name, roles, subscriptions]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string, description: Falls back to the email when unset }
        roles:
          type: array
          items: { type: string }
        subscriptions: { type: integer, description: How many devices this member has registered }

    NotificationDelivery:
      type: object
      required: [id, ts, kind, user_id, user_label, status, category]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        kind: { type: string, enum: [broadcast, trigger, schedule, test, chat] }
        category: { type: string, enum: [broadcast, triggers, summaries, chat] }
        rule_id: { type: [string, "null"] }
        user_id: { type: string }
        user_label:
          type: string
          description: >-
            The recipient's display name, resolved from the member directory —
            the log exists to answer "did it reach Eva?", which a raw id cannot.
            Falls back to the user id for a member home no longer has a session for.
        subscription_id: { type: [string, "null"] }
        status: { type: string, enum: [sent, failed, expired] }
        error: { type: [string, "null"] }

    NotificationDeliveryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationDelivery" }
        next_cursor: { type: [string, "null"] }
    # ----- Finance (v6) -----
    # Column vocabulary is carried over verbatim from the retiring `fin` service
    # (PRD D83): the two income slots keep their names. Only the wire style is
    # Home's — snake_case, PATCH, /api/finance (PRD D92).
    FinanceRates:
      type: object
      description: >-
        Percentages OF TOTAL INCOME. Whole integers, each >= 0, summing to exactly
        100. Not a partial structure: all four are always sent together.
      required: [personal, operational, fun, no_fun]
      properties:
        personal: { type: integer, minimum: 0, maximum: 100, description: Personal/wants — the share each person keeps on their own account }
        operational: { type: integer, minimum: 0, maximum: 100, description: Operational/needs — what stays in the joint "Kandy" account }
        fun: { type: integer, minimum: 0, maximum: 100, description: "Fun savings (pooled, not per person)" }
        no_fun: { type: integer, minimum: 0, maximum: 100, description: "No-fun savings (pooled, not per person)" }
    FinanceSplit:
      type: object
      description: >-
        The DERIVED breakdown — computed on read from the inputs by the locked
        formula (PRD §V6-4 FR-F3), never stored. All values are whole CZK.
        Invariants: personal_X + to_operational_X == income_X per person;
        fun_savings + no_fun_savings + needs == operational_received;
        personal_kaja + personal_andy + operational_received == total_income.
        `needs` is the remainder and absorbs all rounding.
      required:
        [total_income, personal_kaja, personal_andy, to_operational_kaja, to_operational_andy,
         operational_received, fun_savings, no_fun_savings, needs]
      properties:
        total_income: { type: integer, description: income_kaja + income_andy }
        personal_kaja: { type: integer, description: round(income_kaja * personal/100) }
        personal_andy: { type: integer, description: round(income_andy * personal/100) }
        to_operational_kaja: { type: integer, description: income_kaja - personal_kaja }
        to_operational_andy: { type: integer, description: income_andy - personal_andy }
        operational_received: { type: integer, description: to_operational_kaja + to_operational_andy }
        fun_savings: { type: integer, description: round(total_income * fun/100) }
        no_fun_savings: { type: integer, description: round(total_income * no_fun/100) }
        needs: { type: integer, description: operational_received - fun_savings - no_fun_savings (the remainder) }
    FinanceMonth:
      type: object
      required: [id, month, income_kaja, income_andy, rates, split, created_at, updated_at]
      properties:
        id: { type: string, description: UUIDv7. Seeded rows keep the id they had in `fin` (PRD D91). }
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", description: "Calendar month, YYYY-MM. UNIQUE — delete is permanent, so no lingering row can hold a month." }
        income_kaja: { type: integer, minimum: 0, description: Whole CZK }
        income_andy: { type: integer, minimum: 0, description: Whole CZK }
        rates: { $ref: "#/components/schemas/FinanceRates" }
        split: { $ref: "#/components/schemas/FinanceSplit" }
        created_by:
          type: [string, "null"]
          description: Home user id. NULL for rows seeded from `fin`, which recorded no actor.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FinanceMonthCreate:
      type: object
      required: [month, income_kaja, income_andy, rates]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        income_kaja: { type: integer, minimum: 0 }
        income_andy: { type: integer, minimum: 0 }
        rates: { $ref: "#/components/schemas/FinanceRates" }
    FinanceMonthUpdate:
      type: object
      description: >-
        Partial update. Omitted fields are left alone. `rates` is all-or-nothing —
        a partial rates object is 422.
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        income_kaja: { type: integer, minimum: 0 }
        income_andy: { type: integer, minimum: 0 }
        rates: { $ref: "#/components/schemas/FinanceRates" }
    FinanceMonthPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinanceMonth" }
        next_cursor:
          type: [string, "null"]
          description: >-
            The last item's `month` (YYYY-MM), to pass back as `cursor`. A month
            key, not a UUIDv7 — finance keysets on `month`, unlike the other
            paged collections.

    # ----- Zahrada / garden (v7) -----
    # Identifiers are English, the UI is Czech (PRD D20 / §V7-7). The module holds no
    # bytes (PRD D122) and sends no push (PRD D113). Everything derived — the
    # occupancy window, every check result, effective species+variety values, actual
    # yields — is computed on read and never stored.
    GardenFamily:
      type: string
      description: >-
        Botanical family. A FIXED ENUM, not free text (PRD D104): it is the key the
        rotation engine and the family-pair rules join on, and free text would make
        both a lottery.
      enum: [brassicaceae, solanaceae, fabaceae, apiaceae, cucurbitaceae, amaryllidaceae,
             asteraceae, amaranthaceae, poaceae, lamiaceae, rosaceae, polygonaceae,
             grossulariaceae, valerianaceae, other]
    GardenPlantType:
      type: string
      enum: [vegetable, herb, fruit_tree, fruit_bush, perennial, flower]
    GardenHardiness:
      type: string
      description: >-
        Frost tolerance. REQUIRED on every crop (PRD D111) — it is what the frost
        evaluation reads to decide whether a planting is at risk tonight.
      enum: [tender, half_hardy, hardy]
    GardenFeederClass:
      type: string
      description: Nutrient demand; drives check C8 (heavy feeder following heavy feeder).
      enum: [heavy, medium, light, fixer]
    GardenSowMethod:
      type: string
      enum: [direct, seedling, both, vegetative]
    GardenHarvestUnit:
      type: string
      enum: [kg, ks, l, svazek]
    GardenStorageMethod:
      type: string
      enum: [cellar, dry, freeze, ferment, can, sand, in_ground]
    GardenBedType:
      type: string
      enum: [raised, ground, greenhouse, polytunnel, container, orchard]
    GardenTimingAnchor:
      type: string
      description: >-
        What `from`/`to` are measured against (PRD D102). `week` = ISO week of the
        year. `last_frost` / `first_frost` = DAYS relative to the season's frost
        dates, so the window moves when the season does — which is the point.
      enum: [week, last_frost, first_frost]
    GardenTimingWindow:
      type: object
      description: >-
        A knowledge-base window. Anchors are mixable per window and per crop: sowing
        indoors is naturally frost-relative, while "výsev: týden 10–13" is how Czech
        garden literature states a direct sowing, and forcing either into the other's
        form would be pedantry.
      required: [anchor, from, to]
      properties:
        anchor: { $ref: "#/components/schemas/GardenTimingAnchor" }
        from: { type: integer, description: "ISO week 1–53, or a day offset (negative = before the anchor)." }
        to: { type: integer, description: Must be >= `from` in the anchor's own units. }
    GardenPestIssue:
      type: object
      description: >-
        Structured rather than one prose blob, because an LLM fills these well and
        they are worth searching.
      required: [name]
      properties:
        name: { type: string }
        symptom: { type: string }
        remedy_md: { type: string }
    GardenProvenance:
      type: object
      description: >-
        Where a record came from (PRD D114). An LLM-filled crop nobody has checked
        must LOOK different from one a human confirmed — hence the "neověřeno" badge
        the UI derives from `verified_at` being null.
      properties:
        source: { type: string, enum: [manual, llm] }
        source_model: { type: [string, "null"] }
        source_at: { type: [string, "null"], format: date-time }
        verified_by: { type: [string, "null"] }
        verified_at: { type: [string, "null"], format: date-time }
    GardenPlantCore:
      type: object
      description: >-
        The knowledge-base fields shared by a species and by a variety's overrides.

        EVERY PROPERTY HERE IS NULLABLE ON THE WIRE, AND NONE IS EVER ABSENT. One shape
        serves both levels, so each field serialises explicitly: `null` means "not set"
        on a species and "inherit from the species" on a variety (PRD D103) — the same
        null read two ways, which is what lets one schema serve both. A reader must
        handle null on all of them, including the booleans and the arrays.
      properties:
        name_latin: { type: [string, "null"] }
        feeder_class:
          oneOf:
            - $ref: "#/components/schemas/GardenFeederClass"
            - type: "null"
        root_depth: { type: [string, "null"], enum: [shallow, medium, deep, null] }
        sun: { type: [string, "null"], enum: [full, partial, shade, null] }
        water_need: { type: [string, "null"], enum: [low, medium, high, null] }
        soil_ph_min: { type: [number, "null"] }
        soil_ph_max: { type: [number, "null"] }
        rotation_break_years: { type: [integer, "null"], minimum: 0, maximum: 10, description: Defaults from the family when null. }
        sow_method:
          oneOf:
            - $ref: "#/components/schemas/GardenSowMethod"
            - type: "null"
        needs_pricking_out: { type: [boolean, "null"] }
        needs_support: { type: [boolean, "null"], description: "Care flag — the generator emits an `support` (Opora a vyvazování) task only for crops that need one. Null reads as false on a species and as inherit on a variety, so an explicit `false` is how a variety says no to a species that says yes." }
        wants_mulch: { type: [boolean, "null"], description: "Care flag — drives the `mulch` (Mulčování) task. Null reads as false on a species and as inherit on a variety." }
        wants_pest_check: { type: [boolean, "null"], description: "Care flag — drives a `pest_check` (Kontrola škůdců) task every 30 days across the occupancy window, capped at twelve. Null reads as false on a species and as inherit on a variety." }
        hardening_days: { type: [integer, "null"], minimum: 0 }
        sow_depth_cm: { type: [number, "null"], minimum: 0 }
        spacing_row_cm: { type: [number, "null"], minimum: 0 }
        spacing_plant_cm: { type: [number, "null"], minimum: 0 }
        plants_per_m2: { type: [number, "null"], minimum: 0, description: Derived from the two spacings when null; overridable. }
        days_to_germinate_min: { type: [integer, "null"], minimum: 0 }
        days_to_germinate_max: { type: [integer, "null"], minimum: 0 }
        germination_temp_c: { type: [integer, "null"] }
        days_to_maturity_min: { type: [integer, "null"], minimum: 0 }
        days_to_maturity_max: { type: [integer, "null"], minimum: 0 }
        win_sow_indoor:
          oneOf:
            - $ref: "#/components/schemas/GardenTimingWindow"
            - type: "null"
        win_sow_direct:
          oneOf:
            - $ref: "#/components/schemas/GardenTimingWindow"
            - type: "null"
        win_transplant:
          oneOf:
            - $ref: "#/components/schemas/GardenTimingWindow"
            - type: "null"
        win_harvest:
          oneOf:
            - $ref: "#/components/schemas/GardenTimingWindow"
            - type: "null"
        harvest_unit:
          oneOf:
            - $ref: "#/components/schemas/GardenHarvestUnit"
            - type: "null"
          description: >-
            Required on a SPECIES (a crop that states no unit is refused with a 422) and
            therefore never null on one. Null on a variety, and on a resolved
            `GardenEffective` it falls back to `kg`.
        yield_per_m2: { type: [number, "null"], minimum: 0, description: "kg per m², used by check C4's sizing hints and by the yield comparison." }
        yield_per_plant: { type: [number, "null"], minimum: 0 }
        storage_methods:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/GardenStorageMethod" }
        storage_temp_c: { type: [integer, "null"] }
        storage_humidity: { type: [integer, "null"], minimum: 0, maximum: 100 }
        shelf_life_days: { type: [integer, "null"], minimum: 0 }
        pests:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/GardenPestIssue" }
        diseases:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/GardenPestIssue" }
        notes_md: { type: [string, "null"], description: Markdown. Indexed in FTS5 with the names and the pest/disease names. }
    GardenPlant:
      allOf:
        - $ref: "#/components/schemas/GardenPlantCore"
        - type: object
          required: [id, name_cs, family, plant_type, hardiness, harvest_unit, created_at, updated_at]
          properties:
            id: { type: string, description: UUIDv7 }
            name_cs: { type: string, description: UNIQUE among live rows. }
            family: { $ref: "#/components/schemas/GardenFamily" }
            plant_type: { $ref: "#/components/schemas/GardenPlantType" }
            hardiness: { $ref: "#/components/schemas/GardenHardiness" }
            variety_count: { type: integer }
            provenance: { $ref: "#/components/schemas/GardenProvenance" }
            created_by: { type: [string, "null"] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    GardenPlantCreate:
      allOf:
        - $ref: "#/components/schemas/GardenPlantCore"
        - type: object
          required: [name_cs, family, plant_type, hardiness, harvest_unit]
          properties:
            name_cs: { type: string, minLength: 1 }
            family: { $ref: "#/components/schemas/GardenFamily" }
            plant_type: { $ref: "#/components/schemas/GardenPlantType" }
            hardiness: { $ref: "#/components/schemas/GardenHardiness" }
    GardenPlantUpdate:
      allOf:
        - $ref: "#/components/schemas/GardenPlantCore"
        - type: object
          description: Partial. Omitted fields are left alone.
          properties:
            name_cs: { type: string, minLength: 1 }
            family: { $ref: "#/components/schemas/GardenFamily" }
            plant_type: { $ref: "#/components/schemas/GardenPlantType" }
            hardiness: { $ref: "#/components/schemas/GardenHardiness" }
            verified: { type: boolean, description: Set true to clear the "neověřeno" badge; stamps verified_by/at from the session. }
    GardenPlantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenPlant" }
        next_cursor: { type: [string, "null"] }
    GardenVariety:
      allOf:
        - $ref: "#/components/schemas/GardenPlantCore"
        - type: object
          required: [id, plant_id, name, created_at, updated_at]
          properties:
            id: { type: string }
            plant_id: { type: string }
            name: { type: string, description: UNIQUE within the species among live rows. }
            supplier: { type: [string, "null"] }
            description_md: { type: [string, "null"] }
            is_favourite: { type: boolean }
            retired: { type: boolean }
            effective:
              $ref: "#/components/schemas/GardenEffective"
            provenance: { $ref: "#/components/schemas/GardenProvenance" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
      description: >-
        A variety carries SPARSE overrides: every inherited field is nullable and null
        means "inherit from the species" (PRD D103). `effective` is the resolved
        record — variety value if non-null, else species value — produced by the one
        shared resolution function every consumer reads through, so the planner, the
        task generator, the check and the widget cannot disagree about when to sow
        this variety. It is present on GET /api/garden/varieties/{id} and omitted from
        the list; it is never accepted on a write.
    GardenEffective:
      allOf:
        - $ref: "#/components/schemas/GardenPlantCore"
        - type: object
          required: [plant_id, plant_name, family, plant_type, hardiness]
          properties:
            plant_id: { type: string }
            plant_name: { type: string }
            family: { $ref: "#/components/schemas/GardenFamily" }
            plant_type: { $ref: "#/components/schemas/GardenPlantType" }
            hardiness: { $ref: "#/components/schemas/GardenHardiness" }
            variety_id: { type: [string, "null"] }
            variety_name: { type: [string, "null"] }
      description: >-
        A species with every overridable field resolved against a variety (PRD D103) —
        what the planner, the task generator, the check engine and the widget all read,
        never a plant and a variety side by side.

        It is NOT a `GardenPlant`: there is no `id`, no `name_cs`, no `variety_count`, no
        `provenance` and no timestamps, because a resolved record is a computed view of
        two rows rather than a row of its own. What it adds instead is the identity of
        both sides — `plant_id`/`plant_name` and the variety pair, null when no variety
        was named.
    GardenVarietyCreate:
      allOf:
        - $ref: "#/components/schemas/GardenPlantCore"
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            supplier: { type: string }
            description_md: { type: string }
            is_favourite: { type: boolean }
            verified: { type: boolean, description: Set true to clear the "neověřeno" badge; stamps verified_by/at from the session. }
    GardenVarietyUpdate:
      allOf:
        - $ref: "#/components/schemas/GardenPlantCore"
        - type: object
          description: >-
            Partial. Sending a field as NULL restores inheritance from the species;
            omitting it leaves the existing override alone.
          properties:
            name: { type: string, minLength: 1 }
            supplier: { type: [string, "null"] }
            description_md: { type: [string, "null"] }
            is_favourite: { type: boolean }
            retired: { type: boolean }
            verified: { type: boolean, description: "Set true to clear the \"neověřeno\" badge, false to withdraw it; both stamp or clear verified_by/at. A claim you cannot withdraw is one the next reader cannot trust." }
    GardenVarietyPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenVariety" }
        next_cursor: { type: [string, "null"] }
    GardenBed:
      type: object
      required: [id, name, code, type, area_m2, is_active, position, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string, description: "Short label shown on chips and in printed task lists, e.g. `A1`." }
        type: { $ref: "#/components/schemas/GardenBedType" }
        length_cm: { type: [number, "null"], minimum: 0 }
        width_cm: { type: [number, "null"], minimum: 0 }
        area_m2: { type: number, description: Derived from the dimensions; settable directly for irregular shapes. }
        sun_exposure: { type: [string, "null"], enum: [full, partial, shade, null] }
        zone: { type: [string, "null"], description: Free label ("horní zahrada"). Adjacency is only ever inferred WITHIN one zone. }
        soil_notes_md: { type: [string, "null"] }
        is_active: { type: boolean }
        position: { type: string, description: Lexorank. Order within a zone IS the adjacency model (PRD D117). }
        neighbours:
          type: array
          description: The beds immediately before and after this one in its zone — derived, never stored.
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GardenBedCreate:
      type: object
      description: >-
        THE BED MUST END UP WITH AN AREA. Send `area_m2` directly, or send BOTH
        `length_cm` and `width_cm` and let it derive; a body with neither — or with only
        one dimension — is a 422, because a bed with no area cannot be sized,
        over-booked or checked.
      required: [name, code, type]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1, maxLength: 8 }
        type: { $ref: "#/components/schemas/GardenBedType" }
        length_cm: { type: number, minimum: 0 }
        width_cm: { type: number, minimum: 0 }
        area_m2: { type: number, minimum: 0 }
        sun_exposure: { type: string, enum: [full, partial, shade] }
        zone: { type: string }
        soil_notes_md: { type: string }
        is_active: { type: boolean, default: true, description: Send false to create a bed already retired. }
    GardenBedUpdate:
      type: object
      description: Partial. Omitted fields are left alone.
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1, maxLength: 8 }
        type: { $ref: "#/components/schemas/GardenBedType" }
        length_cm: { type: [number, "null"], minimum: 0 }
        width_cm: { type: [number, "null"], minimum: 0 }
        area_m2: { type: [number, "null"], minimum: 0 }
        sun_exposure: { type: [string, "null"] }
        zone: { type: [string, "null"] }
        soil_notes_md: { type: [string, "null"] }
        is_active: { type: boolean }
    GardenBedMove:
      type: object
      description: Exactly one of `after_id` / `before_id`, or neither to move to the head of the zone.
      properties:
        zone: { type: [string, "null"], description: Move to another zone; omit to stay. }
        after_id: { type: string }
        before_id: { type: string }
    GardenBedHistory:
      type: object
      description: >-
        What occupied this bed, per CLOSED season only (PRD D120). Empty on a fresh
        install — which is why checks C3/C8 report `no_history` rather than a pass.
      required: [bed_id, seasons]
      properties:
        bed_id: { type: string }
        seasons:
          type: array
          items:
            type: object
            required: [year, families]
            properties:
              year: { type: integer }
              families:
                type: array
                items: { $ref: "#/components/schemas/GardenFamily" }
              plantings:
                type: array
                items:
                  type: object
                  properties:
                    plant_name: { type: string }
                    variety_name: { type: [string, "null"] }
                    yield_kg: { type: [number, "null"] }
    GardenBedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenBed" }
        next_cursor: { type: [string, "null"] }
    GardenSeasonStatus:
      type: string
      enum: [planning, active, closed]
    GardenSeason:
      type: object
      required: [year, status, created_at, updated_at]
      properties:
        year: { type: integer, description: "The season's identity and its API key (PRD D128): unique, immutable, user-visible." }
        status: { $ref: "#/components/schemas/GardenSeasonStatus" }
        last_frost_on: { type: [string, "null"], format: date, description: Expected. Anchors every `last_frost` window in the season. }
        first_frost_on: { type: [string, "null"], format: date }
        last_frost_actual_on: { type: [string, "null"], format: date, description: Observed; recorded at close. }
        first_frost_actual_on: { type: [string, "null"], format: date }
        planting_count: { type: integer }
        closed_at: { type: [string, "null"], format: date-time }
        closed_by: { type: [string, "null"] }
        notes_md: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GardenSeasonCreate:
      type: object
      required: [year]
      properties:
        year: { type: integer }
        last_frost_on: { type: string, format: date }
        first_frost_on: { type: string, format: date }
        notes_md: { type: string }
        copy_from: { type: integer, description: Copy every non-permanent planting from this year. }
        shift:
          type: object
          description: >-
            Rotate bed assignments over the ordered active beds — the
            "posuň rodiny o jeden záhon" move. Every planting slides `offset` beds from
            its OWN bed, wrapping at the end, so a family keeps its shape: one spread
            across A1 and A3 lands on A2 and A4. An `offset` whose magnitude exceeds the
            number of active beds is a 422.
          properties:
            offset: { type: integer }
            by_family:
              type: boolean
              default: true
              description: >-
                ⚠ ACCEPTED BUT INERT AS BUILT. It changes nothing: the shift is always
                the per-planting slide described above, which IS the family block move.
                The earlier family-anchored version measured every planting of a family
                from one anchor bed and so collapsed A1+A3 onto A2 — over-booking one bed
                and emptying another — and was removed. The field is still read from the
                body so older clients do not break; do not build on it.
    GardenSeasonUpdate:
      type: object
      description: >-
        Partial. Changing a frost date RE-ANCHORS every frost-anchored planned date in
        the season that the user has not manually overridden.
      properties:
        status:
          type: string
          enum: [planning, active]
          description: >-
            Only the two OPEN states are settable here. `closed` is refused with a 422:
            closing is a ritual that records observed frost dates and per-planting
            outcomes, so it has its own action (POST …/close), and re-opening is
            admin-only.
        last_frost_on: { type: [string, "null"], format: date }
        first_frost_on: { type: [string, "null"], format: date }
        notes_md: { type: [string, "null"] }
    GardenSeasonClose:
      type: object
      description: >-
        The Uzavřít sezónu ritual (PRD D120). Everything here is optional but the
        screen asks for all of it, because a half-recorded season becomes half-trusted
        history.
      properties:
        last_frost_actual_on: { type: string, format: date }
        first_frost_actual_on: { type: string, format: date }
        notes_md: { type: string }
        outcomes:
          type: array
          description: Final per-planting outcome; a `failed` planting with a reason is data, not an embarrassment.
          items:
            type: object
            required: [planting_id, status]
            properties:
              planting_id: { type: string }
              status: { type: string, enum: [done, failed] }
              fail_reason: { type: string }
              final_yield: { type: number, minimum: 0 }
              final_yield_unit: { $ref: "#/components/schemas/GardenHarvestUnit" }
    GardenSeasonPreview:
      type: object
      description: >-
        The `dry_run=true` response (PRD D129). NOTHING WAS PERSISTED. `check` is the
        prospective season's check and `check_before` is the source season's, so the
        UI can show what a rotation shift fixed and what it broke, side by side,
        before the season exists.
      required: [season, plantings, check]
      properties:
        season: { $ref: "#/components/schemas/GardenSeason" }
        plantings:
          type: array
          items: { $ref: "#/components/schemas/GardenPlanting" }
        check: { $ref: "#/components/schemas/GardenCheckResult" }
        check_before: { $ref: "#/components/schemas/GardenCheckResult" }
    GardenSeasonPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenSeason" }
        next_cursor: { type: [string, "null"] }
    GardenPlantingStatus:
      type: string
      enum: [planned, sown, planted, growing, harvesting, done, failed]
    GardenOccupancy:
      type: object
      description: >-
        DERIVED, never stored. This — not calendar-year membership — is what "shares a
        bed" means everywhere in the module (PRD D107), so spring špenát and autumn pórek
        in one bed never warn against each other.

        `from` is the day the crop reaches THE BED: the first set of `sowed_on`,
        `sow_direct_on`, `transplanted_on`, `transplant_on`, falling back to `planted_on`
        for a permanent, which is in the ground from the day it was planted. NO INDOOR
        DATE EVER DATES A BED — when the plan has a `sow_indoor_on`, `sowed_on` names the
        tray rather than the bed and is skipped, or a seedling on a windowsill in March
        would collide with the spring crop still standing outside.

        `to` is the first set of `cleared_on`, `removed_on`, `harvest_to`.

        Either bound may be null, meaning open-ended: for the conflict checks that is
        deliberate and conservative — an un-dated planting overlaps everything in its bed
        and provokes a question rather than silence.
      properties:
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
    GardenDrift:
      type: object
      description: >-
        How far reality has moved from the plan. Present because actual dates NEVER
        re-drive planned windows (PRD D119): the drift is stated in words instead, and
        POST /api/garden/plantings/{id}/shift-tasks is the explicit way to act on it.
      properties:
        days: { type: integer, description: "Positive = later than planned." }
        stage: { type: string, enum: [sow, transplant, harvest] }
        message_cs: { type: string, example: "vyseto o 14 dní později, sklizeň v plánu beze změny" }
    GardenPlanting:
      type: object
      required: [id, plant_id, status, created_at, updated_at]
      properties:
        id: { type: string }
        season_id: { type: [string, "null"], description: "NULL ⇒ a PERMANENT planting — a tree, a rhubarb crown, an asparagus bed (PRD D106)." }
        season_year: { type: [integer, "null"] }
        bed_id: { type: [string, "null"] }
        bed_code: { type: [string, "null"] }
        location_label: { type: [string, "null"], description: "For permanents outside any bed, e.g. a row of currants along the fence." }
        plant_id: { type: string }
        plant_name: { type: string }
        family: { $ref: "#/components/schemas/GardenFamily" }
        variety_id: { type: [string, "null"] }
        variety_name: { type: [string, "null"] }
        area_m2: { type: [number, "null"] }
        plant_count: { type: [integer, "null"] }
        rows: { type: [integer, "null"] }
        sow_indoor_on: { type: [string, "null"], format: date }
        sow_direct_on: { type: [string, "null"], format: date }
        transplant_on: { type: [string, "null"], format: date }
        harvest_from: { type: [string, "null"], format: date }
        harvest_to: { type: [string, "null"], format: date }
        manual_dates:
          type: array
          description: Which planned dates the user set by hand. A re-anchor skips exactly these.
          items: { type: string, enum: [sow_indoor_on, sow_direct_on, transplant_on, harvest_from, harvest_to] }
        sowed_on: { type: [string, "null"], format: date }
        transplanted_on: { type: [string, "null"], format: date }
        first_harvest_on: { type: [string, "null"], format: date }
        cleared_on: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/GardenPlantingStatus" }
        fail_reason: { type: [string, "null"] }
        planted_on: { type: [string, "null"], format: date, description: Permanents only. }
        rootstock: { type: [string, "null"], description: Podnož. Permanents only. }
        removed_on: { type: [string, "null"], format: date }
        occupancy: { $ref: "#/components/schemas/GardenOccupancy" }
        drift: { $ref: "#/components/schemas/GardenDrift" }
        harvest_unit:
          oneOf:
            - $ref: "#/components/schemas/GardenHarvestUnit"
            - type: "null"
          description: >-
            The crop's RESOLVED (species+variety) unit, carried beside the two yield
            numbers because both are stated in it. Without it a screen showing a yield
            shows a bare number and one asking for a yield asks an ambiguous question —
            which is how a count of onions becomes kilograms. Derived, never stored.
        yield_actual: { type: [number, "null"], description: "Σ harvests, in the crop's unit. Derived." }
        yield_expected: { type: [number, "null"], description: yield_per_m2 × area (or per plant × count). Derived. }
        notes_md: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GardenPlantingCreate:
      type: object
      required: [plant_id]
      properties:
        season_id: { type: [string, "null"], description: Omit or null for a permanent planting. }
        season_year: { type: integer, description: "The planner's actual path: it knows the year from its URL, not the season's surrogate id, so it sends this and the server resolves it to `season_id` (PRD D128). An unknown year is a 404. Send one or the other, not both — `season_id` wins." }
        bed_id: { type: string }
        location_label: { type: string }
        plant_id: { type: string }
        variety_id: { type: string }
        area_m2: { type: number, minimum: 0, description: Exactly one of area_m2 / plant_count. }
        plant_count: { type: integer, minimum: 1 }
        rows: { type: integer, minimum: 1 }
        sow_indoor_on: { type: string, format: date, description: Any date sent here is flagged manual and survives later re-anchors. }
        sow_direct_on: { type: string, format: date }
        transplant_on: { type: string, format: date }
        harvest_from: { type: string, format: date }
        harvest_to: { type: string, format: date }
        planted_on: { type: string, format: date }
        rootstock: { type: string }
        notes_md: { type: string }
    GardenPlantingUpdate:
      type: object
      description: >-
        Partial. Setting an ACTUAL date changes no planned window (PRD D119). Changing a
        PLANNED date, the bed, the variety or the quantity re-runs task generation under
        the D110 rules.

        THE CROP IS NOT UPDATABLE. `plant_id` is deliberately absent, and one sent anyway
        is ignored rather than applied — a planting that became a different crop would
        carry its harvests, its rotation history and its generated work across with it.
      properties:
        bed_id: { type: [string, "null"] }
        location_label: { type: [string, "null"] }
        variety_id: { type: [string, "null"] }
        area_m2: { type: [number, "null"], minimum: 0 }
        plant_count: { type: [integer, "null"], minimum: 1 }
        rows: { type: [integer, "null"] }
        sow_indoor_on: { type: [string, "null"], format: date }
        sow_direct_on: { type: [string, "null"], format: date }
        transplant_on: { type: [string, "null"], format: date }
        harvest_from: { type: [string, "null"], format: date }
        harvest_to: { type: [string, "null"], format: date }
        sowed_on: { type: [string, "null"], format: date }
        transplanted_on: { type: [string, "null"], format: date }
        first_harvest_on: { type: [string, "null"], format: date }
        cleared_on: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/GardenPlantingStatus" }
        fail_reason: { type: [string, "null"] }
        planted_on: { type: [string, "null"], format: date, description: Permanents only. }
        rootstock: { type: [string, "null"], description: Podnož. Permanents only. }
        removed_on: { type: [string, "null"], format: date }
        notes_md: { type: [string, "null"] }
    GardenPlantingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenPlanting" }
        next_cursor: { type: [string, "null"] }
    GardenTaskKind:
      type: string
      description: >-
        `water` and `weed` are MANUAL-ONLY (PRD D118) — they are decided by looking at
        the garden, and a generated cadence nobody ticks off devalues every other row
        in the list.
      enum: [bed_prep, sow_indoor, prick_out, harden_off, sow_direct, transplant, thin,
             support, feed, mulch, pest_check, prune, spray, harvest, process, store,
             clear, water, weed, other]
    GardenTaskStatus:
      type: string
      enum: [open, done, skipped]
    GardenTask:
      type: object
      required: [id, kind, title_cs, window_from, window_to, status, is_generated, is_edited]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/GardenTaskKind" }
        season_id: { type: [string, "null"] }
        planting_id: { type: [string, "null"] }
        bed_id: { type: [string, "null"] }
        bed_code: { type: [string, "null"] }
        plant_name: { type: [string, "null"] }
        variety_name: { type: [string, "null"] }
        title_cs: { type: string }
        window_from: { type: string, format: date }
        window_to: { type: string, format: date }
        due_hint: { type: [string, "null"], format: date, description: The ideal day inside the window; advisory only. }
        overdue: { type: boolean, description: Derived — open and `window_to` is in the past. }
        status: { $ref: "#/components/schemas/GardenTaskStatus" }
        completed_by: { type: [string, "null"] }
        completed_at: { type: [string, "null"], format: date-time }
        is_generated: { type: boolean }
        is_edited: { type: boolean, description: "Set by any user edit. Once true, regeneration never touches this task again (PRD D110)." }
        generation_key: { type: [string, "null"], description: "hash(planting, kind, occurrence) — the identity regeneration matches on." }
        notes_md: { type: [string, "null"] }
        position: { type: string }
    GardenTaskCreate:
      type: object
      required: [kind, title_cs, window_from, window_to]
      properties:
        kind: { $ref: "#/components/schemas/GardenTaskKind" }
        title_cs: { type: string, minLength: 1 }
        window_from: { type: string, format: date }
        window_to: { type: string, format: date }
        due_hint: { type: string, format: date }
        season_id: { type: string }
        season_year: { type: integer, description: "The planner's actual path: it knows the year from its URL, not the season's surrogate id, so it sends this and the server resolves it to `season_id` (PRD D128). An unknown year is a 404. Send one or the other, not both — `season_id` wins." }
        planting_id: { type: string }
        bed_id: { type: string }
        notes_md: { type: string }
    GardenTaskUpdate:
      type: object
      description: Editing a GENERATED task sets `is_edited=true`, permanently exempting it from regeneration.
      properties:
        kind: { $ref: "#/components/schemas/GardenTaskKind" }
        title_cs: { type: string, minLength: 1 }
        window_from: { type: string, format: date }
        window_to: { type: string, format: date }
        due_hint: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/GardenTaskStatus" }
        notes_md: { type: [string, "null"] }
    GardenTaskComplete:
      type: object
      properties:
        meta:
          type: object
          description: 'Provenance for the audit event, e.g. {"via":"dashboard"} from the widget.'
          additionalProperties: true
    GardenShiftTasks:
      type: object
      required: [days]
      properties:
        days: { type: integer, description: "Positive = later. Applied to open tasks only." }
        kinds:
          type: array
          description: Restrict the shift to these kinds; omit for all remaining open tasks.
          items: { $ref: "#/components/schemas/GardenTaskKind" }
    GardenTaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenTask" }
        next_cursor: { type: [string, "null"] }
    GardenWarningSeverity:
      type: string
      enum: [error, warn, info, tip]
    GardenWarning:
      type: object
      description: >-
        Computed on read, never stored (PRD D108). A warning is ADVISORY — it never
        blocks a save (PRD D109).
      required: [key, check, severity, title_cs]
      properties:
        key: { type: string, description: "Stable and opaque: hash(check, rule, bed, sorted plantings, season year, per-check discriminator). The check id is in the hash so two checks firing on the same tuple do not share a dismissal, and the discriminator separates a check that can fire more than once on it — C10 per date field, C11 per reason. The YEAR is in it deliberately, so a copied season does not inherit last year's dismissals. Change the plan enough and the warning correctly returns." }
        check: { type: string, enum: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11] }
        severity: { $ref: "#/components/schemas/GardenWarningSeverity" }
        title_cs: { type: string }
        detail_cs: { type: string }
        bed_id: { type: [string, "null"] }
        planting_ids:
          type: array
          items: { type: string }
        rule_id: { type: [string, "null"] }
        dismissed: { type: boolean }
        dismissed_note: { type: [string, "null"] }
    GardenCheckResult:
      type: object
      required: [year, warnings, counts, history]
      properties:
        year: { type: integer }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/GardenWarning" }
        counts:
          type: object
          description: Non-dismissed counts by severity. `garden.plan_warnings` is error+warn.
          properties:
            error: { type: integer }
            warn: { type: integer }
            info: { type: integer }
            tip: { type: integer }
        history:
          type: object
          description: >-
            Whether the history-dependent checks could run at all. With no CLOSED
            season behind it, C3 and C8 report `no_history` and the UI renders
            "rotaci zatím nelze zkontrolovat, chybí historie" — a check that cannot
            run must never look like one that ran and found nothing (PRD D120).
          required: [status, closed_seasons]
          properties:
            status: { type: string, enum: [ok, no_history] }
            closed_seasons: { type: integer }
    GardenWarningDismissal:
      type: object
      required: [key]
      properties:
        key: { type: string }
        note: { type: string, example: "vím, letos to risknu" }
        dismissed_by: { type: string, readOnly: true }
        dismissed_at: { type: string, format: date-time, readOnly: true }
    GardenHarvest:
      type: object
      required: [id, planting_id, harvested_on, quantity, unit]
      properties:
        id: { type: string }
        planting_id: { type: string }
        plant_name: { type: string }
        bed_code: { type: [string, "null"] }
        harvested_on: { type: string, format: date }
        quantity: { type: number, minimum: 0 }
        unit: { $ref: "#/components/schemas/GardenHarvestUnit" }
        destination: { type: [string, "null"], enum: [fresh, storage, gift, compost, null] }
        quality: { type: [string, "null"] }
        note: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    GardenHarvestCreate:
      type: object
      required: [planting_id, harvested_on, quantity]
      properties:
        planting_id: { type: string }
        harvested_on: { type: string, format: date, description: Defaults to today. A date before the crop reached its bed is a 422. }
        quantity: { type: number, exclusiveMinimum: 0, description: "STRICTLY POSITIVE. A zero row is not a harvest: it would still stamp `first_harvest_on`, flip the planting to `harvesting` and make `yield_actual` non-null — so the season-close review would read \"už zapsáno\" and never offer the box for the real figure, which then could not be entered at all once the season froze." }
        unit: { $ref: "#/components/schemas/GardenHarvestUnit" }
        destination: { type: string, enum: [fresh, storage, gift, compost] }
        quality: { type: string }
        note: { type: string }
    GardenHarvestUpdate:
      type: object
      properties:
        harvested_on: { type: string, format: date }
        quantity: { type: number, minimum: 0 }
        unit: { $ref: "#/components/schemas/GardenHarvestUnit" }
        destination: { type: [string, "null"] }
        quality: { type: [string, "null"] }
        note: { type: [string, "null"] }
    GardenHarvestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenHarvest" }
        next_cursor: { type: [string, "null"] }
    GardenStorageStatus:
      type: string
      enum: [stored, consumed, spoiled]
    GardenStorageItem:
      type: object
      required: [id, product_name, method, quantity_initial, quantity_remaining, unit, stored_on, status]
      properties:
        id: { type: string }
        harvest_id: { type: [string, "null"] }
        planting_id: { type: [string, "null"] }
        product_name: { type: string, example: "okurky sterilované" }
        method: { $ref: "#/components/schemas/GardenStorageMethod" }
        location: { type: [string, "null"], description: "Free text — sklep, mrazák, spajz." }
        quantity_initial: { type: number, minimum: 0 }
        quantity_remaining: { type: number, minimum: 0, description: "Edited IN PLACE; the audit diff is the consumption history (PRD D121)." }
        unit: { $ref: "#/components/schemas/GardenHarvestUnit" }
        stored_on: { type: string, format: date }
        best_before: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/GardenStorageStatus" }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GardenStorageItemCreate:
      type: object
      required: [product_name, method, quantity_initial, unit, stored_on]
      properties:
        harvest_id: { type: string }
        planting_id: { type: string }
        product_name: { type: string, minLength: 1 }
        method: { $ref: "#/components/schemas/GardenStorageMethod" }
        location: { type: string }
        quantity_initial: { type: number, minimum: 0 }
        unit: { $ref: "#/components/schemas/GardenHarvestUnit" }
        stored_on: { type: string, format: date }
        best_before: { type: string, format: date }
        note: { type: string }
    GardenStorageItemUpdate:
      type: object
      description: >-
        `quantity_remaining` must stay between 0 and `quantity_initial` (422
        otherwise). Reaching 0 sets status=consumed automatically.
      properties:
        product_name: { type: string, minLength: 1 }
        method: { $ref: "#/components/schemas/GardenStorageMethod" }
        location: { type: [string, "null"] }
        quantity_remaining: { type: number, minimum: 0 }
        best_before: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/GardenStorageStatus" }
        note: { type: [string, "null"] }
    GardenStorageItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenStorageItem" }
        next_cursor: { type: [string, "null"] }
    GardenRuleScope:
      type: string
      enum: [plant_pair, family_pair, succession]
    GardenRule:
      type: object
      required: [id, scope, a_ref, b_ref, verdict, severity, is_builtin, is_disabled]
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/GardenRuleScope" }
        a_ref: { type: string, description: Plant id (plant_pair) or family enum (family_pair / succession). Stored in canonical sorted order for pairs. }
        b_ref: { type: string }
        a_label: { type: string }
        b_label: { type: string }
        verdict: { type: string, enum: [good, bad] }
        severity: { $ref: "#/components/schemas/GardenWarningSeverity" }
        min_years_gap: { type: [integer, "null"], description: Succession scope only. }
        reason_cs: { type: [string, "null"] }
        source: { type: [string, "null"], description: Where the claim comes from. Companion-planting lore contradicts itself between sources; this is how agronomy and folklore are told apart. }
        is_builtin: { type: boolean }
        is_disabled: { type: boolean }
    GardenRuleCreate:
      type: object
      required: [scope, a_ref, b_ref, verdict]
      properties:
        scope: { $ref: "#/components/schemas/GardenRuleScope" }
        a_ref: { type: string }
        b_ref: { type: string }
        verdict: { type: string, enum: [good, bad] }
        severity: { $ref: "#/components/schemas/GardenWarningSeverity" }
        min_years_gap: { type: integer, minimum: 0, maximum: 10 }
        reason_cs: { type: string }
        source: { type: string }
    GardenRuleUpdate:
      type: object
      description: >-
        On a BUILT-IN rule only `is_disabled` and `severity` are accepted; anything
        else is 422. Built-ins cannot be deleted at all (PRD D130).
      properties:
        verdict: { type: string, enum: [good, bad] }
        severity: { $ref: "#/components/schemas/GardenWarningSeverity" }
        min_years_gap: { type: [integer, "null"] }
        reason_cs: { type: [string, "null"] }
        source: { type: [string, "null"] }
        is_disabled: { type: boolean }
    GardenRulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenRule" }
        next_cursor: { type: [string, "null"] }
    GardenCheckConfig:
      type: object
      description: Per-check enable flag and severity override, keyed C1…C11.
      additionalProperties:
        type: object
        properties:
          enabled: { type: boolean }
          severity: { $ref: "#/components/schemas/GardenWarningSeverity" }
    GardenSettings:
      type: object
      required: [frost_threshold_c, frost_lookahead_days, rotation_break_default, workload_week_threshold]
      properties:
        default_last_frost: { type: [string, "null"], description: "MM-DD. Seeds a new season's expected frost dates." }
        default_first_frost: { type: [string, "null"], description: "MM-DD." }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        altitude_m: { type: [integer, "null"] }
        rotation_break_default: { type: integer, minimum: 0, maximum: 10, default: 4 }
        frost_threshold_c: { type: number, default: 2, description: Tonight's forecast minimum at or below this is a frost risk. }
        frost_lookahead_days: { type: integer, minimum: 1, maximum: 14, default: 3, description: Look-ahead for the autumn first-frost warning. }
        workload_week_threshold: { type: integer, minimum: 1, default: 10, description: Sow/transplant tasks in one ISO week above which C5 fires. }
        checks: { $ref: "#/components/schemas/GardenCheckConfig" }
        weather_enabled: { type: boolean, readOnly: true, description: Reflects HOME_GARDEN_WEATHER_ENABLED. Not settable here. }
        updated_at: { type: string, format: date-time }
    GardenSettingsUpdate:
      type: object
      description: Partial. There are no audience or notification settings here — that is Administrace's (PRD D113).
      properties:
        default_last_frost: { type: [string, "null"] }
        default_first_frost: { type: [string, "null"] }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        altitude_m: { type: [integer, "null"] }
        rotation_break_default: { type: integer }
        frost_threshold_c: { type: number }
        frost_lookahead_days: { type: integer }
        workload_week_threshold: { type: integer }
        checks: { $ref: "#/components/schemas/GardenCheckConfig" }
    GardenWeatherDay:
      type: object
      required: [day]
      properties:
        day: { type: string, format: date }
        temp_min: { type: [number, "null"] }
        temp_max: { type: [number, "null"] }
        precip_mm: { type: [number, "null"] }
        fetched_at: { type: [string, "null"], format: date-time }
        source: { type: [string, "null"] }
    GardenWeatherPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenWeatherDay" }
        stale: { type: boolean, description: True when the newest row is older than two poll intervals. The UI degrades quietly; it does not raise an error. }
    GardenEnumValue:
      type: object
      required: [value, label_cs]
      properties:
        value: { type: string }
        label_cs: { type: string }
        note_cs: { type: [string, "null"] }
    GardenEnums:
      type: object
      description: >-
        Served by the SAME registry that generates the importer's validator and the
        LLM prompt schema (PRD D114) — the frontend, the model and the validator
        cannot disagree about what a legal value is.
      additionalProperties:
        type: array
        items: { $ref: "#/components/schemas/GardenEnumValue" }
    GardenPromptTemplate:
      type: object
      required: [prompt, schema]
      properties:
        prompt: { type: string, description: "The complete Czech prompt, ready to paste into any model." }
        schema: { type: object, additionalProperties: true, description: "The JSON Schema the importer will validate the answer against — generated, not hand-written." }
        context:
          type: object
          description: What the prompt told the model about this garden.
          properties:
            last_frost_on: { type: [string, "null"] }
            first_frost_on: { type: [string, "null"] }
            latitude: { type: [number, "null"] }
            longitude: { type: [number, "null"] }
            altitude_m: { type: [integer, "null"] }
    GardenImportRequest:
      description: A single CROP object or an array of them; each element validates independently.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: { type: object, additionalProperties: true }
    GardenImportItemResult:
      type: object
      required: [index, action, ok]
      properties:
        index: { type: integer }
        action: { type: string, enum: [create, update, skip, reject], description: "`skip` is reserved and NEVER emitted as built — an element either creates, updates or is rejected. Keep handling it, but do not expect it." }
        ok: { type: boolean }
        target_id: { type: [string, "null"] }
        name: { type: [string, "null"] }
        diff:
          type: object
          description: Field-level before/after when the element updates an existing record.
          additionalProperties: true
        unmapped_fields:
          type: array
          description: Input fields the importer did not recognise. Reported, never silently dropped.
          items: { type: string }
        errors:
          type: array
          items: { type: string }
    GardenImportResult:
      type: object
      required: [dry_run, items, summary]
      properties:
        dry_run: { type: boolean, description: "When true, NOTHING was persisted." }
        items:
          type: array
          items: { $ref: "#/components/schemas/GardenImportItemResult" }
        summary:
          type: object
          properties:
            created: { type: integer }
            updated: { type: integer }
            rejected: { type: integer }
        source_model: { type: [string, "null"], description: Recorded on every applied row as provenance. }
    GardenExport:
      type: object
      description: >-
        A readable backup and a way to move the knowledge base between installs. Pairs
        in `rules` carry LABELS rather than ids, since an id from this database means
        nothing in the next.

        ⚠ A SUPERSET OF WHAT THE IMPORTER TAKES, so the PRD D126 round trip is NOT
        shipped: `plants` re-imports through /api/garden/plants/import, but `varieties`
        and `rules` are EXPORT-ONLY — that endpoint accepts a crop object or an array of
        crop objects and nothing else, and feeding it this document back rejects every
        element. Treat the file as a record of the knowledge base, not as a restore.
      required: [version, exported_at, plants, varieties, rules]
      properties:
        version: { type: string, example: "garden-kb/1" }
        exported_at: { type: string, format: date-time }
        plants:
          type: array
          items: { type: object, additionalProperties: true }
        varieties:
          type: array
          items: { type: object, additionalProperties: true }
        rules:
          type: array
          items: { type: object, additionalProperties: true }

    # ----- Elektřina (v8) -----
    # Units: `*_dkwh` = INTEGER tenths of kWh, `*_haler` = INTEGER haléře (PRD D148).
    ElectricityReading:
      type: object
      required: [id, read_on, vt_dkwh, nt_dkwh, created_at, updated_at]
      properties:
        id: { type: string, description: UUIDv7 }
        read_on:
          type: string
          format: date
          description: >-
            The date of the odečet. A reading is the meter state at 00:00 of this day
            (PRD D134). UNIQUE among live rows.
        vt_dkwh: { type: integer, minimum: 0, description: "Vysoký tarif register, in tenths of kWh. Karel's meter shows whole kWh, so the UI sends multiples of 10." }
        nt_dkwh: { type: integer, minimum: 0, description: "Nízký tarif register, in tenths of kWh." }
        note: { type: [string, "null"], description: "e.g. odečet kvůli změně ceny" }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ElectricityReadingCreate:
      type: object
      required: [read_on, vt_dkwh, nt_dkwh]
      properties:
        read_on: { type: string, format: date }
        vt_dkwh: { type: integer, minimum: 0 }
        nt_dkwh: { type: integer, minimum: 0 }
        note: { type: string }
    ElectricityReadingUpdate:
      type: object
      description: Partial update; omitted fields are left alone. Monotonicity is re-validated against both neighbours after the change.
      properties:
        read_on: { type: string, format: date }
        vt_dkwh: { type: integer, minimum: 0 }
        nt_dkwh: { type: integer, minimum: 0 }
        note: { type: [string, "null"] }
    ElectricityReadingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ElectricityReading" }
        next_cursor:
          type: [string, "null"]
          description: The last item's `read_on` (YYYY-MM-DD), to pass back as `cursor`. A date, not a UUIDv7 (PRD D149).

    ElectricityTariff:
      type: object
      required: [id, effective_from, price_vt_haler, price_nt_haler, monthly_fee_haler, created_at, updated_at]
      properties:
        id: { type: string, description: UUIDv7 }
        effective_from:
          type: string
          format: date
          description: >-
            This version governs every day from here until the next version starts.
            UNIQUE. The end is derived and never stored (PRD D136).
        price_vt_haler: { type: integer, minimum: 0, description: "Kč/MWh in haléře, INCLUDING DPH and distribuce (PRD D135). 4 858,65 Kč/MWh is 485865." }
        price_nt_haler: { type: integer, minimum: 0, description: "Kč/MWh in haléře, INCLUDING DPH and distribuce." }
        monthly_fee_haler: { type: integer, minimum: 0, description: "Měsíční poplatky in haléře, INCLUDING DPH. 642,35 Kč is 64235." }
        effective_to:
          type: [string, "null"]
          format: date
          description: >-
            DERIVED, read-only — the day before the next version's `effective_from`,
            or null for the current one. Present as a convenience for the UI; it is
            not a column and cannot be written.
        note: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ElectricityTariffCreate:
      type: object
      required: [effective_from, price_vt_haler, price_nt_haler, monthly_fee_haler]
      properties:
        effective_from: { type: string, format: date }
        price_vt_haler: { type: integer, minimum: 0 }
        price_nt_haler: { type: integer, minimum: 0 }
        monthly_fee_haler: { type: integer, minimum: 0 }
        note: { type: string }
    ElectricityTariffUpdate:
      type: object
      properties:
        effective_from: { type: string, format: date }
        price_vt_haler: { type: integer, minimum: 0 }
        price_nt_haler: { type: integer, minimum: 0 }
        monthly_fee_haler: { type: integer, minimum: 0 }
        note: { type: [string, "null"] }
    ElectricityTariffPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ElectricityTariff" }
        next_cursor:
          type: [string, "null"]
          description: The last item's `effective_from` (YYYY-MM-DD), to pass back as `cursor`.

    ElectricityAdvance:
      type: object
      required: [id, effective_from, amount_haler, due_day, created_at, updated_at]
      properties:
        id: { type: string, description: UUIDv7 }
        effective_from: { type: string, format: date, description: UNIQUE. Versioned exactly like the ceník. }
        amount_haler: { type: integer, minimum: 0, description: "Monthly záloha in haléře. 1 500 Kč is 150000." }
        due_day:
          type: integer
          minimum: 1
          maximum: 31
          description: >-
            Day of month the záloha is due. Clamped to the month's last day at read
            time, never stored clamped (PRD D155, the D74 precedent). Read in exactly
            one place — whether a counted month is already paid — so it moves the
            doporučená záloha and nothing else.
        note: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ElectricityAdvanceCreate:
      type: object
      required: [effective_from, amount_haler, due_day]
      properties:
        effective_from: { type: string, format: date }
        amount_haler: { type: integer, minimum: 0 }
        due_day: { type: integer, minimum: 1, maximum: 31 }
        note: { type: string }
    ElectricityAdvanceUpdate:
      type: object
      properties:
        effective_from: { type: string, format: date }
        amount_haler: { type: integer, minimum: 0 }
        due_day: { type: integer, minimum: 1, maximum: 31 }
        note: { type: [string, "null"] }
    ElectricityAdvancePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ElectricityAdvance" }
        next_cursor: { type: [string, "null"], description: The last item's `effective_from` (YYYY-MM-DD). }

    ElectricityPayment:
      type: object
      required: [id, month, amount_haler, created_at, updated_at]
      properties:
        id: { type: string, description: UUIDv7 }
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
          description: >-
            The month this payment is FOR, YYYY-MM. UNIQUE among live rows. This — not
            `paid_on` — is what attributes the payment, so a March záloha paid on 2.
            dubna still belongs to March.
        amount_haler: { type: integer, minimum: 0 }
        paid_on: { type: [string, "null"], format: date, description: Optional metadata; does not affect attribution. }
        note: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ElectricityPaymentCreate:
      type: object
      required: [month, amount_haler]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        amount_haler: { type: integer, minimum: 0 }
        paid_on: { type: string, format: date }
        note: { type: string }
    ElectricityPaymentUpdate:
      type: object
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        amount_haler: { type: integer, minimum: 0 }
        paid_on: { type: [string, "null"], format: date }
        note: { type: [string, "null"] }
    ElectricityPaymentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ElectricityPayment" }
        next_cursor: { type: [string, "null"], description: The last item's `month` (YYYY-MM). }

    ElectricityPeriod:
      type: object
      required: [id, starts_on, ends_on, ends_on_confirmed, created_at, updated_at]
      properties:
        id: { type: string, description: UUIDv7 }
        starts_on: { type: string, format: date, description: Inclusive. Requires a reading dated exactly here (PRD D140). }
        ends_on:
          type: string
          format: date
          description: >-
            Inclusive, the way a Czech supplier states it. The period's closing reading
            is dated `ends_on` PLUS ONE DAY — the same instant that opens the next
            period (PRD D134).
        ends_on_confirmed:
          type: boolean
          default: false
          description: >-
            False while `ends_on` is only expected (PRD D153). The UI badges it
            "předpokládaný konec" and the prediction always names the date it projected
            to. Correcting it later is one field.
        invoiced_total_haler: { type: [integer, "null"], description: Total cost the supplier billed for the period (PRD D154). }
        invoiced_balance_haler:
          type: [integer, "null"]
          description: >-
            The supplier's nedoplatek (negative) or přeplatek (positive). Same sign
            convention as the computed `balance_haler`.
        invoiced_vt_dkwh: { type: [integer, "null"], description: The VT meter value the supplier billed to. }
        invoiced_nt_dkwh: { type: [integer, "null"], description: The NT meter value the supplier billed to. }
        invoiced_at: { type: [string, "null"], format: date }
        note: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ElectricityPeriodCreate:
      type: object
      required: [starts_on]
      properties:
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, description: "Defaults to starts_on plus one year minus one day, with ends_on_confirmed false." }
        ends_on_confirmed: { type: boolean, default: false }
        invoiced_total_haler: { type: [integer, "null"] }
        invoiced_balance_haler: { type: [integer, "null"] }
        invoiced_vt_dkwh:
          type: [integer, "null"]
          minimum: 0
          description: >-
            ⚠ The minimum is enforced ONLY by the table CHECK, not by the service, so a
            negative value surfaces as a 500 rather than the 422 every sibling amount
            returns. A known defect, recorded here rather than fixed.
        invoiced_nt_dkwh:
          type: [integer, "null"]
          minimum: 0
          description: >-
            ⚠ Same as `invoiced_vt_dkwh`: a negative value is a 500, not a 422. Known
            defect, recorded not fixed.
        invoiced_at: { type: [string, "null"], format: date }
        note: { type: string }
    ElectricityPeriodUpdate:
      type: object
      properties:
        starts_on: { type: string, format: date }
        ends_on:
          type: [string, "null"]
          format: date
          description: Explicit null re-applies the starts_on + 1 year − 1 day default (PRD D153).
        ends_on_confirmed: { type: boolean }
        invoiced_total_haler: { type: [integer, "null"] }
        invoiced_balance_haler: { type: [integer, "null"] }
        invoiced_vt_dkwh:
          type: [integer, "null"]
          minimum: 0
          description: >-
            ⚠ The minimum is enforced ONLY by the table CHECK, not by the service, so a
            negative value surfaces as a 500 rather than the 422 every sibling amount
            returns. A known defect, recorded here rather than fixed.
        invoiced_nt_dkwh:
          type: [integer, "null"]
          minimum: 0
          description: >-
            ⚠ Same as `invoiced_vt_dkwh`: a negative value is a 500, not a 422. Known
            defect, recorded not fixed.
        invoiced_at: { type: [string, "null"], format: date }
        note: { type: [string, "null"] }
    ElectricityPeriodPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ElectricityPeriod" }
        next_cursor: { type: [string, "null"], description: The last item's `starts_on` (YYYY-MM-DD). }

    ElectricityBlocking:
      type: object
      description: >-
        A reading the module requires before it will price anything past a given date.
        Money is never interpolated (PRD D137).
      required: [kind, required_reading_on, message_cs]
      properties:
        kind:
          type: string
          enum: [period_start, tariff_change]
          description: >-
            `period_start` — no reading on the period's first day, so there is no
            baseline and the period shows nothing (PRD D140). `tariff_change` — a ceník
            change falls strictly inside a reading interval, so everything from that
            date on is unpriceable while everything before it stays valid.
        required_reading_on: { type: string, format: date }
        message_cs: { type: string, examples: ["Chybí odečet k 1. 1. 2027 (změna ceny)."] }
    ElectricityMoney:
      type: object
      description: >-
        A cost split by tariff. VT is rounded and NT takes the REMAINDER (PRD D158), so
        `vt_haler` plus `nt_haler` always equals `total_haler` exactly — the `needs`
        pattern from the fin split, where one component absorbs the rounding error by
        subtraction rather than by luck.
      required: [vt_haler, nt_haler, total_haler]
      properties:
        vt_haler: { type: integer }
        nt_haler: { type: integer, description: total_haler minus vt_haler }
        total_haler: { type: integer }
    ElectricitySpan:
      type: object
      description: One side of the actual/forecast boundary, which is the LAST READING and not today (PRD D141).
      required: [from_on, to_on, days, vt_dkwh, nt_dkwh, energy, fees_haler, total_haler]
      properties:
        from_on: { type: string, format: date }
        to_on: { type: string, format: date }
        days: { type: integer, minimum: 0 }
        vt_dkwh: { type: integer, description: "Measured on the actual side, projected on the forecast side." }
        nt_dkwh: { type: integer }
        energy: { $ref: "#/components/schemas/ElectricityMoney" }
        fees_haler: { type: integer, description: Sum of the (calendar month × ceník version) chunks in this span (PRD D143). }
        total_haler: { type: integer, description: energy.total_haler + fees_haler }
        avg_vt_dkwh_per_day: { type: [number, "null"], description: Forecast span only — the plain average since the period start (PRD D141). }
        avg_nt_dkwh_per_day: { type: [number, "null"] }
    ElectricityCountedMonth:
      type: object
      description: >-
        A calendar month counts toward the period iff the period contains that month's
        FIRST DAY (PRD D145) — which makes a year-long period exactly 12 months
        whatever day it starts on.
      required: [month, amount_haler, source, due_on, is_due]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        amount_haler: { type: integer }
        source:
          type: string
          enum: [payment, schedule, none]
          description: >-
            `payment` — a recorded row, which wins (PRD D144). `schedule` — the version
            effective on the month's first day. `none` — neither exists; contributes 0
            and is flagged in the UI.
        due_on: { type: string, format: date, description: The schedule's due_day clamped into this month (PRD D155). }
        is_due: { type: boolean, description: "True once due_on has arrived — INCLUSIVE: due on the 15th means paid on the 15th." }
        due_clamped: { type: boolean, description: "True when the schedule's due_day exceeded this month's length and was clamped into it (PRD D155) — a due_day of 31 in February. The raw day stays stored; only this month's due_on moved." }
        paid_on: { type: [string, "null"], format: date, description: "The recorded payment's paid_on, when `source` is `payment` and a date was entered. Metadata only — attribution is by the month key, never by this (PRD D144)." }
    ElectricityAdvancesSummary:
      type: object
      required: [counted_months, expected_total_haler, due_so_far_haler, months_counted, months_due]
      properties:
        counted_months:
          type: array
          items: { $ref: "#/components/schemas/ElectricityCountedMonth" }
        expected_total_haler: { type: integer, description: Sum over every counted month. }
        due_so_far_haler: { type: integer, description: Sum over the counted months whose due day has arrived. }
        months_counted: { type: integer }
        months_due: { type: integer }
    ElectricityHeadroom:
      type: object
      description: >-
        What the current záloha actually buys, computable with ZERO consumption data —
        which is why it is what Přehled shows while the prediction is still impossible.
        With a 1 500 Kč záloha and 642,35 Kč of poplatky, 857,65 Kč/měsíc is left for
        energy: about 176 kWh if it were all VT, 213 kWh if all NT, and roughly 200 kWh
        at a 30/70 mix.
      required:
        [advance_haler, monthly_fee_haler, energy_budget_haler, kwh_all_vt_dkwh,
         kwh_all_nt_dkwh, kwh_mix_dkwh]
      properties:
        advance_haler: { type: integer }
        monthly_fee_haler: { type: integer }
        energy_budget_haler: { type: integer, description: "advance_haler minus monthly_fee_haler, floored at 0." }
        kwh_all_vt_dkwh: { type: integer, description: Tenths of kWh the budget buys at the VT price. }
        kwh_all_nt_dkwh: { type: integer, description: Tenths of kWh the budget buys at the NT price. }
        kwh_mix_dkwh:
          type: integer
          description: >-
            Tenths of kWh the budget buys at a 30 % VT / 70 % NT mix — the figure
            Přehled leads with, since neither all-VT nor all-NT is a household. The mix
            is a STATED HEURISTIC, never a measurement, and the Czech copy names it as
            one. Computed with ONE division and no intermediate rounding —
            `divRound(energy_budget_haler · 100000, 3·price_vt_haler + 7·price_nt_haler)`
            — because rounding a blended price first moves the answer by a whole kWh.
            It is served rather than derived on the client: the summary carries no
            prices, so a client would have to reconstruct them from the two kWh figures
            above and would land on a different number than the server's tests pin.
    ElectricitySummary:
      type: object
      description: >-
        Computed on read, never stored (PRD D152). `status` decides which of the
        optional blocks are present.

        `cost_total_haler` and `balance_haler` are NULLABLE and are absent — never 0 —
        in the two states where the module has not earned them. "The module never shows
        a number it hasn't earned, not a zero" is therefore carried by the type, rather
        than by every screen remembering to gate on `status` first.
      required:
        [period, status, blocking, last_reading_on, days_since_last_reading, forecast,
         cost_total_haler, energy_total_haler, fee_total_haler, advances, balance_haler,
         recommended_advance_kc, recommended_advance_haler, invoice_comparison]
      properties:
        period: { $ref: "#/components/schemas/ElectricityPeriod" }
        status:
          type: string
          enum: [ok, complete, blocked, insufficient_data]
          description: >-
            `ok` — actual plus forecast. `complete` — the closing reading dated
            `ends_on` + 1 exists, so the forecast is empty and the period is entirely
            actual (PRD D157); this is the state in which the computed-vs-invoiced
            comparison becomes meaningful. `blocked` — at least one required reading is
            missing; figures before the earliest gap are still valid. `insufficient_data`
            — fewer than two readings, or no ceník effective on or before the period
            start; Přehled says "zatím nelze předpovědět" and shows `headroom` instead.
        reason:
          type: string
          enum:
            [no_tariff, need_second_reading, second_reading_same_day,
             missing_opening_reading, tariff_change_inside_interval]
          description: >-
            Names WHAT IS MISSING when the module cannot predict, so the screen never
            says "zatím nelze předpovědět" without saying why — an unexplained refusal
            is indistinguishable from a bug.

            OPTIONAL: the key is ABSENT when there is nothing to name, never null and
            never an empty string. Set only alongside `insufficient_data` and `blocked`.
            Note the deliberate asymmetry with `blocking`: `no_tariff` is missing
            CONFIGURATION rather than a missing reading, so it carries a reason and no
            `blocking` entry at all.
        blocking:
          type: array
          items: { $ref: "#/components/schemas/ElectricityBlocking" }
          description: Empty when nothing is missing.
        last_reading_on: { type: [string, "null"], format: date }
        days_since_last_reading:
          type: [integer, "null"]
          description: >-
            Drives the plain in-app line "poslední odečet před N dny" (PRD D156). Not a
            notification — this module publishes no metric, no list and no push.
        actual: { $ref: "#/components/schemas/ElectricitySpan" }
        forecast:
          oneOf:
            - $ref: "#/components/schemas/ElectricitySpan"
            - type: "null"
          description: >-
            NULL when `status` is `blocked` or `insufficient_data` — there is no average
            to project from.

            NOT null when `status` is `complete`: the closing reading dated `ends_on` + 1
            exists, so the forecast span is present but ALL-ZERO — `from_on` equals
            `to_on` (both `ends_on` + 1), `days` is 0, and every kWh and haléř figure,
            the two averages included, is 0. Read "is there anything still to forecast"
            off `days`, never off the presence of this object.
        cost_total_haler:
          type: [integer, "null"]
          description: >-
            actual.total_haler plus forecast.total_haler. NULL when `status` is
            `insufficient_data` (there is no average to forecast from) or `blocked` (an
            unresolved gap, PRD D137/D140) — the figures BEFORE the gap stay valid in
            `actual`, but no period total exists. Never 0 in those states: a 0 Kč
            nedoplatek is a lie that looks like good news.
        energy_total_haler:
          type: [integer, "null"]
          description: >-
            The energy half of `cost_total_haler` — actual plus forecast, no poplatky.
            NULL in exactly the same states as `cost_total_haler`, and never 0 in them:
            the three totals are filled together or not at all, so one can never be a
            number while another is absent.
        fee_total_haler:
          type: [integer, "null"]
          description: >-
            The poplatky half — the (calendar month × ceník version) chunks over the
            whole period (PRD D143), so `energy_total_haler` plus `fee_total_haler`
            equals `cost_total_haler` exactly. NULL in exactly the same states as
            `cost_total_haler`.
        advances: { $ref: "#/components/schemas/ElectricityAdvancesSummary" }
        balance_haler:
          type: [integer, "null"]
          description: >-
            expected zálohy minus cost_total_haler. POSITIVE is a přeplatek, NEGATIVE a
            nedoplatek (PRD D146). NULL exactly when `cost_total_haler` is null — the
            zálohy are always known, but a balance against an unknown cost is not.
        recommended_advance_kc:
          type: [integer, "null"]
          description: >-
            The doporučená záloha in WHOLE KORUNY, and the original from which
            `recommended_advance_haler` is derived by ×100. The rounding up to koruny
            happens here, in one ceil-division straight from haléře, because dividing to
            haléře and rounding afterwards moves the answer by a koruna. Null exactly
            when `recommended_advance_haler` is.
        recommended_advance_haler:
          type: [integer, "null"]
          description: >-
            (cost_total_haler minus the zálohy already due) divided by the months not
            yet due, rounded UP to whole koruny, floored at 0. Null when no month
            remains. Derived as `recommended_advance_kc` × 100 and therefore always a
            whole hundred — served in haléře only so it matches every other `*_haler`
            field on this response.
        headroom: { $ref: "#/components/schemas/ElectricityHeadroom" }
        invoice_comparison:
          oneOf:
            - $ref: "#/components/schemas/ElectricityInvoiceComparison"
            - type: "null"
          description: Present only once the period carries a recorded vyúčtování.
    ElectricityInvoiceComparison:
      type: object
      description: Computed against invoiced (PRD D154). Storing the supplier's final readings is what lets a difference be attributed to kWh rather than only to Kč.
      required: [computed_is_forecast, computed_total_haler, invoiced_total_haler, diff_haler]
      properties:
        computed_is_forecast:
          type: boolean
          description: >-
            True while `status` is anything but `complete` — the vyúčtování has arrived
            but the closing odečet dated ends_on+1 has not, so the computed side is
            still part prediction and the two sides are not measuring the same thing.
            This is the ORDINARY sequence: the invoice comes in the post before anyone
            walks to the meter cupboard. The UI hedges the whole panel on this flag,
            because printing a forecast as "spočteno" would attribute the module's own
            projection error to an odhadnutý odečet on the supplier's side.
        computed_total_haler: { type: integer }
        invoiced_total_haler: { type: integer }
        diff_haler: { type: integer, description: computed minus invoiced. }
        computed_vt_dkwh: { type: [integer, "null"] }
        computed_nt_dkwh: { type: [integer, "null"] }
        invoiced_vt_dkwh: { type: [integer, "null"] }
        invoiced_nt_dkwh: { type: [integer, "null"] }
        diff_vt_dkwh: { type: [integer, "null"] }
        diff_nt_dkwh: { type: [integer, "null"] }
    ElectricityInterval:
      type: object
      description: >-
        One consecutive pair of readings. `energy` is ENERGY ONLY — poplatky are
        chunked by (month × ceník version) and belong to no interval (PRD D143).
      required: [from_on, to_on, days, blocked]
      properties:
        from_on: { type: string, format: date }
        to_on: { type: string, format: date }
        days: { type: integer, minimum: 1 }
        vt_dkwh: { type: [integer, "null"] }
        nt_dkwh: { type: [integer, "null"] }
        energy:
          oneOf:
            - $ref: "#/components/schemas/ElectricityMoney"
            - type: "null"
          description: Null when `blocked`.
        tariff_id: { type: [string, "null"] }
        tariff_effective_from: { type: [string, "null"], format: date }
        blocked: { type: boolean, description: True when a ceník change falls strictly inside this interval (PRD D137). }
        blocking_date: { type: [string, "null"], format: date, description: The reading date the interval needs before it can be priced. }
    ElectricityIntervalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ElectricityInterval" }
    ElectricityHistoryMonth:
      type: object
      required: [month, vt_dkwh, nt_dkwh, energy_haler, fees_haler, total_haler, is_approximate]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        vt_dkwh: { type: integer, description: Interval consumption spread evenly across its days (PRD D138) — approximate by construction. }
        nt_dkwh: { type: integer }
        energy_haler: { type: integer, description: "An ALLOCATION of exact interval costs by day count, not a repricing of the approximate kWh (PRD D159)." }
        fees_haler: { type: integer, description: Already per month; no allocation needed. }
        total_haler: { type: integer }
        is_approximate:
          type: boolean
          description: >-
            True whenever any interval contributing to this month spans a month
            boundary. False only when readings happen to fall on the boundaries, in
            which case the month is exact and the UI can drop the caveat.
    ElectricityHistory:
      type: object
      required: [months]
      properties:
        months:
          type: array
          items: { $ref: "#/components/schemas/ElectricityHistoryMonth" }

    # ---------------- v9: publish, storage, private items ----------------
    PublishRequest:
      type: object
      description: >-
        Destination for a publish (v9, PRD D182). Both fields are optional: an empty body
        publishes to the shared ROOT, which is the common case — a member publishing
        something usually wants it visible, not filed.
      properties:
        folder_id:
          type: [string, "null"]
          description: >-
            Target folder in the SHARED tree; omit or null for the shared root. A folder in
            any private tree is a 422 — publishing crosses scopes, and this parameter names
            a destination, not a second scope.
        position: { type: string, description: Lexorank order key among the target siblings; server-assigned when omitted. }

    StorageSnapshot:
      type: object
      required: [generated_at, cached, database, blobs, warning]
      description: >-
        Everything the Úložiště page renders, computed on read (PRD D195). ⚠ EVERY byte
        figure in this tree is NULLABLE, and null — never 0 — when it could not be
        measured. That is the D161 principle generalised: a `0 B` table on a page whose
        whole job is reporting bytes is a lie that looks like good news.
      properties:
        generated_at: { type: string, format: date-time, description: When this snapshot was computed — NOT when it was requested. }
        cached: { type: boolean, description: True when served from the in-process cache rather than recomputed. A stale figure must be visibly stale. }
        cache_seconds: { type: integer, description: "The TTL in effect (HOME_STORAGE_CACHE_SECONDS; 0 = caching disabled)." }
        database: { $ref: "#/components/schemas/StorageDatabase" }
        blobs: { $ref: "#/components/schemas/StorageBlobs" }
        replica: { $ref: "#/components/schemas/StorageReplica" }
        backup: { $ref: "#/components/schemas/StorageBackup" }
        warning: { $ref: "#/components/schemas/StorageWarning" }
        chat: { $ref: "#/components/schemas/StorageChat" }
    StorageDatabase:
      type: object
      required: [total_bytes, wal_bytes, bytes_available, modules]
      properties:
        total_bytes: { type: integer, description: "EXACT: page_count × page_size. The only figure here checkable against `ls`." }
        wal_bytes: { type: integer, description: "The write-ahead log's size on disk, reported separately because it fluctuates and is not lost space." }
        free_bytes: { type: [integer, "null"], description: "freelist_count × page_size — pages the file holds but is not using; what a VACUUM would reclaim." }
        bytes_available:
          type: boolean
          description: >-
            Whether PER-TABLE bytes could be measured at all — i.e. whether the SQLite build
            exposes the `dbstat` virtual table (`SQLITE_ENABLE_DBSTAT_VTAB`). PROBED AT
            BOOT, never assumed. When false, every table's `bytes` is null and only
            `row_count` is populated; `total_bytes` above stays exact either way (PRD D193).
        modules:
          type: array
          items: { $ref: "#/components/schemas/StorageModuleDb" }
    StorageModuleDb:
      type: object
      required: [module, tables]
      properties:
        module: { type: string, description: "The declaring module, from the storage catalog. `platform` covers the tables no feature module owns." }
        bytes: { type: [integer, "null"], description: Sum of this module's tables; null when dbstat is unavailable. }
        tables:
          type: array
          items: { $ref: "#/components/schemas/StorageTable" }
    StorageTable:
      type: object
      required: [name, row_count, virtual]
      properties:
        name: { type: string }
        row_count: { type: integer, description: "Always populated — a COUNT(*) needs no dbstat — EXCEPT on a `virtual` row, where it is 0 and meaningless." }
        virtual:
          type: boolean
          description: >-
            A VIRTUAL table — Home's four external-content FTS5 indexes. It owns no b-tree,
            so `bytes` and `index_bytes` are a MEASURED ZERO (the four shadow tables listed
            beside it carry every page) rather than the null they would otherwise be, and
            `row_count` is 0 and not counted: counting one is a full traversal of the index
            for a figure the content table already states. Clients should render it as a
            virtual row, never as an empty or an unmeasured one.
        bytes: { type: [integer, "null"], description: Real page usage for this b-tree; null when dbstat is unavailable. NEVER an estimate. }
        index_bytes: { type: [integer, "null"], description: "Pages used by this table's indexes, reported apart from the rows because an FTS5 index can outweigh what it indexes." }
    StorageBlobs:
      type: object
      required: [available, modules]
      description: Object storage (Cloudflare R2), from listing the bucket and joining back to SQLite for attribution (PRD D194).
      properties:
        available:
          type: boolean
          description: >-
            False when object storage could not be reached. The endpoint still returns 200
            with the database figures intact — a bucket outage must not blank the page
            (PRD FR-V9-11).
        error: { type: [string, "null"], description: "Why the bucket could not be read, when `available` is false." }
        bucket: { type: [string, "null"] }
        total_bytes: { type: [integer, "null"] }
        total_objects: { type: [integer, "null"] }
        modules:
          type: array
          items: { $ref: "#/components/schemas/StorageModuleBlobs"}
    StorageModuleBlobs:
      type: object
      required: [module, prefix, owners]
      properties:
        module: { type: string, enum: [notes, documents], description: The only two modules that hold bytes. Every other module declares tables and no blobs. }
        prefix: { type: string, description: "The bucket prefix this module owns, e.g. `documents/` or `note-images/`." }
        bytes: { type: [integer, "null"] }
        objects: { type: [integer, "null"] }
        owners:
          type: array
          description: >-
            One row per bucket of usage: the household's shared content, then each member's
            private content, then whatever resolved to no live row.
          items: { $ref: "#/components/schemas/StorageOwnerUsage" }
    StorageOwnerUsage:
      type: object
      required: [kind, bytes, objects]
      properties:
        kind:
          type: string
          enum: [shared, private, unattributed]
          description: >-
            `shared` = the household tree · `private` = one member's own tree ·
            `unattributed` = objects in the prefix that resolve to NO live row. The third is
            not an error state and not padding: it is the orphan backlog the mirror job
            reconciles, and this is the first screen in Home that has ever shown it (D194).
        owner_user_id: { type: [string, "null"], description: Set only when `kind` is `private`. }
        owner_label: { type: [string, "null"], description: "Display name from the member directory, for the same rows." }
        bytes: { type: integer }
        objects: { type: integer }
        module:
          type: string
          description: >-
            Present only on `warning.largest_contributors` rows, where every module's usage
            is flattened into one list and two same-kind rows would otherwise be
            indistinguishable. Inside a module's `owners` block the parent already names
            the module, so it is omitted there.
    StorageReplica:
      type: object
      required: [configured]
      description: >-
        ⚠ AS BUILT, `configured` IS ALWAYS FALSE AND EVERY OTHER FIELD IS NULL. D214
        specified this line, and it was DECLINED (settled with Karel 2026-08-24, recorded in
        `PRD.md` §V9-12): reading the replica requires the application process to hold the
        credentials for the household's entire database backup, which introduces no new
        secret but meaningfully widens what this binary can reach.

        The cost is precise and small: the app cannot report replica size, and cannot answer
        *"is replication actually running?"* from inside itself — that returns to being an
        ops question (`litestream snapshots` on the droplet). Nothing else on the page is
        affected: the database figures come from PRAGMA/dbstat, the per-module R2 figures
        use the DOCS bucket the app already holds, the backup mirror line (D205) likewise,
        the warning threshold measures the per-module total only, and D214 had already
        excluded the replica from the per-module sums — so no total changes.

        The schema is kept so the shape is stable and the SPA has a designed state to render
        (`HANDOFF-design.md` §v9 lists "no backup bucket and no replica configured").

        The original specification follows.

        The Litestream replica of the SQLite database under the `home/` R2 prefix (v9,
        PRD D214). ⚠ It is NOT per module and never will be — it replicates the whole
        file — so it is a TOTAL beside the per-module breakdown, not part of it. It is
        here because it is R2 space the household is billed for and no screen has ever
        shown it; its size is also the honest counterweight to the database figure above,
        which reports one generation while the replica holds many.
      properties:
        configured: { type: boolean, description: False when Litestream is not replicating — then nothing else here is populated. }
        prefix: { type: [string, "null"], description: "The R2 prefix, `home/` in production." }
        bytes: { type: [integer, "null"], description: "Total across every generation and snapshot under the prefix, which is why it can exceed the live database file several times over." }
        objects: { type: [integer, "null"] }
        generations: { type: [integer, "null"], description: "How many Litestream generations are present. More than one usually means a restore or a restart, not a fault." }
        newest_at: { type: [string, "null"], format: date-time, description: "Timestamp of the newest object under the prefix — the practical answer to: is replication actually running?" }
    StorageBackup:
      type: object
      required: [configured]
      description: >-
        The mirror bucket, as ONE line (PRD D205). It is half the R2 bill and no screen has
        ever shown it.
      properties:
        configured: { type: boolean, description: False when HOME_DOCS_R2_BACKUP_BUCKET is unset — then nothing else here is populated. }
        bucket: { type: [string, "null"] }
        bytes: { type: [integer, "null"] }
        objects: { type: [integer, "null"] }
    StorageWarning:
      type: object
      required: [threshold_mb, measured_bytes, exceeded]
      description: >-
        One threshold on total PRIMARY-bucket bytes (PRD D196). ⚠ Nothing is ever blocked by
        it: no upload fails, there is no per-user quota and no new 413. It exists so an R2
        bill is a decision rather than a surprise.
      properties:
        threshold_mb: { type: integer, description: "HOME_STORAGE_WARN_TOTAL_MB. Default 1024 (1 GB) — a CHANGE detector, not a bill detector: household usage is expected to sit well under a gigabyte, so a threshold at R2's 10 GB billing cliff would stay silent for years. At 1 GB it fires when something has changed, with nine-tenths of the free allowance still in hand. 0 disables the warning. Nothing is ever blocked either way." }
        measured_bytes: { type: [integer, "null"] }
        exceeded: { type: boolean }
        largest_contributors:
          type: array
          description: The rows to mark on screen when `exceeded` — module + owner bucket, largest first. Sizes only, as everywhere on this page.
          items: { $ref: "#/components/schemas/StorageOwnerUsage" }

    PrivateItem:
      type: object
      required: [id, module, kind, owner_user_id, byte_size, created_at]
      description: >-
        One private item as the purge screen sees it (PRD D198). ⚠ THE FIELDS THAT ARE
        ABSENT ARE THE SPECIFICATION: no title, no filename, no description, no content
        type, no preview, no download URL. An admin can name the thing well enough to
        delete it and not well enough to know what it is. Anything added here has to be
        justified against that sentence.
      properties:
        id: { type: string, description: "The owning module's id — what the module's hard-delete route takes, except for `note_image`, which has none." }
        module: { type: string, enum: [notes, documents] }
        kind:
          type: string
          enum: [note, document, note_folder, document_folder, note_image]
          description: >-
            FOLDERS ARE LISTED (PRD D212):
            `DELETE /api/{notes,documents}/folders/{id}?hard=true&cascade=true` is what
            actually reclaims a private subtree, and a screen that cannot name a folder
            cannot do the job it exists for.

            `note_image` rows are listed for accounting and are NOT deletable — there is no
            delete route for an image and there should not be, since an image belongs to its
            note and goes when the note does (D204, D212). The screen says so rather than
            offering a control that 405s.
        owner_user_id: { type: string }
        owner_label: { type: [string, "null"], description: Display name from the member directory. }
        byte_size: { type: integer, description: "For a note, the Markdown body's length; for a document or image, the object's size." }
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
    PrivateItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: ALWAYS an array, never null (D174).
          items: { $ref: "#/components/schemas/PrivateItem" }
        next_cursor: { type: [string, "null"] }
        total_bytes: { type: [integer, "null"], description: "Sum across ALL matching items, not only this page — the figure the screen exists to act on." }

    Conversation:
      type: object
      # ⚠ `reads_from_beginning` IS REQUIRED, and that is load-bearing rather than
      # tidiness (v10 review). Typed optional, a generated client falls back to the
      # `effective_from` vs `created_at` comparison this field exists to replace —
      # which the field's own description below calls a second spelling of one
      # access rule, and one that disagrees. The server always sends it, so the
      # schema says so and the wrong path stops being the ergonomic one.
      # `over_conversation_limit` is required and NULLABLE for the same reason
      # `bytes` is: null is its answer until PR 3 measures, not its absence.
      # `last_message` is required and NULLABLE for the reason `bytes` is: null is its
      # ANSWER — a room nobody has written in, or a member whose floor sits above
      # everything written so far — and not its absence.
      required: [id, kind, name, created_at, updated_at, member_count, unread_count, bytes, muted, effective_from, reads_from_beginning, over_conversation_limit, last_message]
      description: >-
        A room. ⚠ It is addressed by its UUIDv7 `id` and has NO SLUG (PRD D220) — the house
        `freeSlug` pattern appends `-2` on a sibling collision, which here would disclose a
        conversation the caller may not see.

        `unread_count`, `muted` and `effective_from` are THE CALLER'S: this schema is never
        rendered for anybody else, and there is no route that would.
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [default, group]
          description: >-
            `default` is **Všichni**, the household room — exactly one exists, created by the
            migration, everyone auto-joined at first sight. It is renameable and refuses
            delete and leave with 422 (D219).
        name: { type: string, maxLength: 80 }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: Non-null ⇔ in the koš. Present only under `?state=trash` (D253).
        purge_after:
          type: [string, "null"]
          format: date-time
          description: When the drain will destroy this conversation's bytes. Null unless trashed.
        member_count: { type: integer }
        unread_count:
          type: integer
          description: >-
            The CALLER'S unread: messages with `id > effective_from_id AND id >
            last_read_id`, not their own, not tombstones (D250). ⚠ Ids, never timestamps —
            a `created_at` comparison loses a message minted in the same millisecond as the
            bound. A member added yesterday never opens a conversation to a four-figure
            badge.
        muted: { type: boolean, description: The caller's own per-conversation push mute (D248). }
        effective_from:
          type: string
          format: date-time
          description: >-
            ⚠ **The caller's read floor** — the instant from which this conversation is
            theirs to read (PRD D218). NOT "when they joined": for **Všichni** it is the
            conversation's own `created_at`, so a member the app sees for the first time in
            2028 reads the household room in full (D258). For a group it is the moment they
            were added.

            The exemption is a VALUE, not a branch: no read path anywhere in the module
            tests `kind == "default"` to decide what history to show, and a test asserts it.
        reads_from_beginning:
          type: boolean
          description: >-
            True when the caller's floor IS the conversation's beginning — `effective_from_id`
            is the empty string — so nothing is being withheld from them.

            ⚠ **Read this rather than comparing `effective_from` to `created_at`.** The
            server's floor is an ID BOUND and deriving it back from a clock is a second
            spelling of one access rule (see `chat/floor.go`); the two disagree, because
            adding somebody to a room that has no messages yet writes `effective_from = now`
            with an empty bound — history was never withheld, and a timestamp comparison
            claims it was. The bound itself stays off the wire: it names a message the
            caller may not read, so the ANSWER travels and not the bound.
        bytes:
          type: [integer, "null"]
          description: Live attachment bytes in this conversation. Null when it could not be measured — never 0 (the D161 principle).
        over_conversation_limit:
          type: [boolean, "null"]
          description: >-
            `bytes` exceeds the `chat.conversation` threshold. Computed for the caller rather
            than left to be inferred (D237). ⚠ **Null whenever `bytes` is null** — it is a
            verdict ABOUT `bytes` and cannot be more certain than the figure it judges, the
            same D161 principle one field up. PR 3 is what makes it a boolean.
        last_message:
          oneOf:
            - $ref: "#/components/schemas/ConversationPreview"
            - type: "null"
          description: >-
            The row's preview line: the newest message THE CALLER may read (v10.1, D266).

            ⚠ **Null is not "empty room".** It is also a member whose floor sits above every
            message written so far, which is an ordinary state of a group somebody was added
            to five minutes ago. Both render as an absence; neither renders the room's own
            newest message.

    ConversationPreview:
      type: object
      required: [id, author_id, author_label, excerpt, created_at, deleted, attachment_count]
      description: >-
        ⚠ **A SECOND READ OF A MESSAGE, THROUGH THE SAME FLOOR** — the shape
        `ChatMessageQuote` warns about, one screen over. `MAX(id)` over a conversation is the
        newest message the ROOM has, which for a member added yesterday is a body they may not
        read, printed on the row they see before they open anything. That is a worse
        disclosure than the thread's would be, because nobody has to click.

        ⚠ **A tombstone is still the last message and is NOT skipped.** The delete blanks the
        body in place (D223) and this reads the same column the thread does, so the preview
        says *Zpráva byla smazána* exactly as the bubble does. Reaching past it to the newest
        surviving message would print a line the room no longer ends with.
      properties:
        id: { type: string }
        author_id: { type: string }
        author_label: { type: string }
        excerpt:
          type: string
          description: >-
            First line, truncated. **Empty on a tombstone and on a files-only message** — the
            client renders the Czech for each from the two flags below rather than from a
            sentence the server wrote, because every other Czech string in the app lives in
            `i18n/cs.ts` and a preview line is not the place to start a second copy deck.
        created_at: { type: string, format: date-time }
        deleted: { type: boolean }
        attachment_count: { type: integer }

    ConversationPage:
      type: object
      required: [items, trashed_count]
      properties:
        items:
          type: array
          description: ALWAYS an array, never null (D174).
          items: { $ref: "#/components/schemas/Conversation" }
        next_cursor: { type: [string, "null"] }
        trashed_count:
          type: integer
          description: >-
            How many conversations the CALLER has in the koš — a fact about the koš rather
            than about this page, and answered the same on both listings (v10.1, D267).

            ⚠ **It rides here so the sidebar can hide an empty koš without a second request.**
            The section's ROWS are still fetched only when it is opened, which is the whole
            reason `?state=trash` is lazy; this answers "is there anything to open" for the
            price of an indexed count on a request the pane already makes.

            ⚠ **It is member-scoped like every other read in the module**, admins included:
            D255 gives an admin restore and purge over a room they may not read, and this is
            a read. A count over the table would be a scalar answering how many conversations
            exist.

    ConversationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        member_ids:
          type: array
          description: >-
            Added with `effective_from = now`, like every group add — nobody joins a new
            conversation with history behind them. The creator is always a member and need
            not be listed. Ids must be known to the directory (D230).
          items: { type: string }

    ConversationUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }

    ConversationMember:
      type: object
      # `reads_from_beginning` is required here for the reason it is on
      # Conversation: the panel is told the answer so it never re-derives the floor
      # from two timestamps that disagree with it.
      required: [user_id, display_name, effective_from, reads_from_beginning]
      description: >-
        ⚠ **Display name only.** `push.Member` also carries `email` and `roles`; neither is
        serialised anywhere in `chat` (PRD D230).
      properties:
        user_id: { type: string }
        display_name: { type: string }
        effective_from:
          type: string
          format: date-time
          description: >-
            This member's read floor. Shown in the members panel so the app can say plainly
            that somebody added yesterday cannot read last week — a fact the floor makes
            true and that nothing else in the UI would explain (D218).
        reads_from_beginning:
          type: boolean
          description: >-
            True when this member's floor IS the conversation's beginning, so they read all
            of it. ⚠ The panel branches on THIS and not on `effective_from` against the
            room's `created_at` — see the same field on `Conversation` for why the two
            disagree.
        added_by: { type: [string, "null"] }
        muted:
          type: [boolean, "null"]
          description: Present only on the caller's own row; null for everyone else's. Mute is nobody else's business.

    ConversationMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: ALWAYS an array, never null (D174).
          items: { $ref: "#/components/schemas/ConversationMember" }

    ConversationMemberAdd:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }

    ConversationMemberSelfUpdate:
      type: object
      minProperties: 1
      properties:
        muted: { type: boolean }

    ChatMessage:
      type: object
      required: [id, conversation_id, author_id, author_label, body, attachments, reactions, created_at, deleted]
      description: >-
        ⚠ A message mutation writes **no audit event** (PRD D231) — chat is the first module
        in Home whose primary mutation writes none, deliberately, guarded by
        `TestChatMessagesAreNotAudited`. Its attachments ARE audited: the bytes are what the
        storage half of v10 exists for.
      properties:
        id: { type: string, description: UUIDv7 — also the thread's ordering key. }
        conversation_id: { type: string }
        author_id: { type: string }
        author_label: { type: string, description: Display name at render time, from the session-projected directory (D230). }
        body:
          type: string
          description: >-
            Up to 8 000 characters. **Empty on a tombstone**, because the delete blanks it in
            place — `chat_messages_fts` is external-content and a body left in the table is a
            body still returned by search (D223).
        reply_to: { $ref: "#/components/schemas/ChatMessageQuote" }
        attachments:
          type: array
          description: ALWAYS an array, never null (D174).
          items: { $ref: "#/components/schemas/ChatAttachment" }
        reactions:
          type: array
          description: >-
            ALWAYS an array, never null (D174) — and empty on a tombstone, because the delete
            takes them with it. D223 keeps the row so replies do not point at nothing; it does
            not keep six people's ❤️ on a sentence nobody can read any more.
          items: { $ref: "#/components/schemas/ChatReaction" }
        created_at: { type: string, format: date-time }
        edited_at:
          type: [string, "null"]
          format: date-time
          description: Non-null ⇒ the bubble renders *upraveno*. ⚠ There is no record of what it said before (D225).
        deleted: { type: boolean, description: "A tombstone — *Zpráva byla smazána* — kept so replies do not point at nothing (D223)." }

    ChatReaction:
      type: object
      required: [emoji, by]
      description: >-
        One emoji's chip on one message (PRD D265).

        ⚠ **There is no `mine` and no `count`, and neither may be added.** The `/ws` frame
        carrying a message is marshalled ONCE for the whole audience (D233), so a
        per-recipient field would be correct for at most one recipient; and a count beside a
        list is a second spelling of `by.length` that can disagree with it. Both questions are
        answered client-side against the identity the client already holds — which is what
        every bubble already does to decide whether it is its own.
      properties:
        emoji:
          type: string
          description: >-
            One of exactly seven: ❤️ 👍 😂 😮 😢 🙏 ✅. ⚠ The heart is TWO code points (U+2764
            U+FE0F) and the variation selector is part of the value — the server compares
            byte-for-byte, so a "tidied" bare ❤ is refused with 422.
        by:
          type: array
          description: >-
            Who reacted, oldest first. Carries a display name and — like everything else in
            this module — never an email or a role (D230).
          items: { $ref: "#/components/schemas/ChatReactionActor" }

    ChatReactionActor:
      type: object
      required: [user_id, label]
      properties:
        user_id: { type: string }
        label: { type: string, description: Display name at render time, from the session-projected directory (D230). }

    ChatReactionUpdate:
      type: object
      required: [emoji, reacted]
      properties:
        emoji:
          type: string
          description: One of the seven. Anything else is a 422 — the palette is closed and the server is where that is true.
        reacted:
          type: boolean
          description: >-
            ⚠ The DESIRED state, not a toggle. `true` adds the caller's reaction, `false`
            removes it, and both are idempotent — which is what makes a double tap that fired
            twice land where the member meant rather than on the opposite of it. ⚠ **Required
            in earnest: omitting it is a 422, not a `false`.**

    ChatMessageQuote:
      type: object
      required: [available]
      description: >-
        The quoted parent of a reply. ⚠ **It is a READ of the parent, not denormalised data
        belonging to the child** — which is why it goes through the same membership-and-floor
        predicate as everything else, and why it is the leak the floor most easily misses
        (PRD D226).
      properties:
        available:
          type: boolean
          description: >-
            False when the parent is below the caller's `effective_from`. Every other field
            is then absent and the UI renders *"Zpráva mimo vaši historii"* — no author, no
            date, no excerpt.
        id: { type: string }
        author_label: { type: string }
        excerpt: { type: string, description: First line or so. Absent when `available` is false. }
        created_at: { type: string, format: date-time }
        deleted: { type: boolean, description: The parent is a tombstone; the quote renders as one.  }

    ChatMessagePage:
      type: object
      # `has_more` is required: the thread gates *Načíst starší* on it, so a client
      # that types it optional cannot page at all without inventing a default.
      required: [items, has_more]
      description: >-
        ⚠ `next_cursor` and `has_more` are computed from the SAME predicate that produced
        `items` — membership, floor, koš. A post-filter would leak what it removed through
        exactly these two fields even with the rows gone, which is why the acceptance
        criteria assert them and not only the visible rows (PRD D218).
      properties:
        items:
          type: array
          description: ALWAYS an array, never null (D174).
          items: { $ref: "#/components/schemas/ChatMessage" }
        next_cursor: { type: [string, "null"] }
        has_more: { type: boolean }

    ChatMessageCreate:
      type: object
      description: JSON body — a message with no attachments.
      properties:
        body: { type: string, maxLength: 8000 }
        reply_to_id: { type: [string, "null"], description: Must name a message in the same conversation; otherwise 422. }

    ChatMessageUpload:
      type: object
      required: [files]
      description: >-
        multipart/form-data — a message that carries files. **One request, not an
        upload-then-reference pair** (PRD D224): a two-step flow orphans an object every
        time the second step never happens, and chat has no reconciliation pass to find one.
      properties:
        body: { type: string, maxLength: 8000, description: May be empty when at least one file is present. }
        reply_to_id: { type: string }
        files:
          type: array
          maxItems: 10
          description: >-
            Up to ten. Each is sniffed SERVER-SIDE for its MIME type and classified `image`,
            `video` or `file` — the client's claim is never trusted (D48). Per-file cap is
            `HOME_DOCS_MAX_UPLOAD_MB`, shared with Dokumenty so that every chat attachment is
            movable into Dokumenty by construction (D228).
          items: { type: string, format: binary }

    ChatMessageUpdate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 8000 }

    ChatAttachment:
      type: object
      required: [id, kind, state, original_filename, content_type, byte_size, created_at, uploaded_by]
      description: >-
        ⚠ **Three states, and the bubble renders each differently.** `live` shows the file;
        `removed` shows an epitaph built from `original_filename`, `byte_size`,
        `cleaned_by_label` and `cleaned_at` (PRD D243); `moved` shows the file, sourced from
        Dokumenty via `document_path`, with a marker saying where it now lives (D246).
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [image, video, file]
          description: >-
            Server-sniffed, never the client's claim. `image` gets a thumbnail and recorded
            dimensions; `video` is stored as uploaded with **no transcoding and no poster
            frame**; `file` is a download, and a PDF opens in the browser's own viewer. There
            is no preview pipeline in chat (D227).
        state:
          type: string
          enum: [live, moved, removed]
          description: >-
            Only `live` counts toward either threshold and only `live` appears on the
            clean-up page. `moved` bytes left the `chat/` prefix, so they leave both
            thresholds by construction rather than by bookkeeping that can drift.
        original_filename: { type: string, description: Blanked when the parent message is deleted, alongside its body. }
        content_type: { type: string }
        byte_size: { type: integer, description: Retained on `removed` so the epitaph can state it. }
        width: { type: [integer, "null"], description: "`image` only — recorded so the thread does not reflow as images load." }
        height: { type: [integer, "null"] }
        has_thumbnail: { type: boolean }
        document_id:
          type: [string, "null"]
          description: Set when `state=moved`. ⚠ It resolves to a SHARED Dokumenty item, readable by the whole household (D245).
        document_path:
          type: [string, "null"]
          description: What the bubble renders after a move — the documents content URL returned by the sink.
        uploaded_by: { type: string }
        created_at: { type: string, format: date-time }
        cleaned_by_label: { type: [string, "null"] }
        cleaned_at: { type: [string, "null"], format: date-time }

    ChatAttachmentMove:
      type: object
      required: [folder_id]
      properties:
        folder_id:
          type: string
          description: >-
            ⚠ A **SHARED** Dokumenty folder. A private v9 folder is refused with 422 — a
            private target would make the file unreadable to the conversation's other
            members, which is the opposite of what the move is for (PRD D245).

    ChatReadUpdate:
      type: object
      required: [until_message_id]
      properties:
        until_message_id: { type: string }

    ChatReadState:
      type: object
      required: [conversation_id, unread_count]
      properties:
        conversation_id: { type: string }
        last_read_at: { type: [string, "null"], format: date-time }
        unread_count: { type: integer, description: After the update. Advancing is idempotent and never moves backwards (D250). }

    ChatSearchHit:
      type: object
      required: [message_id, conversation_id, conversation_name, author_label, snippet, created_at]
      properties:
        message_id: { type: string }
        conversation_id: { type: string }
        conversation_name: { type: string }
        author_label: { type: string }
        snippet:
          type: string
          description: >-
            ⚠ A snippet **is** a message body by another name, which is why the membership
            join and the floor ride inside the `MATCH` query rather than filtering its
            results (PRD D251).
        created_at: { type: string, format: date-time }

    ChatSearchPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: ALWAYS an array, never null (D174).
          items: { $ref: "#/components/schemas/ChatSearchHit" }
        next_cursor: { type: [string, "null"] }

    ChatStorage:
      type: object
      required: [total_bytes, threshold_total_mb, total_exceeded, threshold_conversation_mb,
                 conversations, can_clean_up, max_upload_mb, move_available]
      description: >-
        What the in-module warning renders. Both thresholds are **WARN ONLY** — no upload is
        ever refused, there is no quota and no new 413 anywhere in the app (PRD D237, §V9
        D196).
      properties:
        total_bytes:
          type: [integer, "null"]
          description: >-
            The whole household's live chat attachment bytes — the same figure for every
            member, because `chat.total` is about the bucket. ⚠ **Conversations in the koš
            are included** (D254): their bytes are still in R2, and these figures have to sum.
        threshold_total_mb: { type: integer }
        total_exceeded: { type: boolean }
        threshold_conversation_mb: { type: integer, description: One number applied to every conversation — there is no per-room override (D237). }
        conversations:
          type: array
          description: >-
            **Only conversations the caller belongs to.** ALWAYS an array, never null (D174).
          items: { $ref: "#/components/schemas/ChatStorageConversation" }
        can_clean_up:
          type: boolean
          description: >-
            ⚠ **AS BUILT (0.12.1).** D241's gate is member ∧ (`editor`|`admin`) and the
            client holds only the ROLE half — so the server answers the intersection here
            and the warning banner asks rather than guesses. Without it a `reader` is
            offered a link to `/chat/uklid` that 403s them, which is precisely what the
            copy is not allowed to do. The membership half stays per row: a member of no
            conversation passes this gate and gets an empty page, not a refusal.
        max_upload_mb:
          type: integer
          description: >-
            ⚠ **AS BUILT (0.12.1).** The per-file cap — `HOME_DOCS_MAX_UPLOAD_MB`, shared
            with Dokumenty (D228) — so the composer can refuse an over-cap file BEFORE
            uploading it. A client constant would name a limit that stops being the limit
            the moment an operator raises it; the server stays the authority and still
            answers 413.
        move_available:
          type: boolean
          description: >-
            ⚠ **AS BUILT (0.12.1).** Whether a `storage.BlobSink` is wired at all, which is
            what D239's *"the button is absent"* half needs: with no sink the move is 501,
            and a capability that is plainly absent has to LOOK absent rather than open a
            folder picker and refuse after the confirm.

            ⚠ **It is NOT `can_clean_up`, and conflating them was the bug.** That one
            answers D241's ROLE gate; this one answers whether the capability exists in
            this deployment. Gating the button on the role meant a household without
            `documents` wired still offered *Přesunout do Dokumentů* to every editor.

    ChatStorageConversation:
      type: object
      required: [id, name, bytes, objects, over_limit]
      properties:
        id: { type: string }
        name: { type: string }
        bytes: { type: [integer, "null"] }
        objects: { type: [integer, "null"] }
        over_limit: { type: boolean }

    ChatCleanupItem:
      type: object
      required: [attachment, conversation_id, conversation_name, uploaded_by_label, conversation_over_limit]
      description: >-
        One row of Úklid úložiště chatu. ⚠ **Only `state='live'` attachments, only from the
        caller's own conversations, only above their floor, koš excluded** (PRD D241).
      properties:
        attachment: { $ref: "#/components/schemas/ChatAttachment" }
        conversation_id: { type: string }
        conversation_name: { type: string }
        conversation_over_limit: { type: boolean, description: Flags the rooms that raised the per-conversation warning, so cleaning can start where it pays. }
        uploaded_by_label: { type: string }

    ChatCleanupPage:
      type: object
      required: [items, total_bytes]
      properties:
        items:
          type: array
          description: ALWAYS an array, never null (D174).
          items: { $ref: "#/components/schemas/ChatCleanupItem" }
        next_cursor:
          type: [string, "null"]
          description: >-
            ⚠ Null under `sort=size`, which is SINGLE-PAGE — a keyset cursor is an id, and an
            id does not locate a position in a size ordering. The §V9 `private-items`
            precedent, refused rather than silently ignored.
        total_bytes:
          type: [integer, "null"]
          description: Across ALL matching items, not only this page — the figure the screen exists to act on.

    ChatDirectoryEntry:
      type: object
      required: [user_id, display_name]
      description: >-
        ⚠ Display name only. `push.Member` also carries `email` and `roles`, and this is the
        first surface in Home that shows the directory to a non-admin (PRD D230).
      properties:
        user_id: { type: string }
        display_name: { type: string }

    ChatDirectory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: >-
            ALWAYS an array, never null (D174). ⚠ It is a LOGIN HISTORY projected from
            `sessions` — Home has no `users` table — so somebody who has never logged in is
            simply not here and cannot be added to a conversation (D230).
          items: { $ref: "#/components/schemas/ChatDirectoryEntry" }

    StorageChat:
      type: object
      required: [total_bytes, threshold_total_mb, exceeded, threshold_conversation_mb, mirrored, conversations]
      description: >-
        The chat block of the Úložiště snapshot (v10). ⚠ **There is no way in from here.** No
        thread, no message, no attachment list, no clean-up page and no link: an admin sees
        which room is heavy and asks its members, because the clean-up page is member-scoped
        (PRD D240, D241). The only two chat verbs an admin has over a conversation they are
        not in are restore and purge, and neither opens it (D255).

        Conversation names and rough membership therefore become admin-visible. That is the
        price of a module-level warning somebody can act on, and it is a decision rather than
        an oversight.
      properties:
        total_bytes: { type: [integer, "null"] }
        threshold_total_mb: { type: integer }
        exceeded: { type: boolean }
        threshold_conversation_mb: { type: integer }
        thresholds_updated_at:
          type: [string, "null"]
          format: date-time
          description: ⚠ **AS BUILT (0.12.1).** When the pair was last saved.
        thresholds_updated_by:
          type: [string, "null"]
          description: >-
            ⚠ **AS BUILT (0.12.1).** Who saved them, and **null for a seeded default** —
            the Limity tab distinguishes a value somebody chose from one nobody has
            touched, which a fake actor in `02004`'s seed would have made impossible.
        mirrored:
          type: boolean
          description: >-
            ⚠ **Always false, and deliberately so** (PRD D229). Chat blobs are NOT copied to
            the backup bucket: they are the most disposable bytes in the application and the
            module exists under a storage warning, so doubling them into the mirror would be
            the one place in Home where a background job undermines a threshold. The page
            renders *Nezálohováno* rather than leaving a gap that reads as zero.
        conversations:
          type: array
          description: Every conversation, trashed ones included. ALWAYS an array, never null (D174).
          items: { $ref: "#/components/schemas/StorageChatConversation" }

    StorageChatConversation:
      type: object
      required: [id, name, members, bytes, objects, over_limit]
      properties:
        id: { type: string }
        name: { type: string }
        members: { type: integer, description: A count. Never the names — an admin sees that a room is heavy, not who is in it. }
        bytes: { type: [integer, "null"] }
        objects: { type: [integer, "null"] }
        over_limit: { type: boolean }
        trashed_at:
          type: [string, "null"]
          format: date-time
          description: >-
            Non-null ⇒ in the koš, and ⚠ **still counted in `total_bytes`** (PRD D254). An
            admin chasing an overrun needs to know that 200 MB is spoken for but not yet gone.
        purge_after: { type: [string, "null"], format: date-time }

    StorageThresholds:
      type: object
      required: [chat_total_mb, chat_conversation_mb]
      description: >-
        The DB-backed chat thresholds (PRD D236). ⚠ v9's `HOME_STORAGE_WARN_TOTAL_MB` is NOT
        here and remains an environment variable — two threshold mechanisms now exist, the
        inconsistency is recorded rather than hidden, and reconciling them is v11's.
      properties:
        chat_total_mb: { type: integer, minimum: 1 }
        chat_conversation_mb: { type: integer, minimum: 1 }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: [string, "null"] }

    StorageThresholdsUpdate:
      type: object
      minProperties: 1
      properties:
        chat_total_mb: { type: integer, minimum: 1 }
        chat_conversation_mb: { type: integer, minimum: 1 }

security:
  - sessionCookie: []
