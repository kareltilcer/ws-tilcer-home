openapi: 3.1.0
info:
  title: Home API
  version: 0.13.1
  description: >-
    API for the `home` household-management service. **0.13.0 IS v10.1 — CHAT'S SECOND
    PASS.** 0.12.0 was the v10 spec, 0.12.1 reconciled it against the shipped code after
    PR 3, and 0.12.2 made four list cursors one encoding.

    **0.13.1 changes no shape at all.** It reconciles the two descriptions of the member
    directory against the shipped code: both said the identity behind it was cached "at
    login", which stopped being true when the fifteen-minute role re-mint started writing
    the email and the display name too (D270). A reader of this spec would have concluded
    that a rename in auth never reaches Home until that member logs in again — which is
    the behaviour the change removed. Both surfaces say it, so both are corrected: the
    composer's `NotificationCatalog.members`, and `GET /api/chat/directory`, which is the
    one a member actually looks at.

    **What 0.13.0 adds is one path and three fields, and none of it is breaking.**

    ⚠ **`PUT /api/chat/messages/{id}/reactions`** — seven emoji, a chip per emoji under the
    bubble (D265). It takes the **desired state** (`reacted: true|false`) rather than
    toggling, because the gesture that drives it is a double tap: a gesture fires twice far
    more easily than a button does, and a toggle applied twice lands on the opposite of what
    the member meant with a vanished chip as the only evidence. The emoji rides in the BODY
    and not in the path — ❤️ is two code points (U+2764 U+FE0F) and a path segment would make
    the route's identity depend on how a client percent-encoded the variation selector.

    ⚠ **`ChatMessage.reactions` carries NO `mine` AND NO `count`, and it must not grow
    either.** The /ws frame carrying a message is marshalled ONCE for the whole audience
    (D233), so a per-recipient field is right for at most one recipient; and a count beside a
    list is a second spelling of `by.length` that can disagree with it. The reactors ride as
    `(user_id, label)` pairs and every client answers both questions locally, which is what
    every bubble already does to decide whether it is its own.

    ⚠ **`ChatConversation.last_message` is bounded by the caller's floor** (D266). `MAX(id)`
    over a conversation is the newest message the ROOM has, which for a member added
    yesterday is a body they may not read — printed on the row they see before they open
    anything, which is a worse disclosure than the thread's would be because nobody has to
    click. It is `null` both for a room nobody has written in and for a member whose floor
    sits above everything written so far; those are the same absence from here.

    **`ChatConversationPage.trashed_count`** (D267) is how many conversations the CALLER has
    in the koš, on both listings, so the sidebar can hide an empty koš without a second
    request — the koš's ROWS are still fetched only when the section is opened.

    **What 0.12.2 changed: the composite list cursors became one encoding.** Four
    collections paged on a sort tuple rather than on an id, and each had written its own
    token format — two of them in plain text a client could read. They now share
    `platform/cursor`, an unpadded base64url token described by the new `OpaqueCursor`
    parameter. `/api/garden/tasks` is unaffected on the wire (that was already its
    format); `/api/logs`, `/api/logs/entity/{type}/{entityId}`, `/api/documents` and
    `/api/chat/conversations` all emit a different `next_cursor` than they did at 0.12.1.

    A cursor is short-lived and every client echoes it back verbatim, so the only
    visible effect is for a client paging ACROSS the deploy: the token it holds was
    minted by the old encoding and no longer decodes. Each collection answers that the
    way it always has — `/api/logs*` and `/api/garden/tasks` with a 422,
    `/api/documents` by restarting at page one, `/api/chat/conversations` with a 422 —
    which is one bad page, not a broken client. The house `Cursor` parameter continues
    to describe the UUIDv7 cursor the id-ordered collections use; it had also been
    carrying `/api/documents` and `/api/logs*`, which it never accurately described.

    **What 0.12.1 corrected, and it is one thing plus three additions.**

    ⚠ **The threshold audit action is `chat.threshold.update`, NOT
    `chat.settings.updated`** (D263). The design bundle is later than the PRD and wins on
    this point; `PUT /api/admin/storage/thresholds` below still carried the old name at
    0.12.0. `chat.Module.AuditActions()` declares the verb and the `admin` module emits it
    with `module = "chat"` — the setting is an admin's to change and the subject is chat's,
    which is the same shape D255 uses when an admin restores a room they may not read.

    Three fields were added because the client could not be correct without them:
    `ChatStorage.can_clean_up` (D241's gate is member ∧ (`editor`|`admin`) and the client
    holds only the role half, so a banner that guessed would offer a `reader` a link that
    403s them), `ChatStorage.max_upload_mb` (the composer refuses an over-cap file BEFORE
    uploading it, and a hard-coded 50 would name a limit that is not the limit once an
    operator raises `HOME_DOCS_MAX_UPLOAD_MB`), and `StorageChat.thresholds_updated_at` /
    `.thresholds_updated_by` (the Limity tab distinguishes a value somebody chose from a
    seeded default, which a fake actor in the seed would have made impossible).

    ⚠ **Everything else in the v10 section below describes the server as built.** The
    attachment, storage, clean-up and move paths are LIVE from PR 3; they were documented
    at 0.12.0 and unimplemented until then.

    v10 adds the ELEVENTH module, `chat`: one household conversation everybody is in
    (**Vsichni** / Vsichni) plus any number of created groups, carrying images, video and
    files. It introduces a THIRD ACCESS AXIS beside role and ownership - MEMBERSHIP. A
    conversation is readable by the people in it, which is neither "everyone" (v1-v8) nor
    "one person" (v9), and the refusal is v9's: **404, never 403**, byte-identical to an
    unknown id, admins included (PRD D217). Every read carries a second predicate,
    `chat_members.effective_from` - the instant from which a conversation is a member's to
    read - applied INSIDE the SQL, never over a fetched page, because a post-filter leaks
    through cursors, counts and snippets even when the rows themselves are gone (D218).

    (WARNING) `effective_from` is NOT "when they joined". The default conversation seeds it
    with the conversation's own `created_at`, so a member the app sees for the first time in
    2028 reads the household room in full, while a group add writes `now`. The exemption is
    a VALUE, not a branch: no read path anywhere in the module tests `kind == "default"` to
    decide what history to show, and a test asserts it (D258).

    Two changes are larger than the chat itself. `platform/ws` grows an IDENTITY - the hub
    broadcast to every connected client and kept no user id at all, so it gains a per-user
    index and `PublishTo`, and chat's payload is the first in Home to carry content (D232,
    D233); `Publish` is untouched and no other module's fan-out changes. And **Presunout do
    Dokumentu** is a CUSTODY TRANSFER across the storage catalog, not a copy: `chat` may not
    import `documents`, so it goes through a new `BlobSink`, and the ordering - validate,
    copy, insert, mark, **delete last** - is fixed so that every crash point over-counts
    rather than loses the file (D238). (WARNING) **A move is a PUBLISH**: the file becomes
    readable by the whole household, non-members of that conversation included, and the
    dialog says so in words (D245).

    Storage is the other half. Two DB-backed thresholds - `chat.total` (512 MB) and
    `chat.conversation` (128 MB, one number applied to every room) - are WARN ONLY and never
    block an upload (D237). The clean-up page is member-scoped with an `editor`/`admin` gate
    on top (D241), and deleting a conversation is a **7-day kos** whose bytes keep counting
    until they are actually gone, which is why *Smazat natrvalo* exists (D253, D254).

    (WARNING) **Messages write NO audit event** (D231). Only structural events do -
    conversations, membership, attachments, settings. Chat is the first module in Home whose
    primary mutation breaks the every-mutation-audits invariant, and it does so deliberately:
    auditing every message content-free was adopted for one round and reverted, because it
    turns the Log into a traffic-analysis record of the household and grows the audit spine
    by a row per message with `HOME_LOG_RETENTION_DAYS` defaulting to never-prune.
    `TestChatMessagesAreNotAudited` guards the breach so it cannot be "fixed" by accident.

    (WARNING) 0.11.0 NOTES BELOW, UNCHANGED - v9 as built.

    ⚠ Two places where this document differs from the v9 SPEC copy in
    `handoff/v9/openapi.yaml`, both recorded in `PRD.md` §V9-12:

    1. `POST /api/{notes,documents}/{id}/publish` — the spec's prose said "an admin gets a
    403" while its own response block, D206 and the PRD all said 404. **404 governs**, and
    the prose here has been corrected. A 403-for-private / 404-for-unknown pair on a route
    open to every `editor` answers *"does this id exist, and is it private?"* for any id.

    2. `StorageReplica.configured` is **always false**. D214 specified a Litestream replica
    line; reading it requires handing the application process the credentials for the
    household's entire database backup, and that was **declined** (settled 2026-08-24). The
    field remains in the payload so the shape is stable and the SPA has a designed state to
    render. Anyone who populates it has reversed a decision, not fixed an oversight.

    v9 is the first version of Home that adds NO MODULE. It changes three that exist —
    `notes`, `documents`, `admin` — and adds one platform strand, `platform/storage`.
    Poznámky and Dokumenty each gain a SECOND ROOT: a per-member private tree
    (`visibility` + `owner_id`) that nobody else can read, ADMINS INCLUDED. The refusal is
    ALWAYS 404, never 403 — a 403 confirms an id exists and turns /d/{id} into an existence
    oracle over the private tree (PRD D180). One asymmetry exists and only one: an admin may
    HARD-DELETE a foreign private item and may never read one (D181). Publishing is one-way
    and owner-only (D182); there is deliberately no unpublish route. Every tree, list, search
    and resolve endpoint takes the shared `Scope` parameter, default `shared` (D184).
    Publishing refuses a non-owner with 404 — never 403 — byte-identically to an unknown id
    (D206), because the route is open to every `editor` and a 403 would answer "does this id
    exist, and is it private?".
    Audit events for private items are written IN FULL and redacted at READ time (D187):
    non-owners see a fixed phrase, `redacted: true`, no `entity_id` and an empty `changes`,
    and private events are excluded from the log's `?q=` FTS matching entirely, because a
    redacted hit still reveals that the term occurs in a private title (D188). Administrace
    gains `GET /api/admin/storage` (a computed-on-read snapshot: database per module per
    table, R2 per module split shared/per-member, unattributed objects, the mirror bucket,
    one warning threshold — no history, no job, no quota) and
    `GET /api/admin/storage/private-items` (the purge screen's listing: id, module, kind,
    owner, size, dates — NEVER a title, filename or content type; deletion goes through the
    owning module's existing hard-delete route, D198).

    **0.10.1 = v8 AS BUILT, and is what is
    deployed** — 0.10.0 was the v8 spec, and this is its reconciliation against the shipped code
    (2026-08-21): the `electricity` and `garden` sections now describe the server rather than the
    intention, and `AuditEventDetail.changes` is required because empty collections serialise as
    `[]`, never null. Where a description says ⚠ AS BUILT, it records a deviation the code took and
    the spec followed — not a design.
    v8 adds the
    `electricity` module (Elektřina — VT/NT meter readings taken at arbitrary dates, a ceník
    versioned by effective date, zálohy with a due day, user-set settlement periods, and a
    nedoplatek/přeplatek prediction computed on read; tag `electricity`). It is the leanest module
    home has: NO widget, NO metric, NO list and NO push — nothing on Nástěnka, nothing in the
    notification catalogs. Its energy is integer TENTHS OF KWH (`*_dkwh`) and its money is integer
    HALÉŘE (`*_haler`), because this module's prices are not whole koruny.
    **0.9.0 was the v7 spec, and shipped inside 0.10.1**: it adds the `garden` module (Zahrada — a two-level crop
    knowledge base with anchored timing windows, beds whose order is the adjacency model, a per-season
    plan whose checks are computed on read and never block a save, a garden-owned work calendar with
    od–do windows, plus harvest, storage and an LLM import/export — export is a SUPERSET of what
    import accepts; tag `garden`). The module
    sends NO push: it publishes catalog keys and one nightly audit event, and Administrace delivers.
    **0.8.0 was the v6 spec**: it added the
    `finance` module (Finance — the retiring `fin` service absorbed into Home: two monthly incomes
    split into personal / operational / two savings accounts by a LOCKED formula, derived on read
    and never stored; tag `finance`). **0.7.0 was the deployed v5 build.** v5 — adds the admin-only `admin` module (Web Push notifications: broadcast, audit-key triggers, scheduled summaries; tags `push`, `admin-notifications`) and an installable reads-only-offline PWA. Companion to PRD.md.
    Ten modules (`admin` from v5, `finance` from v6, `garden` from v7 and `electricity` from v8 are summarised above): `logging` (a spine; read/browse endpoints only — writes are
    in-process, not HTTP), `todo` (Trello-style board), `events` (Okno do
    budoucnosti — all-day, optionally recurring events with reminders), `notes`
    (Poznámky — Markdown notes in a folder tree, slug-path URLs, a pinned-notes
    widget; new in v3), `documents` (Dokumenty — file storage in a folder tree:
    upload/preview/download, blobs in a dedicated Cloudflare R2 bucket with metadata
    in SQLite, a PERMANENT id-based household-only content URL, immutable upload-once
    bytes, a pinned-documents widget; new in v4), and `dashboard` (Nástěnka — a
    per-user WIDGET HOST). Identifiers are English; the UI is Czech.

    AUTH IS MODE B (v2): home hosts its own login and owns its own SESSION. The
    browser carries NO bearer token — every /api endpoint is authorized by the
    home SESSION COOKIE, and cookie-authenticated state-changing routes additionally
    require the CSRF header (X-CSRF-Token matching the csrf cookie). Home verifies
    credentials against auth BE->BE (/internal/login) and refreshes roles via
    /internal/token/mint; that BE->BE traffic is not part of THIS API. Writes require
    the `editor` or `admin` role; /api/logs/** require `admin`; /api/auth/* and
    health are reachable before a session exists.

    The dashboard is a widget host: GET /api/dashboard returns the user's layout plus
    each visible widget's data (the host fans out to module-provided widget providers;
    it owns no feature data). Recurrence is stored as an RFC 5545 RRULE subset and
    expanded on read — occurrences are never persisted; the only per-occurrence row is
    a reminder completion. Real-time updates are delivered over a session-authenticated
    websocket at GET /ws, not modeled here since OpenAPI describes HTTP only.
servers:
  - url: https://home.tilcer.cz
    description: Production (Coolify)

tags:
  - name: auth
    description: Home-hosted login/logout and session (Mode B)
  - name: health
    description: Liveness/readiness probes (baseline for every backend)
  - name: boards
    description: To-do boards (top-level container)
  - name: columns
    description: Columns within a board (sortable, collapsible; the "folders")
  - name: cards
    description: To-do cards (title, notes, links, checklist, labels)
  - name: labels
    description: Board-scoped labels/tags
  - name: events
    description: Okno do budoucnosti — all-day, optionally recurring future events
  - name: notes
    description: Poznámky — Markdown notes in a folder tree (slug-path URLs, pinning); new in v3
  - name: documents
    description: Dokumenty — file storage in a folder tree (R2 blobs, permanent id-based household-only URLs, preview/download, pinning); new in v4
  - name: dashboard
    description: Nástěnka — per-user widget host (layout + module-provided widget data)
  - name: logs
    description: Audit-log browser (admin only)

  - name: push
    description: Per-user Web Push subscription + notification preferences (any member; new in v5)
  - name: admin-notifications
    description: Admin-only notification config — broadcast, trigger rules, summary schedules, catalog, deliveries (new in v5)
  - name: finance
    description: Finance — monthly household income split into personal/operational/savings accounts; split derived on read (new in v6)
  - name: garden
    description: Zahrada — crop knowledge base (druh → odrůda), beds, season plan with on-read compatibility/rotation checks, a work calendar, harvest and storage (new in v7)
  - name: electricity
    description: "Elektřina — VT/NT meter readings, a ceník versioned by effective date, zálohy, user-set settlement periods and an on-read nedoplatek/přeplatek prediction (new in v8). Publishes no widget, metric, list or push."
  - name: admin-storage
    description: "Admin-only storage statistics and the private-items purge listing (new in v9). Owns no state: the snapshot is computed on read behind a short cache, and deletion happens through the owning module's hard-delete route."
  - name: chat
    description: "Chat \u2014 a default household conversation (V\u0161ichni) plus created groups, carrying images, video and files. MEMBERS-ONLY: a non-member gets 404, admins included (new in v10). Publishes no widget, metric or list."

paths:
  # ---------------- Auth (Mode B, home-hosted) ----------------
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in (home-hosted)
      description: >-
        Verifies credentials against auth BE->BE (/internal/login) and, on success,
        creates a home session. Sets the session + csrf cookies. The browser
        receives NO bearer token. Password is never logged or persisted. Rate-limited
        per email and per IP. CSRF-exempt (no session yet).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; session established
          headers:
            Set-Cookie:
              description: "`session` (HttpOnly) and `csrf` (JS-readable), host-only, Secure, SameSite=Lax."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401":
          description: Bad credentials (generic)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Account disabled/unverified, or no access to site home
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            Auth demands MFA, which home does not handle (v1 of Mode B). Body error
            is `mfa_required`; the UI directs the user to auth-hosted login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Auth service unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Log out (revoke the home session)
      description: Requires the CSRF header (cookie-authenticated mutation).
      responses:
        "204": { description: Session revoked; cookies cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/session:
    get:
      tags: [auth]
      summary: Current session (SPA bootstrap)
      description: Returns the signed-in user for a valid session, else 401. Used on app load.
      responses:
        "200":
          description: Valid session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------- Health ----------------
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (includes SQLite check)
      security: []
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready (e.g. DB unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------- Boards ----------------
  /api/boards:
    get:
      tags: [boards]
      summary: List boards
      responses:
        "200":
          description: Boards in manual order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [boards]
      summary: Create a board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoardCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/boards/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [boards]
      summary: Get a board
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [boards]
      summary: Update a board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoardUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [boards]
      summary: Delete a board
      parameters:
        - name: hard
          in: query
          schema: { type: boolean, default: false }
          description: Hard-delete instead of archiving.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/boards/{id}/tree:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [boards]
      summary: Board read model (columns in order + cards + summaries)
      description: >-
        Returns the board with its columns (in sort order) and each column's cards
        (in order, with label ids and checklist progress). Card links and full
        checklist load via the card detail. Collapse is applied client-side.
      parameters:
        - name: label
          in: query
          description: Filter cards by one or more label ids.
          schema:
            type: array
            items: { type: string }
        - name: q
          in: query
          description: Free-text filter over card title/notes.
          schema: { type: string }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Board tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardTree" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- Columns ----------------
  /api/boards/{id}/columns:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [columns]
      summary: List a board's columns (sort order)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Column" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [columns]
      summary: Create a column
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/columns/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    patch:
      tags: [columns]
      summary: Update a column (name, priority, kind)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [columns]
      summary: Delete a column
      parameters:
        - name: cascade
          in: query
          description: Delete the column even if it holds cards (cards deleted, each logged).
          schema: { type: boolean, default: false }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Column not empty and cascade not set (returns card count)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/columns/{id}/move:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [columns]
      summary: Reorder a column within its board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Column" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  # ---------------- Cards ----------------
