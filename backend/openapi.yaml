      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardMoveRequest" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ---------------- Card links ----------------
  /api/cards/{id}/links:
