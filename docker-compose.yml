# Offline end-to-end run of the two services on your machine, mirroring the
# ws-tilcer-fin layout: a Go API/websocket backend and an Nginx-served SPA.
#   - backend  : Go API + websocket on http://localhost:7999
#   - frontend : Nginx-served SPA on http://localhost:7001, reverse-proxying
#                /api and /ws to the backend (home's SPA is same-origin).
# Both run with the dev auth bypass and no R2 replication — a smoke test of the
# images and entrypoint, not a real deploy (real deploys go through Coolify).
#
# Build + run:  docker compose up --build
# Then open http://localhost:7001 (you are the fake dev admin; no login).
services:
  backend:
    # API-only image (Go API + websocket); the SPA is the frontend service.
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tilcer-home-backend:dev
    container_name: tilcer-home-backend
    environment:
      HOME_ENV: ${HOME_ENV:-development}
      HOME_ADDR: ${HOME_ADDR:-:7999}
      HOME_DEV_AUTH_BYPASS: ${HOME_DEV_AUTH_BYPASS:-true}
      HOME_DEV_ACTOR_ROLES: ${HOME_DEV_ACTOR_ROLES:-admin}
      # Real auth — required only when the dev bypass is OFF (i.e. a real Coolify
      # deploy). The defaults below are intentionally NONSENSE so a forgotten
      # override fails loudly: REPLACE both in Coolify's env vars with the auth
      # service URL and the shared BE→BE secret. With the bypass on (local
      # harness) they are ignored, so these placeholders are harmless here.
      AUTH_BASE_URL: ${AUTH_BASE_URL:-https://REPLACE-ME.auth.invalid}
      HOME_AUTH_SERVICE_SECRET: ${HOME_AUTH_SERVICE_SECRET:-REPLACE_ME_shared_auth_secret}
      # Shared HS256 secret used to VERIFY the access tokens auth returns from
      # /internal/login + /internal/token/mint (identity + roles live in the JWT
      # claims). MUST equal the auth service's JWT signing secret, or every login
      # fails closed with empty roles.
      HOME_AUTH_JWT_SECRET: ${HOME_AUTH_JWT_SECRET:-REPLACE_ME_shared_jwt_secret}
      # Optional issuer pin. auth stamps `iss` = its OWN base URL (e.g.
      # https://auth.tilcer.cz), which is NOT AUTH_BASE_URL above when that ends
      # in /api. Leave unset to skip the issuer check (signature + audience still
      # apply); set it only if you know auth's exact iss.
      HOME_AUTH_JWT_ISSUER: ${HOME_AUTH_JWT_ISSUER:-}
      LITESTREAM_ENABLED: ${LITESTREAM_ENABLED:-false}
      HOME_DB_PATH: ${HOME_DB_PATH:-/data/home.db}
      # ---- documents (v4) ----
      # The harness stores document bytes on the same volume as the database
      # (HOME_DOCS_LOCAL_DIR, baked into the image). A real deploy MUST set
      # HOME_DOCS_R2_BUCKET + endpoint + keys instead: config refuses to start in
      # production without them, because the local store has no backup coverage.
      HOME_DOCS_R2_BUCKET: ${HOME_DOCS_R2_BUCKET:-}
      HOME_DOCS_R2_ENDPOINT: ${HOME_DOCS_R2_ENDPOINT:-}
      HOME_DOCS_R2_ACCESS_KEY_ID: ${HOME_DOCS_R2_ACCESS_KEY_ID:-}
      HOME_DOCS_R2_SECRET_ACCESS_KEY: ${HOME_DOCS_R2_SECRET_ACCESS_KEY:-}
      # Mirror target for the daily blob backup (D45) — Litestream cannot cover a
      # blob bucket. Empty disables mirroring; the reconciliation pass still runs.
      HOME_DOCS_R2_BACKUP_BUCKET: ${HOME_DOCS_R2_BACKUP_BUCKET:-}
      # A Go duration, not a cron expression. Default 24h (daily).
      HOME_DOCS_MIRROR_CRON: ${HOME_DOCS_MIRROR_CRON:-24h}
      HOME_DOCS_MAX_UPLOAD_MB: ${HOME_DOCS_MAX_UPLOAD_MB:-50}
      # Office→PDF previews run in the gotenberg sidecar below. Unset it and Office
      # files simply stay download-only — nothing else breaks.
      HOME_DOCS_GOTENBERG_URL: ${HOME_DOCS_GOTENBERG_URL:-http://gotenberg:3000}
      HOME_DOCS_PREVIEW_ENABLED: ${HOME_DOCS_PREVIEW_ENABLED:-true}

      # --- v5: Web Push + the summary scheduler --------------------------------
      # The VAPID keypair identifies this server to every browser push service.
      # Generate ONCE (`go run ./cmd/vapidgen`) and keep it: rotating it silently
      # invalidates every existing subscription, and each device has to opt in
      # again. Left empty, push is simply disabled — the rest of the app runs
      # untouched and the settings panel says so.
      HOME_VAPID_PUBLIC_KEY: ${HOME_VAPID_PUBLIC_KEY:-}
      HOME_VAPID_PRIVATE_KEY: ${HOME_VAPID_PRIVATE_KEY:-}
      HOME_VAPID_SUBJECT: ${HOME_VAPID_SUBJECT:-}
      # Collapse a burst of one trigger rule's matches into a single push.
      HOME_NOTIF_COALESCE_DEFAULT: ${HOME_NOTIF_COALESCE_DEFAULT:-60}
      # Delivery log retention; 0 = keep forever. Operational, not audit.
      HOME_NOTIF_DELIVERY_RETENTION_DAYS: ${HOME_NOTIF_DELIVERY_RETENTION_DAYS:-30}
      # Prune a subscription that has been failing continuously this long.
      HOME_NOTIF_MAX_FAILDAYS: ${HOME_NOTIF_MAX_FAILDAYS:-14}
      # EXTRA push-service hostnames a subscription endpoint may name, on top of
      # the built-in vendor list (Google, Mozilla, Apple, WNS). The endpoint
      # decides where this server POSTs, so it is allowlisted rather than taken
      # on trust; this is the escape hatch for a browser the built-in list has
      # not caught up with. Bare hostnames, comma-separated — never URLs.
      HOME_PUSH_ENDPOINT_HOSTS: ${HOME_PUSH_ENDPOINT_HOSTS:-}
      # Scheduler granularity (1–60s; slots are wall-clock minutes) and how late a
      # slot missed during a restart may still fire.
      HOME_SCHED_TICK_SECONDS: ${HOME_SCHED_TICK_SECONDS:-60}
      HOME_SCHED_CATCHUP_GRACE: ${HOME_SCHED_CATCHUP_GRACE:-120}
    volumes:
      - home-data:/data
    ports:
      - "7999:7999"
    depends_on:
      - gotenberg
    restart: unless-stopped

  # Headless LibreOffice as a service: the documents preview worker POSTs an Office
  # file to /forms/libreoffice/convert and gets a PDF back. Internal only — it is
  # never routed publicly, and it holds no state.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: tilcer-home-gotenberg
    # --api-timeout must exceed HOME_DOCS_PREVIEW_TIMEOUT_SEC (default 60s) so the
    # app's own timeout is the one that fires.
    command:
      - gotenberg
      - --api-timeout=90s
      - --libreoffice-restart-after=10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite bakes VITE_* at build time; the Nginx runtime image can't see env.
      args:
        VITE_REAL_AUTH: ${VITE_REAL_AUTH:-false}
        VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-}
        # No Traefik locally, so bake the config that proxies /api + /ws to the
        # `backend` service — keeps the SPA same-origin on :7001. (Baked, not
        # mounted: a Coolify compose deploy can't bind-mount repo files.)
        NGINX_CONF: nginx.harness.conf
    image: tilcer-home-frontend:dev
    container_name: tilcer-home-frontend
    ports:
      - "7001:80"
    depends_on:
      - backend
    restart: unless-stopped

  # MinIO stands in for R2 so the real S3 code path can be exercised locally
  # (the blobstore contract test runs against it via HOME_TEST_S3_ENDPOINT, and the
  # backend can be pointed at it with HOME_DOCS_R2_*). Off by default:
  #   docker compose --profile s3 up
  minio:
    image: minio/minio:latest
    container_name: tilcer-home-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  home-data:
  minio-data:
