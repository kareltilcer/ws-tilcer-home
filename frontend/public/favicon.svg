<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Black & white family-home favicon: house sheltering husband, wife, cat & dog -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  <g fill="#000000" stroke="#000000" stroke-linejoin="round" stroke-linecap="round">
    <!-- House -->
    <path d="M5 27 L32 5 L59 27 Z" fill="none" stroke-width="3"/>
    <path d="M9 27 L9 57 L55 57 L55 27" fill="none" stroke-width="3"/>

    <!-- Woman (A-line dress) -->
    <circle cx="25" cy="32.5" r="3.2" stroke="none"/>
    <path stroke="none" d="M21 37 Q25 35 29 37 L31 52 L28 52 L28 56 L26 56 L26 52 L24 52 L24 56 L22 56 L22 52 L19 52 Z"/>

    <!-- Man -->
    <circle cx="39" cy="32" r="3.4" stroke="none"/>
    <path stroke="none" d="M33 56 L33 41 Q33 36 39 36 Q45 36 45 41 L45 56 L41.5 56 L41.5 47 L36.5 47 L36.5 56 Z"/>

    <!-- Dog (front-left, facing right, floppy ear, perky tail) -->
    <ellipse cx="16" cy="50.5" rx="6" ry="3.2" stroke="none"/>
    <circle cx="23" cy="48.5" r="3.1" stroke="none"/>
    <ellipse cx="26" cy="49.5" rx="2" ry="1.4" stroke="none"/>
    <path stroke="none" d="M22 45 L20.5 49.8 L23 49 Z"/>
    <rect x="12" y="50.5" width="1.6" height="6.5" rx="0.6" stroke="none"/>
    <rect x="14.2" y="50.5" width="1.6" height="6.5" rx="0.6" stroke="none"/>
    <rect x="21.4" y="50" width="1.6" height="7" rx="0.6" stroke="none"/>
    <rect x="23.6" y="50" width="1.6" height="7" rx="0.6" stroke="none"/>
    <path stroke="none" d="M10.5 50.5 L8.3 45.2 L11 47.8 Z"/>

    <!-- Cat (front-right, facing left, pointy ears, tall curled tail) -->
    <ellipse cx="47" cy="51.5" rx="5" ry="2.8" stroke="none"/>
    <circle cx="41" cy="49" r="3" stroke="none"/>
    <path stroke="none" d="M38.6 45.2 L39.6 48.8 L41 47.6 Z"/>
    <path stroke="none" d="M43.4 45.2 L42.4 48.8 L41 47.6 Z"/>
    <rect x="40" y="52" width="1.5" height="5" rx="0.6" stroke="none"/>
    <rect x="42.2" y="52" width="1.5" height="5" rx="0.6" stroke="none"/>
    <rect x="47.5" y="52.5" width="1.5" height="4.5" rx="0.6" stroke="none"/>
    <rect x="49.5" y="52.5" width="1.5" height="4.5" rx="0.6" stroke="none"/>
    <path d="M51 52 C55 51 54.5 43 51.5 42.5" fill="none" stroke-width="2.4"/>
  </g>
</svg>
