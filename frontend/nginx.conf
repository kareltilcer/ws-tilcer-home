# Static SPA image for the `home` frontend, mirroring ws-tilcer-fin: Nginx serves
# the built bundle and NOTHING else. The API and websocket are NOT proxied here.
#
# In production the SPA and the Go API share one origin (home.tilcer.cz): the
# Coolify/Traefik layer routes home.tilcer.cz/api and /ws to the backend app, and
# everything else to this image. The SPA calls them host-relative (relative /api,
# websocket to location.host — see src/api/client.ts and ws.ts), so there is no
# nginx proxy and no CORS. This is exactly the ws-tilcer-fin shape.
#
# The offline docker-compose harness has no Traefik, so it mounts
# frontend/nginx.harness.conf over this file to add a /api + /ws proxy to the
# `backend` service (see docker-compose.yml).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: serve index.html for unknown paths so deep links work.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # v5 (D72): the service worker and the manifest must NEVER be cached long.
  # These blocks come BEFORE the generic asset rule below, which would otherwise
  # match sw.js by extension and pin a year-old service worker in place — the app
  # would then never pick up a new build, and silent auto-update would silently
  # do nothing. Registered as exact-match locations so they win over the regex.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Aggressive caching for hashed assets; HTML stays fresh.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
