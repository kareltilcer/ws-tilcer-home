# Local docker-compose harness ONLY — mounted over /etc/nginx/conf.d/default.conf
# in docker-compose.yml. Production does NOT use this file.
#
# In production the Coolify/Traefik layer routes home.tilcer.cz/api and /ws to the
# backend app on the same origin (see frontend/nginx.conf). Locally there is no
# Traefik, so Nginx reverse-proxies to the compose `backend` service instead —
# keeping the harness same-origin on :7001 (home's SPA uses relative /api + /ws).
# `backend` resolves via compose DNS; this coupling is fine here (unlike Coolify).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:7999;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://backend:7999;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
