# Local docker-compose harness ONLY — mounted over /etc/nginx/conf.d/default.conf
# in docker-compose.yml. Production does NOT use this file.
#
# In production the Coolify/Traefik layer routes home.tilcer.cz/api and /ws to the
# backend app on the same origin (see frontend/nginx.conf). Locally there is no
# Traefik, so Nginx reverse-proxies to the compose `backend` service instead —
# keeping the harness same-origin on :7001 (home's SPA uses relative /api + /ws).
# `backend` resolves via compose DNS; this coupling is fine here (unlike Coolify).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Document uploads run to HOME_DOCS_MAX_UPLOAD_MB (50 by default). Nginx's own
    # default is 1m, and it rejects the request itself — the backend never sees it and
    # the SPA gets an HTML 413 it cannot parse, so the user is told the file exceeded
    # a limit it is nowhere near. A fixed number here would have to be kept in step
    # with an env var nginx cannot read, and would tell that same lie the moment the
    # operator raised the app cap past it. 0 disables the nginx limit entirely and
    # leaves the app as the single authority: it enforces the cap while streaming and
    # answers with a JSON 413 the SPA turns into the real message.
    client_max_body_size 0;
    proxy_pass http://backend:7999;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://backend:7999;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
